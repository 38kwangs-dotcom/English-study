<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#157a78"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>English Adventure Family</title></head><body>
<header><div class="brand">🧭 <span>English Adventure<small>FAMILY</small></span></div><div><button id="parentBtn">👩 Parent</button><button id="installBtn" hidden>📱 Install</button></div></header>
<section class="hero"><div><label>👑 SECOND'S PRINCESS MOVIE</label><h1>Tap. Watch.<br><i>Say hello!</i></h1><p>보고 · 듣고 · 따라 말하고 · 별을 받아요!</p><div class="goal">Today's Goal <b id="goal">0 / 3 ⭐</b><div><i id="bar"></i></div></div></div><div class="princess">👸✨</div></section>
<main><section class="card"><div class="video"><video id="video" playsinline preload="metadata"></video><div id="placeholder">🎬<small>videos 폴더에 영상을 넣어주세요</small></div></div><div class="controls"><span id="status"></span><button class="play" id="play">▶ Play</button></div><div class="sentence"><strong id="en"></strong><span id="ko"></span></div><h3>PICK A STORY <small>그림을 보고 골라요</small></h3><div id="stories" class="stories"></div><div class="listen"><span id="phrase"></span><button id="listen">🔊 듣기</button></div><div class="actions"><button id="watch">🎬<small>보기 3회</small></button><button id="slow">👂<small>천천히 듣기</small></button><button id="say">🗣️<small>따라 말하기</small></button><button id="star">⭐<small>별 받기</small></button></div><p id="message"></p></section>
<div class="tools"><button id="surprise">🎲 Surprise</button><button id="quizBtn">🎯 Mini Quiz</button><button id="reset">↻ 초기화</button></div><section id="quiz" class="quiz hidden"><h2>🎯 Quick Quiz</h2><p id="question"></p><div id="answers"></div><b id="quizMessage"></b></section></main>
<div id="modal" class="modal hidden"><div class="panel"><button class="close" id="close">×</button><h2>👩 Parent Dashboard</h2><div class="stats"><div><b id="stars">0</b>⭐ Stars</div><div><b id="watches">0</b>🎬 Watches</div><div><b id="speaks">0</b>🗣️ Speaking</div></div><h3>Story Progress</h3><div id="progress"></div><small>기록은 이 기기의 브라우저에 저장됩니다.</small></div></div><script src="app.js"></script></body></html>
