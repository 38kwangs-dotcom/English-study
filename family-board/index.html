<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF6D6">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>우리집 패밀리 보드!</title>
<style>
:root{
  --cream:#FFFBF0; --cream2:#FFF5D8; --ink:#4B3B2A; --ink-soft:#8C7A64; --ink-mute:#B3A28B;
  --yellow:#FFE9A6; --yellow-d:#F2BE3C; --yellow-soft:#FFF7DB;
  --pink:#FFD9E2; --pink-d:#EE7F9B; --pink-soft:#FFF1F4;
  --mint:#CFEBC2; --mint-d:#6FBE7E; --mint-soft:#F1FAEB;
  --lav:#E4DCF8; --lav-d:#9E86DE; --lav-soft:#F6F2FF;
  --sky:#D9ECFB; --sky-d:#6FB3E0; --peach:#FFE0C7; --peach-d:#E89A5C;
  --card:#FFFFFF; --line:#F2E6CC;
  --shadow:0 10px 24px rgba(198,164,96,.13), 0 2px 6px rgba(198,164,96,.07);
  --shadow-sm:0 4px 12px rgba(198,164,96,.10);
  --r:26px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1200px 620px at 8% -12%, #FFF3C9 0%, rgba(255,243,201,0) 62%),
    radial-gradient(900px 520px at 102% -6%, #FFE6EC 0%, rgba(255,230,236,0) 58%),
    linear-gradient(180deg,#FFFDF6 0%,#FFF8E6 100%);
  background-attachment:fixed;
  min-height:100vh;font-size:16px;line-height:1.45;
  padding-bottom:48px;
}
.wrap{max-width:1340px;margin:0 auto;padding:0 20px}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
h1,h2,h3,h4,p{margin:0}
::selection{background:#FFE9A6}

/* ---------- header ---------- */
.hd{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,rgba(255,250,232,.97),rgba(255,247,220,.92));
  border-bottom:1px solid rgba(240,222,180,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hd-in{max-width:1340px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hd-left{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(160deg,#FFF2B8,#FFE07A);
  display:grid;place-items:center;font-size:23px;box-shadow:var(--shadow-sm);flex:0 0 auto}
.hd h1{font-size:20px;font-weight:800;letter-spacing:-.4px;white-space:nowrap}
.hd-sub{font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-top:1px}
.hd-right{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.clock{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);
  border-radius:16px;padding:5px 13px 5px 9px;box-shadow:var(--shadow-sm)}
.clock-ico{font-size:18px}
.clock b{display:block;font-size:15px;font-weight:800;letter-spacing:-.2px;white-space:nowrap}
.clock small{display:block;font-size:10.5px;color:var(--ink-soft);font-weight:600;white-space:nowrap}
.user-pill{display:flex;align-items:center;gap:8px;background:#FFE9A6;border:1.5px solid #F6D06A;
  border-radius:16px;padding:5px 12px 5px 6px;font-weight:800;font-size:14px;box-shadow:var(--shadow-sm)}
.user-pill .av{width:28px;height:28px;border-radius:10px;overflow:hidden;background:#fff;flex:0 0 auto}
.user-pill .av svg{width:100%;height:100%;display:block}
.user-pill .caret{font-size:10px;color:#A98A3C}
.icon-btn{width:40px;height:40px;border-radius:14px;background:#fff;border:1.5px solid var(--line);
  display:grid;place-items:center;font-size:18px;box-shadow:var(--shadow-sm);transition:transform .15s}
.icon-btn:active{transform:scale(.94)}
.admin-flag{font-size:10px;font-weight:800;background:#fff;border:1px solid #EADFC6;border-radius:9px;padding:1px 6px;color:var(--ink-soft)}

/* ---------- banner ---------- */
.banner{margin:14px 0 0;display:flex;align-items:center;gap:12px;cursor:pointer;
  background:linear-gradient(100deg,#FFE6EC,#FFD9E2 60%,#FFE9A6);border:1.5px solid #F7C3D1;
  border-radius:20px;padding:12px 16px;box-shadow:var(--shadow);animation:slideDown .35s ease}
.banner .b-emoji{font-size:26px;animation:wiggle 1.6s infinite}
.banner b{font-size:15.5px}
.banner p{font-size:12.5px;color:#9C6D7E;font-weight:600}
.banner .go{margin-left:auto;background:#fff;border-radius:13px;padding:8px 14px;font-weight:800;font-size:13px;color:var(--pink-d);box-shadow:var(--shadow-sm);white-space:nowrap}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes wiggle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}

/* ---------- kids ---------- */
.kids-band{margin-top:16px;background:linear-gradient(170deg,#DCF0C6,#CBE8B1 70%,#C3E3A7);
  border-radius:34px;padding:14px;box-shadow:inset 0 2px 0 rgba(255,255,255,.7),var(--shadow)}
.kids{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.kids.single{grid-template-columns:minmax(0,1fr);max-width:660px;margin:0 auto}
.kid-card{background:#fff;border-radius:26px;padding:14px 16px;border:2px solid #fff;
  box-shadow:0 6px 16px rgba(120,150,90,.16);display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.kid-card::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:24px;
  background:radial-gradient(120px 60px at 100% 0,rgba(255,233,166,.55),transparent 70%)}
.kid-top{display:flex;align-items:center;gap:11px}
.kid-avatar{width:62px;height:62px;border-radius:20px;background:#FFF8EC;border:2px solid #F6E7C8;
  padding:2px;flex:0 0 auto;box-shadow:var(--shadow-sm)}
.kid-avatar svg{width:100%;height:100%;display:block}
.kid-id{min-width:0;flex:1}
.kid-name{font-size:19px;font-weight:900;letter-spacing:-.4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kid-nick{font-size:11.5px;font-weight:700;color:#fff;background:var(--pink-d);border-radius:8px;padding:1px 7px}
.kid-age{font-size:11.5px;color:var(--ink-soft);font-weight:700;margin-top:1px}
.star-pill{display:flex;align-items:center;gap:5px;background:#FFF6D6;border:1.5px solid #F7DFA0;
  border-radius:15px;padding:6px 12px;font-weight:900;font-size:19px;color:#B98A16;line-height:1;flex:0 0 auto}
.star-pill span{font-size:15px}
.star-pill.bump{animation:bump .5s}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.22) rotate(-4deg)}100%{transform:scale(1)}}
.goal{display:flex;align-items:center;gap:9px}
.goal-bar{flex:1;height:11px;border-radius:99px;background:#F4EEDF;overflow:hidden}
.goal-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#FFDA62,#F5B93B);transition:width .4s}
.goal-txt{font-size:11px;font-weight:800;color:var(--ink-soft);white-space:nowrap}
.kid-stats{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:5px;background:#FFFBF0;border:1px solid #F3E7CE;border-radius:11px;
  padding:4px 9px;font-size:12px;font-weight:700;color:var(--ink-soft)}
.chip b{color:var(--ink);font-weight:900}
.kid-cta{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--kid-soft,#F3FAEC);
  border:1.5px solid var(--kid-line,#DCEEC9);border-radius:14px;padding:8px 12px;font-weight:800;font-size:13px;width:100%}
.kid-cta b{font-size:13px;color:var(--kid-deep,#5C9C5A)}
.kid-cta .arw{font-size:12px;color:var(--ink-mute)}

/* ---------- grid & cards ---------- */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:16px;align-items:start}
.card{background:var(--card);border-radius:var(--r);border:1.5px solid #fff;box-shadow:var(--shadow);
  padding:16px 17px;display:flex;flex-direction:column;gap:11px;min-width:0;position:relative}
.span2{grid-column:span 2}
.span4{grid-column:span 4}
.card-head{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.ico{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:20px;
  background:var(--ic,#FFF3D0);flex:0 0 auto}
.card-head h3{font-size:16.5px;font-weight:900;letter-spacing:-.3px;white-space:nowrap}
.card-head p{font-size:11.5px;color:var(--ink-soft);font-weight:700;margin-top:1px}
.card-head>div{min-width:0}
.more{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--ink-soft);background:#FFFBF0;
  border:1px solid #F0E5CD;border-radius:10px;padding:5px 9px;white-space:nowrap}
.more:active{transform:scale(.96)}
.card-soft{background:linear-gradient(170deg,#FFF8E2,#FFF3D2)}
.card-soft .big-btn{margin-top:auto}

/* 학습 마을 바로가기 */
.villages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.village{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:17px;background:#FFFDF6;
  border:1.5px solid #F1E6CE;box-shadow:var(--shadow-sm);color:inherit;text-decoration:none;
  transition:transform .12s,background .18s}
.village:active{transform:scale(.98)}
.village .v-ico{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:20px;
  background:var(--vb,#EFE7FF);flex:0 0 auto}
.village .v-body{flex:1;min-width:0}
.village b{display:block;font-size:13.5px;font-weight:900;letter-spacing:-.2px;color:var(--ink)}
.village small{display:block;margin-top:1px;font-size:10.5px;font-weight:700;color:var(--ink-soft);line-height:1.35}
.village .v-go{flex:0 0 auto;font-size:13px;font-weight:900;color:var(--ink-mute)}
.village.ielts{background:linear-gradient(160deg,#F7FBFF,#EDF5FE);border-color:#CFE3F6}
@media (max-width:640px){ .villages{grid-template-columns:1fr} }

/* checklist rows */
.rows{display:flex;flex-direction:column;gap:7px}
.row{display:flex;align-items:center;gap:10px;background:#FFFDF6;border:1.5px solid #F3E9D3;
  border-radius:15px;padding:8px 11px;text-align:left;width:100%;transition:transform .12s,background .18s}
.row:active{transform:scale(.985)}
.row .r-ico{font-size:17px;width:22px;text-align:center;flex:0 0 auto}
.row .r-label{font-size:13.5px;font-weight:800;flex:1;min-width:0}
.row .box{width:24px;height:24px;border-radius:9px;border:2px solid #E4D6B8;display:grid;place-items:center;
  font-size:13px;color:transparent;flex:0 0 auto;background:#fff;transition:all .18s}
.row.on{background:#F2FAEA;border-color:#CDE7B8}
.row.on .r-label{color:#6C8F5E}
.row.on .box{background:#8CCB7E;border-color:#8CCB7E;color:#fff}
.pill-badge{font-size:10.5px;font-weight:900;border-radius:8px;padding:2px 7px;background:#FFE9A6;color:#9A6D0E}

/* pictograms */
.pics{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.pic{width:100%;aspect-ratio:1/1;height:auto;border-radius:15px;display:grid;place-items:center;font-size:21px;background:var(--pb,#FFF3D0);
  border:1.5px solid rgba(255,255,255,.9);box-shadow:0 3px 8px rgba(190,160,100,.16);transition:transform .14s}
.pic:active{transform:scale(.92)}
.pic-lg{width:auto;height:auto;min-height:88px;flex-direction:column;gap:2px;padding:10px 6px;font-size:30px;justify-content:center}
.pics-lg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pic-lg .pt{font-size:12.5px;font-weight:800;line-height:1.25;text-align:center;color:var(--ink)}
.pic-lg.sel{border-color:var(--pink-d);box-shadow:0 0 0 3px rgba(238,127,155,.22),var(--shadow)}

/* mail extras */
.mail-stat{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--ink-soft);flex-wrap:wrap}
.dot-sep{width:3px;height:3px;border-radius:99px;background:#DCCDAE}
.big-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;border-radius:16px;
  font-weight:900;font-size:15px;background:linear-gradient(160deg,#FFB6C9,#F58BA6);color:#fff;
  box-shadow:0 6px 14px rgba(238,127,155,.32);transition:transform .12s,filter .2s}
.big-btn:active{transform:scale(.98)}
.big-btn.off{filter:grayscale(.55) opacity(.75)}
.big-btn.mint{background:linear-gradient(160deg,#A9DF9C,#79C46F);box-shadow:0 6px 14px rgba(110,180,100,.3)}
.big-btn.soft{background:#FFF3F6;color:var(--pink-d);border:1.5px solid #FBD3DE;box-shadow:none}
.big-btn.sm{min-height:40px;font-size:13.5px;border-radius:13px}
.ghost{display:inline-flex;align-items:center;gap:6px;background:#FFFBF0;border:1.5px solid #F1E6CE;
  border-radius:12px;padding:7px 12px;font-weight:800;font-size:12.5px;color:var(--ink-soft)}
.ghost:active{transform:scale(.97)}

/* food */
.foods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.food{position:relative;border-radius:16px;background:#FFFDF6;border:1.5px solid #F2E8D2;
  padding:9px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .12s,background .2s}
.food .f-ico{font-size:23px;filter:grayscale(.25) opacity(.75);transition:filter .2s}
.food .f-name{font-size:10px;font-weight:800;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-align:center;max-width:100%}
.food .f-cnt{position:absolute;top:3px;right:4px;background:#FFF0C2;color:#A97C13;font-size:9px;font-weight:900;
  min-width:14px;text-align:center;border-radius:7px;padding:0 3px;z-index:2}
.food.on{background:#F1FAEA;border-color:#CDE7B8}
.food.on .f-ico{filter:none}
.food.on .f-name{color:#5C8F4E}
.food:active{transform:scale(.95)}

/* growth */
.scene{width:100%;height:78px;display:block;border-radius:16px;overflow:hidden}
.grow-nums{display:flex;gap:8px}
.grow-num{flex:1;background:#FFFBF0;border:1.5px solid #F3E7CE;border-radius:14px;padding:7px 9px}
.grow-num small{font-size:10.5px;color:var(--ink-soft);font-weight:800;display:block}
.grow-num b{font-size:17px;font-weight:900;letter-spacing:-.3px}
.grow-num b i{font-size:11px;font-style:normal;color:var(--ink-soft);margin-left:2px}
.delta{font-size:10.5px;font-weight:800;color:#6FAF60}

/* calendar */
.cal-head{display:flex;align-items:center;gap:6px}
.cal-head b{font-size:14px;font-weight:900}
.cal-nav{margin-left:auto;display:flex;gap:4px}
.cal-nav button{width:26px;height:26px;border-radius:9px;background:#FFFBF0;border:1px solid #F0E5CD;font-size:12px;display:grid;place-items:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .wd{text-align:center;font-size:10px;font-weight:900;color:var(--ink-mute);padding:2px 0}
.cal.mini .day{aspect-ratio:auto;height:32px;font-size:11px;border-radius:9px}
.cal.mini .day .evd{bottom:2px;width:3.5px;height:3.5px}
.cal .wd.sun{color:#E08A8A}.cal .wd.sat{color:#8AA6D8}
.day{position:relative;aspect-ratio:1/1;border-radius:10px;display:grid;place-items:center;font-size:11.5px;font-weight:800;
  color:var(--ink);background:transparent;border:1px solid transparent}
.day.dim{color:#D9CDB6}
.day.today{background:#FFE9A6;box-shadow:inset 0 0 0 1.5px #F2BE3C}
.day.has{background:#F7F4FF;border-color:#E7DFF8}
.day.has.trip{background:#E8F5FF;border-color:#C4E3F7}
.day .evd{position:absolute;bottom:3px;width:4px;height:4px;border-radius:99px;background:var(--lav-d)}
.day.has.trip .evd{background:var(--sky-d)}
.day:active{transform:scale(.93)}

/* upcoming */
.up{display:flex;align-items:center;gap:10px;background:#FFFDF6;border:1.5px solid #F3E9D3;border-radius:15px;padding:8px 10px}
.up.trip{background:linear-gradient(100deg,#EAF6FF,#DCEFFF);border-color:#C6E4F8}
.up .up-ico{font-size:20px;width:26px;text-align:center}
.up .up-t{flex:1;min-width:0}
.up .up-t b{display:block;font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up .up-t small{font-size:10.5px;color:var(--ink-soft);font-weight:700}
.dday{font-size:12px;font-weight:900;color:#fff;background:var(--sky-d);border-radius:10px;padding:3px 8px;white-space:nowrap}
.dday.soon{background:#F2BE3C}
.dday.done{background:#D8CBB2}

/* pills / meds */
.med-row{display:flex;align-items:center;gap:9px;background:#FFFDF6;border:1.5px solid #F3E9D3;border-radius:15px;padding:8px 10px}
.med-row .m-name{flex:1;min-width:0;font-size:12.5px;font-weight:800}
.med-row .m-name small{display:block;font-size:10.5px;color:var(--ink-mute);font-weight:700}
.med-chips{display:flex;gap:5px}
.med-chip{font-size:11px;font-weight:800;border-radius:10px;padding:5px 8px;background:#F4EEDF;color:#9C8C74;border:1.5px solid transparent}
.med-chip.on{background:#8CCB7E;color:#fff;border-color:#8CCB7E}
.med-chip:active{transform:scale(.95)}

/* progress bars per kid (todo card) */
.kid-prog{display:flex;align-items:center;gap:8px}
.kid-prog .kp-name{font-size:12px;font-weight:900;width:52px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kid-prog .kp-bar{flex:1;height:9px;border-radius:99px;background:#F4EEDF;overflow:hidden}
.kid-prog .kp-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#B6DFA6,#79C46F);transition:width .4s}
.kid-prog .kp-n{font-size:11px;font-weight:900;color:var(--ink-soft);width:32px;text-align:right}

/* admin panel */
.qa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.qa button{background:#FFFDF6;border:1.5px solid #F3E9D3;border-radius:14px;padding:10px 8px;font-size:12.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s}
.qa button:active{transform:scale(.96)}

/* ---------- modal ---------- */
.modal-open{overflow:hidden}
.backdrop{position:fixed;inset:0;background:rgba(74,59,42,.34);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:18px;z-index:100;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:linear-gradient(180deg,#FFFDF7,#FFFBF0);border-radius:30px;width:min(960px,100%);max-height:92vh;
  overflow:auto;box-shadow:0 30px 70px rgba(80,60,30,.28);border:2px solid #fff;animation:pop .22s cubic-bezier(.2,1.2,.4,1);
  -webkit-overflow-scrolling:touch}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.sheet.narrow{width:min(560px,100%)}
.sheet.wide{width:min(1100px,100%)}
.sh-head{display:flex;align-items:flex-start;gap:11px;padding:18px 20px 12px;position:sticky;top:0;
  background:linear-gradient(180deg,#FFFDF7 76%,rgba(255,253,247,.75));backdrop-filter:blur(6px);z-index:2}
.sh-head h2{font-size:19px;font-weight:900;letter-spacing:-.4px}
.sh-head p{font-size:12px;color:var(--ink-soft);font-weight:700;margin-top:2px}
.sh-close{margin-left:auto;width:34px;height:34px;border-radius:12px;background:#fff;border:1.5px solid var(--line);
  font-size:16px;display:grid;place-items:center;flex:0 0 auto}
.sh-body{padding:0 20px 22px;display:flex;flex-direction:column;gap:14px}
.sec{background:#fff;border:1.5px solid #F4E9D2;border-radius:20px;padding:14px}
.sec h4{font-size:13px;font-weight:900;color:var(--ink-soft);letter-spacing:.2px;margin-bottom:9px;
  display:flex;align-items:center;gap:6px}
.hint{font-size:11.5px;color:var(--ink-mute);font-weight:700;line-height:1.5}
.cols{display:grid;gap:12px}
.cols.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.kid-col{background:#FFFBF0;border:1.5px solid #F3E7CE;border-radius:20px;padding:12px}
.kid-col .kc-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.kid-col .kc-av{width:38px;height:38px;border-radius:13px;overflow:hidden;background:#fff;border:1.5px solid #F2E3C6;flex:0 0 auto}

.speak-btn{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1.5px solid #EADFC6;border-radius:11px;

/* settings */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}

.field input,.field select{height:42px;border-radius:12px;border:1.5px solid #F0E5CD;background:#FFFDF6;padding:0 12px;
  font-size:14px;font-family:inherit;font-weight:700;color:var(--ink);width:100%}
.field input:focus,.field select:focus{outline:none;border-color:#F5C97E;background:#fff}
.field-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field-row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.avatar-pick{display:flex;gap:8px;flex-wrap:wrap}
.av-opt{width:52px;height:52px;border-radius:16px;background:#FFF8EC;border:2px solid #F1E4C9;overflow:hidden;padding:1px}
.av-opt svg{width:100%;height:100%;display:block}
.av-opt.on{border-color:var(--pink-d);box-shadow:0 0 0 3px rgba(238,127,155,.16)}
.switch{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:800;padding:9px 0}
.switch input{width:20px;height:20px;accent-color:#8CCB7E}
.dev-opt{display:flex;align-items:center;gap:11px;width:100%;background:#FFFDF6;border:2px solid #F1E6CE;
  border-radius:18px;padding:12px 14px;text-align:left;margin-bottom:9px}
.dev-opt.on{border-color:#F2BE3C;background:#FFF8DF;box-shadow:0 0 0 3px rgba(242,190,60,.14)}
.dev-opt .d-ico{font-size:24px}
.dev-opt b{font-size:14.5px;display:block;font-weight:900}
.dev-opt small{font-size:11px;color:var(--ink-soft);font-weight:700}
.dev-opt .chk{margin-left:auto;font-size:16px;color:#F2BE3C}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:260px;margin:0 auto}
.pinpad button{height:56px;border-radius:16px;background:#FFFDF6;border:1.5px solid #F0E5CD;font-size:20px;font-weight:900}
.pinpad button:active{transform:scale(.95);background:#FFF3D2}
.pin-dots{display:flex;justify-content:center;gap:10px;margin:6px 0 14px}
.pin-dots i{width:14px;height:14px;border-radius:99px;background:#EFE4CC;display:block}
.pin-dots i.on{background:#F2BE3C}
.role-opt{display:flex;align-items:center;gap:12px;width:100%;background:#FFFDF6;border:2px solid #F1E6CE;

.role-opt .ro-av{width:44px;height:44px;border-radius:14px;overflow:hidden;background:#fff;border:1.5px solid #F1E4C9;flex:0 0 auto}
.role-opt .ro-av svg{width:100%;height:100%;display:block}
.role-opt b{font-size:14.5px;display:block;font-weight:900}
.role-opt small{font-size:11px;color:var(--ink-soft);font-weight:700}

.role-opt .em{margin-left:auto;font-size:19px}

/* toast */
#toastRoot{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:rgba(74,59,42,.94);color:#fff;font-size:13.5px;font-weight:800;padding:11px 18px;border-radius:99px;
  box-shadow:0 10px 24px rgba(60,45,25,.3);animation:toastIn .28s cubic-bezier(.2,1.2,.4,1)}
.toast.ok{background:rgba(111,175,96,.96)}
.toast.warn{background:rgba(224,138,138,.96)}
@keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.burst{position:fixed;z-index:210;font-size:24px;pointer-events:none;animation:burstUp 1s ease-out forwards}
@keyframes burstUp{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-120px) scale(1.15)}}

/* ---------- 가족 통화 & 가족 수다 ---------- */
.sync-hd{cursor:pointer;font-size:10.5px;padding:5px 9px}

.sync-chip.bad{color:#B25F6F;border-color:#F1C9D2;background:#FFF4F6}
.card.comm{grid-column:1/-1;background:linear-gradient(165deg,#FFF9E9,#FFEFD8 58%,#FFECEF);border:1.5px solid #fff}
.comm .members{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}

.mem:active{transform:scale(.97)}

.mem .m-btns button{flex:1;border-radius:11px;padding:7px 0;font-size:15px;font-weight:900;background:#FFF3D2;border:1px solid #F0DCA8;transition:transform .12s}

.cb .c-tm{display:block;font-size:9.5px;color:var(--ink-mute);font-weight:700;margin-top:3px;text-align:right}
.cb.me{flex-direction:row-reverse}
.cb.me .c-body{background:#FFF1D6;border-color:#F4DFA6}
.chat-in{display:flex;gap:6px}
.chat-in input{flex:1;min-width:0;height:44px;border-radius:13px;border:2px solid #F1E6CE;background:#FFFDF6;padding:0 12px;font-size:14px;font-family:inherit;font-weight:700;color:var(--ink)}
.chat-in input:focus{outline:none;border-color:#F5C97E;background:#fff}
.chat-in button{width:48px;border-radius:13px;background:#FFE9A6;border:1.5px solid #F0D083;font-size:17px;font-weight:900}

/* ---------- 통화 화면 ---------- */
#callRoot{position:fixed;inset:0;z-index:300;display:none}

.call-sheet{position:absolute;inset:0;background:linear-gradient(170deg,#463A2B,#2A231B);display:flex;flex-direction:column;color:#FFF8EA;overflow:hidden}

.call-timer.on{display:block}
.call-actions{padding:10px 18px calc(22px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:16px;align-items:center}
.cbtn{width:62px;height:62px;border-radius:99px;display:grid;place-items:center;font-size:24px;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.22);color:#fff;transition:transform .12s}
.cbtn:active{transform:scale(.93)}
.cbtn.off{background:#fff;color:#3E3327}
.cbtn.hang{background:#E2586E;border-color:#E2586E;width:72px;height:72px;font-size:22px}
.cbtn.ans{background:#5DBE7E;border-color:#5DBE7E;width:72px;height:72px;font-size:26px}
.call-note{margin:0 18px 6px;background:rgba(255,255,255,.1);border-radius:12px;padding:8px 11px;font-size:11.5px;font-weight:700;color:#EADFCB;text-align:center}
@media (max-width:1160px){ .card.span4{grid-column:1/-1} }
@media (max-width:820px){ .comm .members{grid-template-columns:repeat(2,minmax(0,1fr))} }

}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

<script>
/* =========================================================
   우리집 패밀리 보드!  (single-file app, localStorage 기반)
   ========================================================= */
window.__fbErr=[];
window.addEventListener('error',e=>{ try{ window.__fbErr.push(String(e.message)+' @'+e.lineno); }catch(_){} });
window.addEventListener('unhandledrejection',e=>{ try{ window.__fbErr.push('rejection: '+String((e.reason&&e.reason.message)||e.reason)); }catch(_){} });
const LS_KEY='familyBoard.v3';
const KIDS=['elder','younger'];
const WEEK=['일','월','화','수','목','금','토'];
const ROLES={

};
const RECIPIENTS={parents:{label:'엄마·아빠',emoji:'💗'},grandparents:{label:'할머니·할아버지',emoji:'🌷'}};
const ROUTINE=[
  {id:'toys',icon:'🧸',label:'장난감 정리'},
  {id:'homework',icon:'✏️',label:'숙제 확인'},

  {id:'rice',icon:'🍚',label:'밥'},
  {id:'soup',icon:'🍲',label:'국·찌개'},
  {id:'meat',icon:'🍗',label:'고기'},
  {id:'egg',icon:'🥚',label:'계란'},
  {id:'veg',icon:'🥦',label:'채소'},
  {id:'fruit',icon:'🍓',label:'과일'},
  {id:'milk',icon:'🥛',label:'우유'},
  {id:'water',icon:'💧',label:'물'}
];
const HOMESCHOOL={
  elder:[{id:'korean',icon:'📝',label:'받아쓰기 5개'},{id:'math',icon:'🔢',label:'수학 문제 10개'},
         {id:'english',icon:'🔤',label:'영어 단어 5개'},{id:'book',icon:'📚',label:'책 읽고 이야기하기'}],
  younger:[{id:'hangul',icon:'🅰️',label:'한글 놀이'},{id:'number',icon:'🧮',label:'숫자 놀이'},
           {id:'draw',icon:'🎨',label:'그림 그리기'},{id:'story',icon:'📖',label:'동화책 읽기'}]
};
const PICS=[
  {t:'보고 싶어요 💛',e:'💛',bg:'#FFF0BE'},
  {t:'사랑해요 ❤️',e:'❤️',bg:'#FFDCE3'},
  {t:'오늘 숙제 다 했어요 ⭐',e:'⭐',bg:'#E4F6D8'},
  {t:'맛있는 거 사주세요 🍓',e:'🍓',bg:'#FFE0E6'},
  {t:'오늘 재밌었어요 🎈',e:'🎈',bg:'#E3E9FF'},
  {t:'안아주세요 🐻',e:'🐻',bg:'#FFEBD3'}
];
const MOODS=['😊','🥰','😴','🤗','😆'];
const MAIL_WINDOW=3600*1000;
const LIMIT=3;

/* ---------- 작은 도구들 ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD=s=>{const p=String(s).split('-').map(Number);return new Date(p[0],(p[1]||1)-1,p[2]||1);};
const todayKey=()=>dkey(new Date());
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won=n=>Number(n||0).toLocaleString('ko-KR');
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const num=v=>{const n=Number(String(v).replace(/[^0-9.-]/g,''));return isFinite(n)?n:0;};
function fmtClock(d){
  const h=d.getHours(),m=d.getMinutes();
  const p=h<5?'새벽':h<9?'아침':h<12?'오전':h<14?'점심':h<18?'오후':h<21?'저녁':'밤';
  const k=((h+11)%12)+1;
  return `${p} ${k}시 ${pad(m)}분`;
}
function fmtDateKR(d){return `${d.getMonth()+1}월 ${d.getDate()}일 ${WEEK[d.getDay()]}요일`;}
function relTime(ts){
  const diff=Date.now()-ts;
  if(diff<60e3) return '방금 전';
  if(diff<3600e3) return `${Math.floor(diff/60e3)}분 전`;
  if(diff<86400e3) return `${Math.floor(diff/3600e3)}시간 전`;
  const d=new Date(ts);
  if(diff<172800e3) return '어제';
  return `${d.getMonth()+1}/${d.getDate()}`;
}
function dayDiff(a,b){ // a-b in days (dates only)
  return Math.round((parseD(a)-parseD(b))/86400000);
}
function ageOf(birth){

function loadState(){
  if(!storageOK) return defaultState();
  try{
    const raw=localStorage.getItem(LS_KEY);

  }catch(e){console.warn('[board] 불러오기 실패',e);return defaultState();}

function migrate(p){
  const base=defaultState();
  if(!p||typeof p!=='object') return base;
  p.v=3;
  p.device=Object.assign({user:'',locked:false,did:''},p.device||{});
  if(!p.device.did) p.device.did='d'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  p.chat=Array.isArray(p.chat)?p.chat.slice(-300):[];
  p.syncVer=Number(p.syncVer)||0;
  p.settings=Object.assign({limit:LIMIT,pin:'',onboarded:false},p.settings||{});
  p.cloud=Object.assign({url:'',key:''},p.cloud||{});
  p.drafts=Object.assign({mailText:'',mailPic:'',mailTo:'parents',sender:'elder',calDate:''},p.drafts||{});
  p.letters=Array.isArray(p.letters)?p.letters:[];
  p.events=Array.isArray(p.events)?p.events:base.events;
  p.cal=Object.assign({y:new Date().getFullYear(),m:new Date().getMonth()},p.cal||{});
  KIDS.forEach(k=>{
    p.kids=p.kids||{};
    p.kids[k]=Object.assign(defaultKid(k),p.kids[k]||{});
    const kd=p.kids[k];
    kd.routine=Object.assign({date:todayKey(),done:{}},kd.routine||{});
    kd.food=Object.assign({date:todayKey(),eaten:{},tried:{},totals:{}},kd.food||{});
    kd.pills=Object.assign({date:todayKey(),taken:{}},kd.pills||{});
    kd.home=Object.assign({date:todayKey(),done:{}},kd.home||{});
    if(!Array.isArray(kd.growth)) kd.growth=[];
    if(!Array.isArray(kd.sends)) kd.sends=[];
    if(!Array.isArray(kd.meds)||!kd.meds.length) kd.meds=defaultKid(k).meds;
  });
  return p;
}

function ensureToday(){
  const t=todayKey();

  KIDS.forEach(k=>{

    if(kd.home.date!==t){kd.home.done={};kd.home.date=t;changed=true;}
  });
  if(changed) save();
}

function foodDone(k){return FOODS.filter(f=>S.kids[k].food.eaten[f.id]).length;}
function sendsLastHour(k){
  const now=Date.now();
  S.kids[k].sends=(S.kids[k].sends||[]).filter(t=>now-t<MAIL_WINDOW);
  return S.kids[k].sends;
}
function limitOf(k){
  const kd=S.kids[k];
  if(kd.unlimited) return {unlimited:true,used:0,left:99,minLeft:0};
  const used=sendsLastHour(k).length;
  const left=Math.max(0,LIMIT-used);
  let minLeft=0;
  if(left===0&&used>0){
    const oldest=Math.min.apply(null,S.kids[k].sends.slice(-LIMIT));
    minLeft=Math.max(1,Math.ceil((MAIL_WINDOW-(Date.now()-oldest))/60000));
  }
  return {unlimited:false,used,left,minLeft};
}
function lettersFor(kid){
  return S.letters.filter(l=>l.from===kid).sort((a,b)=>b.ts-a.ts);
}
function unreadReplies(kid){
  return S.letters.filter(l=>l.from===kid&&l.reply&&!l.replyRead).sort((a,b)=>b.reply.ts-a.reply.ts);
}
function inboxFor(roleId){
  const r=ROLES[roleId];
  if(!r||r.kind!=='admin') return [];
  return S.letters.filter(l=>l.to===r.inbox).sort((a,b)=>b.ts-a.ts);
}
function unreadInbox(roleId){
  return inboxFor(roleId).filter(l=>!l.read).length;

function eventsOn(ds){
  return S.events.filter(ev=>ds>=ev.date&&ds<=(ev.end||ev.date))
    .sort((a,b)=>(a.kind==='trip'?-1:0)-(b.kind==='trip'?-1:0));
}
function upcomingEvents(limit){

  const list=S.events.filter(ev=>(ev.end||ev.date)>=t).slice()

  return limit?list.slice(0,limit):list;
}

  setTimeout(()=>{el.style.transition='opacity .3s,transform .3s';el.style.opacity='0';el.style.transform='translateY(8px)';},2200);
  setTimeout(()=>el.remove(),2600);

function burst(emoji,n){
  const root=document.getElementById('burstRoot');
  const cnt=n||7;
  for(let i=0;i<cnt;i++){
    const s=document.createElement('span');
    s.className='burst';
    s.textContent=emoji;
    s.style.left=(48+Math.random()*10)+'%';
    s.style.top=(30+Math.random()*20)+'%';
    s.style.setProperty('--dx',(Math.random()*160-80)+'px');
    s.style.animationDelay=(i*45)+'ms';
    root.appendChild(s);
    setTimeout(()=>s.remove(),1400);
  }
}

      onclick="setFocus('${k}')">${esc(S.kids[k].name)}</button>`).join('')}

}

function monthGridHTML(y,m,mini){
  const first=new Date(y,m,1),start=first.getDay(),days=new Date(y,m+1,0).getDate();
  const t=todayKey();
  let cells='';
  for(let i=0;i<start;i++) cells+='<span></span>';
  for(let d=1;d<=days;d++){
    const ds=`${y}-${pad(m+1)}-${pad(d)}`;
    const evs=eventsOn(ds);
    const cls=['day'];
    if(ds===t) cls.push('today');
    if(evs.length){cls.push('has');if(evs.some(e=>e.kind==='trip'))cls.push('trip');}
    cells+=`<button class="${cls.join(' ')}" onclick="openCalendar('${ds}')" aria-label="${m+1}월 ${d}일${evs.length?' 일정 '+evs.length+'개':''}">${d}${evs.length?'<i class="evd"></i>':''}</button>`;
  }
  const heads=WEEK.map((w,i)=>`<span class="wd${i===0?' sun':i===6?' sat':''}">${w}</span>`).join('');
  return `<div class="cal${mini?' mini':''}">${heads}${cells}</div>`;
}
function calendarCardHTML(){
  const y=S.cal.y,m=S.cal.m;
  const monthEvents=S.events.filter(ev=>{
    const s=ev.date,e=ev.end||ev.date;
    const ms=`${y}-${pad(m+1)}-01`, me=`${y}-${pad(m+1)}-31`;
    return s<=me && e>=ms;
  });
  return `<section class="card">
    <div class="card-head"><span class="ico" style="--ic:#E4DCF8">📅</span>
      <div><h3>우리 가족 일정</h3><p>${y}년 ${m+1}월 · ${monthEvents.length}개 일정</p></div>
      <div class="cal-nav" style="margin-left:auto">
        <button onclick="moveMonth(-1)" aria-label="이전 달">◀</button>
        <button onclick="moveMonth(1)" aria-label="다음 달">▶</button>
      </div>
    </div>
    ${monthGridHTML(y,m,true)}
    <button class="ghost" onclick="openCalendar()" style="align-self:flex-start">일정 추가하기 →</button>
  </section>`;
}

/* =========================================================
   모달 기본
   ========================================================= */
let modal={type:null,args:[]};
function setModal(html,cls){
  document.getElementById('modalRoot').innerHTML=
    `<div class="backdrop" onclick="backdropClick(event)"><div class="sheet ${cls||''}" role="dialog" aria-modal="true" onclick="event.stopPropagation()">${html}</div></div>`;
  document.body.classList.add('modal-open');
}
function backdropClick(e){ if(e.target.classList.contains('backdrop')) closeModal(); }
function closeModal(){
  document.getElementById('modalRoot').innerHTML='';
  document.body.classList.remove('modal-open');
  modal={type:null,args:[]};
}
function drawModal(){
  if(!modal.type) return;
  const t=modal.type,a=modal.args;
  if(t==='routine') return openRoutine(a[0],true);
  if(t==='food') return openFood(true);
  if(t==='mail') return openMail(a[0],true);
  if(t==='inbox') return openInbox(true);
  if(t==='replies') return openReplies(true);
  if(t==='growth') return openGrowth(a[0],true);
  if(t==='calendar') return openCalendar(a[0],true);
  if(t==='settings') return openSettings(true);
  if(t==='rolemenu') return openRoleMenu(true);
  if(t==='read') return openRead(a[0],true);
}
function shHead(title,sub,icon){
  return `<div class="sh-head">
    ${icon?`<span class="ico" style="--ic:#FFF3D0">${icon}</span>`:''}
    <div><h2>${title}</h2><p>${sub||''}</p></div>
    <button class="sh-close" onclick="closeModal()" aria-label="닫기">✕</button>
  </div>`;
}

/* =========================================================
   루틴 (할 일) 모달
   ========================================================= */
function openRoutine(k, redraw){
  const kids=k?[k]:visibleKids();
  modal={type:'routine',args:[k]};
  const cols=kids.map(kk=>{
    const kd=S.kids[kk],done=routineDone(kk),tot=ROUTINE.length;
    const all=done>=tot;
    return `<div class="kid-col">
      <div class="kc-head">
        <span class="kc-av">${avatarSVG(kd)}</span>
        <span><span class="kc-name">${esc(kd.name)}</span><span class="kc-sub"> · ${done}/${tot} 완료</span></span>
        <span class="kc-badge ${all?'done-badge':''}">${all?'다 했어요! 🎉':'⭐ +'+done}</span>
      </div>
      <div class="rows">${ROUTINE.map(i=>{
        const on=!!kd.routine.done[i.id];
        return `<button class="row${on?' on':''}" onclick="toggleRoutine('${kk}','${i.id}')">
          <span class="r-ico">${i.icon}</span><span class="r-label">${i.label}</span><span class="box">✓</span></button>`;
      }).join('')}</div>
      <div style="display:flex;gap:6px;margin-top:9px">
        <button class="ghost" onclick="toggleRoutineAll('${kk}',true)">모두 체크</button>
        <button class="ghost" onclick="toggleRoutineAll('${kk}',false)">다시 하기</button>
      </div>
    </div>`;
  }).join('');
  const html=shHead('🌙 오늘의 저녁 루틴','체크할 때마다 별 +1 · 취소하면 별도 돌아가요','📋')+
    `<div class="sh-body">
      <div class="cols ${kids.length>1?'two':''}">${cols}</div>
      ${isKid()?'':'<div class="hint">부모님은 아래 관리 카드에서 별을 직접 조정할 수도 있어요.</div>'}
    </div>`;
  setModal(html,kids.length>1?'wide':'narrow');
}
function toggleRoutine(k,id){
  const kd=S.kids[k];
  const on=!kd.routine.done[id];
  if(on){kd.routine.done[id]=true;kd.stars+=1;}
  else{delete kd.routine.done[id];kd.stars=Math.max(0,kd.stars-1);}
  save(); render(); drawModal();
  const el=document.getElementById('star-'+k);
  if(el){el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');}
  if(on){
    burst('⭐',4);
    if(routineDone(k)>=ROUTINE.length){burst('🎉',12);toast('와! 오늘 루틴을 다 했어요! 🎉','ok');}
    else toast(`별 +1 · ${S.kids[k].name} 별 ${kd.stars}개 ⭐`,'ok');
  }
}
function toggleRoutineAll(k,on){
  const kd=S.kids[k];
  ROUTINE.forEach(i=>{
    if(on&&!kd.routine.done[i.id]){kd.routine.done[i.id]=true;kd.stars+=1;}
    if(!on&&kd.routine.done[i.id]){delete kd.routine.done[i.id];kd.stars=Math.max(0,kd.stars-1);}
  });
  save();render();drawModal();
  toast(on?'오늘 루틴 모두 체크! 🎉':'루틴을 처음부터 다시 시작해요','ok');
}

function toggleFood(k,id){

/* =========================================================
   이만큼 자랐어요 (성장 기록)
   ========================================================= */
function growthChart(kd){
  const g=kd.growth.slice().sort((a,b)=>a.date<b.date?-1:1);
  const pts=g.concat([{date:todayKey(),height:kd.height,weight:kd.weight}]);
  if(pts.length<2) return '';
  const hs=pts.map(p=>Number(p.height)||0);
  const min=Math.min.apply(null,hs)-1,max=Math.max.apply(null,hs)+1;
  const W=300,H=96,padx=10,pady=12;
  const xs=i=>padx+i*(W-padx*2)/(pts.length-1);
  const ys=h=>H-pady-((h-min)/Math.max(.1,max-min))*(H-pady*2);
  const line=pts.map((p,i)=>`${i?'L':'M'}${xs(i).toFixed(1)} ${ys(Number(p.height)||0).toFixed(1)}`).join(' ');
  const dots=pts.map((p,i)=>`<circle cx="${xs(i).toFixed(1)}" cy="${ys(Number(p.height)||0).toFixed(1)}" r="3.4" fill="#F2BE3C" stroke="#fff" stroke-width="1.6"/>`).join('');
  return `<svg class="scene" viewBox="0 0 ${W} ${H}" style="height:96px" aria-hidden="true">
    <rect width="${W}" height="${H}" rx="14" fill="#FFFBF0"/>
    <path d="${line}" fill="none" stroke="#B6DFA6" stroke-width="3.2" stroke-linecap="round"/>
    ${dots}
    <text x="${W-8}" y="16" font-size="9" fill="#B3A28B" text-anchor="end">키 변화</text>
  </svg>`;
}
function openGrowth(k, redraw){
  k=k||focusKid();
  modal={type:'growth',args:[k]};
  const kd=S.kids[k];
  const g=kd.growth.slice().sort((a,b)=>a.date<b.date?1:-1);
  const rows=g.length?g.map(r=>`<div class="med-row">
      <span class="m-name">${r.date.replace(/-/g,'.')}<small>${WEEK[parseD(r.date).getDay()]}요일 기록</small></span>
      <span class="chip">📏 <b>${r.height}</b>cm</span>
      <span class="chip">⚖️ <b>${r.weight}</b>kg</span>
      <button class="ghost" style="padding:4px 8px" onclick="delGrowth('${k}','${r.date}')">✕</button>
    </div>`).join(''):'<div class="hint">아직 기록이 없어요. 오늘 키와 몸무게를 남겨 보세요!</div>';
  setModal(shHead('🌱 이만큼 자랐어요',`${esc(kd.name)}의 성장 기록 · 지금 ${kd.height}cm ${kd.weight}kg`,'🌱')+
    `<div class="sh-body">
      ${growthChart(kd)}
      <div class="sec"><h4>새 기록 남기기</h4>
        <div class="field-row3">
          <div class="field"><label>날짜</label><input type="date" id="gDate" value="${todayKey()}"></div>
          <div class="field"><label>키(cm)</label><input type="number" step="0.1" id="gHeight" value="${kd.height}"></div>
          <div class="field"><label>몸무게(kg)</label><input type="number" step="0.1" id="gWeight" value="${kd.weight}"></div>
        </div>

      </div>
      <div class="sec"><h4>지난 기록</h4><div class="rows">${rows}</div></div>
    </div>`,'narrow');
}
function addGrowth(k){

function moveMonth(d){
  let y=S.cal.y,m=S.cal.m+d;
  if(m<0){m=11;y--;} if(m>11){m=0;y++;}
  S.cal.y=y;S.cal.m=m;save();drawModal();
}
function addEvent(){
  const date=document.getElementById('evDate').value||todayKey();
  const end=document.getElementById('evEnd').value||'';
  const title=(document.getElementById('evTitle').value||'').trim();
  const emoji=(document.getElementById('evEmoji').value||'📌').trim()||'📌';
  if(!title) return toast('일정 이름을 적어 주세요','warn');
  S.events.push({id:'ev'+Date.now(),date:date,end:end&&end>=date?end:'',title:title,emoji:emoji,kind:'family'});
  S.drafts.calDate=date;
  save();render();drawModal();
  burst(emoji,5);toast('일정을 추가했어요 '+emoji,'ok');
}
function delEvent(id){
  S.events=S.events.filter(e=>e.id!==id);
  save();render();drawModal();
  toast('일정을 지웠어요');
}

function setKidField(k,field,v){

    kd[field]=field==='goal'?Math.max(1,Math.round(n)):n;

    kd[field]=String(v||'').trim()||(field==='name'?(k==='elder'?'큰딸':'작은딸'):'');
  }
  save();render();
  toast('저장했어요 ✏️','ok');
}
function setMedName(k,i,v){
  const kd=S.kids[k];
  if(!kd.meds[i]) kd.meds[i]={id:i===0?'morning':'evening',icon:i===0?'🌞':'🌙',label:''};

function saveCloud(){

function exportData(){
  try{
    const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='우리집_패밀리_보드_백업.json';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    toast('백업 파일을 내려받았어요 💾','ok');
  }catch(e){toast('백업에 실패했어요','warn');}
}
function importData(input){
  const f=input.files&&input.files[0];
  if(!f) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const p=JSON.parse(String(reader.result));
      S=migrate(p);save();closeModal();render();
      toast('백업을 불러왔어요 ✓','ok');
    }catch(e){toast('파일을 읽을 수 없어요','warn');}
  };
  reader.readAsText(f);
}
function resetAll(){
  if(!confirm('모든 기록(별·편지·일정)을 지우고 처음 상태로 돌아갈까요?')) return;
  S=defaultState();
  S.settings.onboarded=true;
  save();closeModal();render();
  toast('처음 상태로 돌아갔어요');
}

function pinKey(n){
  if(pinBuf.length>=4) return;

function paintPin(){
  const d=document.getElementById('pinDots');
  if(d) d.innerHTML=Array.from({length:4},(_,i)=>`<i class="${i<pinBuf.length?'on':''}"></i>`).join('');
}

  if(pinBuf===S.settings.pin){

    pinBuf='';pendingRole=null;
    applyRole(id);
  }else{
    pinBuf='';paintPin();

/* =========================================================
   읽어주기 (TTS)
   ========================================================= */
let ttsBtn=null;
function koreanVoice(){
  try{
    const vs=window.speechSynthesis.getVoices()||[];
    return vs.find(v=>/ko[-_]KR/i.test(v.lang))||vs.find(v=>/^ko/i.test(v.lang))||null;
  }catch(e){return null;}
}
function speak(text,el){
  if(!('speechSynthesis' in window)){
    toast('이 브라우저는 읽어주기를 지원하지 않아요. 아이패드 Safari에서는 잘 돼요!','warn');
    return;
  }
  try{window.speechSynthesis.cancel();}catch(e){}
  const clean=String(text||'').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}\u{2190}-\u{21FF}]/gu,' ').replace(/\s+/g,' ').trim();
  const u=new SpeechSynthesisUtterance(clean||'편지가 도착했어요');
  u.lang='ko-KR';u.rate=0.94;u.pitch=1.06;u.volume=1;
  const v=koreanVoice();if(v)u.voice=v;
  if(el){
    if(ttsBtn&&ttsBtn!==el) ttsBtn.classList.remove('on');
    ttsBtn=el;el.classList.add('on');
    u.onend=()=>{el.classList.remove('on');};
    u.onerror=()=>{el.classList.remove('on');};
  }
  try{window.speechSynthesis.speak(u);}catch(e){}
  if(!v) console.info('[board] 한국어 음성 대기 중');
}

function applyDoc(doc){
  if(!doc||typeof doc!=='object') return false;
  if(doc.kind==='letter') return applyLetterDoc(doc);
  if(doc.kind==='chat') return applyChatDoc(doc);
  if(doc.kind==='state') return applyStateDoc(doc);
  return false;
}
function applyLetterDoc(doc){
  let ch=false;
  const l=S.letters.find(x=>x.id===doc.id);
  if(!l){
    const copy=Object.assign({},doc); delete copy.kind;
    if(!copy.ts) copy.ts=Date.now();
    S.letters.push(copy);
    return true;
  }
  if(doc.text&&doc.text!==l.text){ l.text=doc.text; ch=true; }
  if(doc.reply&&(!l.reply||(doc.reply.ts||0)>(l.reply.ts||0))){ l.reply=doc.reply; ch=true; }
  if(doc.replyRead&&!l.replyRead){ l.replyRead=true; ch=true; }
  if(doc.read&&!l.read){ l.read=true; ch=true; }
  if(doc.ts&&!l.ts){ l.ts=doc.ts; ch=true; }
  return ch;
}
function applyChatDoc(doc){
  if(!doc.id) return false;
  if((S.chat||[]).some(m=>m.id===doc.id)) return false;
  const copy=Object.assign({},doc); delete copy.kind;
  if(!copy.ts) copy.ts=Date.now();
  S.chat=(S.chat||[]).concat([copy]).sort((a,b)=>(a.ts||0)-(b.ts||0)).slice(-300);
  return true;
}

    KIDS.forEach(k=>{ if(doc.kids[k]) S.kids[k]=Object.assign(defaultKid(k),doc.kids[k]); });

  S.syncVer=ver;
  return true;
}

async function bootstrapCloud(){
  const res=await sb.from(SYNC_TABLE).select('id,doc,updated_at').order('updated_at',{ascending:true}).limit(5000);
  if(res.error) throw res.error;
  const rows=res.data||[];

  applyingRemote=true;
  rows.forEach(r=>{ try{ applyDoc(r.doc); }catch(e){} });
  applyingRemote=false;
  try{ if(storageOK) localStorage.setItem(LS_KEY,JSON.stringify(S)); }catch(e){}
  const ups=[];
  S.letters.forEach(l=>{ if(!have['l:'+l.id]) ups.push(rowOf('l:'+l.id,letterDoc(l))); });
  (S.chat||[]).forEach(m=>{ if(!have['c:'+m.id]) ups.push(rowOf('c:'+m.id,chatDoc(m))); });
  if(!have['state:family']) ups.push(rowOf('state:family',stateDoc(Date.now())));
  if(ups.length){

}

function callChannel(){
  if(callCh||!sb) return callCh;
  try{
    callCh=sb.channel('fb-call',{config:{broadcast:{self:false},presence:{key:myDid()}}});
    callCh.on('broadcast',{event:'signal'},m=>{ if(m&&m.payload) onSignal(m.payload); });
    callCh.on('presence',{event:'sync'},()=>refreshPresence());
    callCh.on('presence',{event:'join'},()=>refreshPresence());
    callCh.on('presence',{event:'leave'},()=>refreshPresence());
    callCh.subscribe(status=>{
      if(status==='SUBSCRIBED'){
        callCh.track({did:myDid(),role:S.currentUser,name:roleName(S.currentUser),ts:Date.now()}).catch(()=>{});
      }
    });
  }catch(e){ console.warn('[call] 채널 준비 실패',e); }
  return callCh;
}
function refreshPresence(){
  const st=(callCh&&callCh.presenceState&&callCh.presenceState())||{};
  const next={};
  Object.keys(st).forEach(k=>{ (st[k]||[]).forEach(p=>{ if(p&&p.role) next[p.role]=true; }); });
  cloud.presence=next;
  paintPresence();
}
function sendSignal(payload){
  const ch=callChannel();
  if(!ch) return;
  if(!payload.from) payload.from=meInfo();
  try{ ch.send({type:'broadcast',event:'signal',payload:payload}).catch(e=>console.warn('[call] 신호 전송 실패',e)); }catch(e){}
}
function onSignal(p){
  if(!p||!p.callId) return;
  if(p.from&&p.from.did===myDid()) return;
  if(p.to&&p.to.did&&p.to.did!==myDid()) return;
  if(p.to&&p.to.role&&p.to.role!==S.currentUser&&!(ROLES[S.currentUser]&&ROLES[S.currentUser].id===p.to.role)) return;
  switch(p.type){
    case 'ring':
      if(call){ sendSignal({type:'busy',callId:p.callId,to:{did:p.from.did}}); return; }
      if(incoming) return;
      incoming={callId:p.callId,from:p.from,video:!!p.video};
      playRing('in'); showIncomingUI();
      break;
    case 'accept':
      if(incoming&&incoming.callId===p.callId) dismissIncoming();
      if(call&&call.callId===p.callId&&call.dir==='out'){
        call.peerDid=p.from.did; call.accepted=true;
        setCallState('연결 중…'); stopRing();
        callerOffer();
      }
      break;
    case 'decline':
      if(call&&call.callId===p.callId) endCall('decline');
      else if(incoming&&incoming.callId===p.callId) dismissIncoming();
      break;
    case 'busy':
      if(call&&call.callId===p.callId) endCall('busy');
      break;
    case 'offer':
      if(call&&call.callId===p.callId&&call.dir==='in') onOffer(p);
      break;
    case 'answer':
      if(call&&call.callId===p.callId&&call.dir==='out') onAnswer(p);
      break;
    case 'ice':
      if(call&&call.callId===p.callId) addIce(p.candidate);
      break;
    case 'hangup':
      if(call&&call.callId===p.callId) endCall('remote');
      else if(incoming&&incoming.callId===p.callId) dismissIncoming();
      break;
    default: break;
  }
}

}

/* ---------- 벨소리 ---------- */
function audioCtx(){
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    return actx;
  }catch(e){ return null; }
}
function playRing(kind){
  stopRing();
  const ac=audioCtx(); if(!ac) return;
  const beep=(f,dur,delay,vol)=>{
    try{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(ac.destination);
      const t=ac.currentTime+delay;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(vol||.18,t+.03);
      g.gain.setValueAtTime(vol||.18,Math.max(t+.04,t+dur-.04));
      g.gain.linearRampToValueAtTime(0,t+dur);
      o.start(t); o.stop(t+dur+.03);
    }catch(e){}
  };
  const pattern=()=>{ if(kind==='in'){ beep(880,.2,0,.2); beep(660,.2,.26,.2); } else { beep(440,.85,0,.09); } };
  pattern();
  ringTimer=setInterval(pattern, kind==='in'?1500:2400);
  if(kind==='in'&&navigator.vibrate){ try{ navigator.vibrate([280,180,280]); }catch(e){} }
}
function stopRing(){
  if(ringTimer){ clearInterval(ringTimer); ringTimer=null; }
  if(navigator.vibrate){ try{ navigator.vibrate(0); }catch(e){} }
}

    <div class="call-avatar" id="callAvatar">
      <div class="big-av">${memberAvatar(c.role)}</div>
      <div class="cn">${esc(nm)}</div>
      <div class="cd" id="callAvatarNote">${c.video?'영상이 오면 화면이 켜져요':'음성으로 연결하고 있어요'}</div>
    </div>
    <div class="call-timer" id="callTimer">00:00</div>
    <div class="pip ${(c.video&&c.localStream)?'on':''}" id="callPip"><video id="lVideo" playsinline autoplay muted></video></div>
  </div>
  <div class="call-note" id="callNote" style="display:none"></div>
  <div class="call-actions">
    <button class="cbtn" id="muteBtn" onclick="toggleMute()" aria-label="마이크 끄기/켜기">🎤</button>
    ${c.video?'<button class="cbtn" id="camBtn" onclick="toggleCam()" aria-label="카메라 끄기/켜기">📷</button>':''}
    <button class="cbtn hang" onclick="endCall('local')" aria-label="통화 종료">📵</button>
  </div>`;
}
function attachLocalPreview(){
  const v=document.getElementById('lVideo');
  if(v&&call&&call.localStream){ try{ v.srcObject=call.localStream; v.play().catch(()=>{}); }catch(e){} }
}
function setCallState(txt){
  const el=document.getElementById('callState'); if(el) el.textContent=txt;
}
function showAudioHint(){
  const n=document.getElementById('callNote');
  if(n){ n.style.display='block'; n.textContent='소리가 안 들리면 화면을 한 번 눌러 주세요(아이폰 소리 허용)'; }
}
function markConnected(){
  if(!call||call.started) return;
  call.started=Date.now();
  stopRing();
  setCallState('통화 중');
  const tb=document.getElementById('callTimer'); if(tb) tb.classList.add('on');
  const note=document.getElementById('callAvatarNote');
  if(note) note.textContent=call.localStream?'연결됐어요':'연결됐어요 · 내 카메라·마이크는 꺼져 있어요';
  if(callTick) clearInterval(callTick);
  const paint=()=>{
    const el=document.getElementById('callTimer'); if(!el||!call||!call.started) return;
    const s=Math.floor((Date.now()-call.started)/1000);
    el.textContent=pad(Math.floor(s/60))+':'+pad(s%60);
  };
  paint(); callTick=setInterval(paint,1000);
}

/* ---------- WebRTC ---------- */
function newPC(){
  const pc=new RTCPeerConnection(ICE_CFG);
  pc.onicecandidate=e=>{
    if(!e.candidate||!call) return;
    const cand=e.candidate.toJSON?e.candidate.toJSON():{candidate:e.candidate.candidate,sdpMid:e.candidate.sdpMid,sdpMLineIndex:e.candidate.sdpMLineIndex};
    sendSignal({type:'ice',callId:call.callId,candidate:cand,to:{did:call.peerDid||''}});
  };
  pc.ontrack=e=>{
    const stream=(e.streams&&e.streams[0])?e.streams[0]:new MediaStream([e.track]);
    attachRemote(stream);
  };
  pc.onconnectionstatechange=()=>{
    if(!call||call.pc!==pc) return;
    if(pc.connectionState==='connected') markConnected();
    else if(pc.connectionState==='failed'){ setCallState('연결이 끊겼어요'); endCall('error'); }
  };
  return pc;
}
function waitIceGathering(pc,ms){
  return new Promise(resolve=>{
    if(!pc||pc.iceGatheringState==='complete') return resolve();
    let done=false;
    const finish=()=>{ if(done) return; done=true; try{ pc.removeEventListener('icegatheringstatechange',onch); }catch(e){} resolve(); };
    const onch=()=>{ if(pc.iceGatheringState==='complete') finish(); };
    try{ pc.addEventListener('icegatheringstatechange',onch); }catch(e){}
    setTimeout(finish,ms||2500);
  });
}
function putLocalTracks(pc){
  if(!call||!call.localStream) return;
  call.localStream.getTracks().forEach(t=>{ try{ pc.addTrack(t,call.localStream); }catch(e){} });
}
async function callerOffer(){
  if(!call) return;
  try{
    const pc=newPC(); call.pc=pc;
    putLocalTracks(pc);
    const off=await pc.createOffer({offerToReceiveAudio:true,offerToReceiveVideo:!!call.video});
    await pc.setLocalDescription(off);
    await waitIceGathering(pc,2500);
    sendSignal({type:'offer',callId:call.callId,sdp:pc.localDescription,to:{did:call.peerDid}});
  }catch(e){ console.warn('[call] offer 실패',e); endCall('error'); }
}
async function onOffer(p){
  if(!call) return;
  try{
    const pc=newPC(); call.pc=pc;
    putLocalTracks(pc);
    await pc.setRemoteDescription(new RTCSessionDescription(p.sdp));
    await flushIce();
    const ans=await pc.createAnswer();
    await pc.setLocalDescription(ans);
    await waitIceGathering(pc,2500);
    sendSignal({type:'answer',callId:call.callId,sdp:pc.localDescription,to:{did:call.peerDid}});
  }catch(e){ console.warn('[call] answer 실패',e); endCall('error'); }
}
async function onAnswer(p){
  if(!call||!call.pc) return;
  try{ await call.pc.setRemoteDescription(new RTCSessionDescription(p.sdp)); await flushIce(); }
  catch(e){ console.warn('[call] answer 적용 실패',e); }
}
async function addIce(cand){
  if(!cand||!call) return;
  if(!call.pc||!call.pc.remoteDescription){ (call.pendingIce=call.pendingIce||[]).push(cand); return; }
  try{ await call.pc.addIceCandidate(new RTCIceCandidate(cand)); }catch(e){ console.info('[call] ICE 무시',e&&e.message); }
}
async function flushIce(){
  if(!call||!call.pc) return;
  const q=call.pendingIce||[]; call.pendingIce=[];
  for(const c of q){
    try{ await call.pc.addIceCandidate(new RTCIceCandidate(c)); }catch(e){}
  }
}
function attachRemote(stream){
  if(!call) return;
  if(call.video){
    const v=document.getElementById('rVideo');
    if(v){ try{ v.srcObject=stream; v.play().catch(()=>showAudioHint()); }catch(e){} }
    const av=document.getElementById('callAvatar'); if(av) av.style.display='none';
  }else{
    const a=document.getElementById('rAudio');
    if(a){ try{ a.srcObject=stream; a.play().catch(()=>showAudioHint()); }catch(e){} }
  }
  markConnected();
}

/* ---------- 통화 시작/받기/끝 ---------- */
async function startCall(roleId, video){
  if(!cloudReady()){ toast('가족 클라우드 연결이 필요해요. 설정에서 연결을 확인해 주세요','warn'); return; }
  if(call||incoming){ toast('이미 통화 중이에요','warn'); return; }
  if(!ROLES[roleId]||roleId===S.currentUser){ toast('다른 가족을 골라 주세요','warn'); return; }
  toast('카메라·마이크를 준비하고 있어요…','ok');
  const media=await tryMedia(!!video);
  if(media&&media.__err){ askMediaOrContinue(media.__err, roleId, !!video); return; }
  beginCall(roleId, !!video, media);
}
function beginCall(roleId, video, stream){
  const callId='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  call={callId:callId,role:roleId,video:!!video,dir:'out',localStream:stream||null,pc:null,peerDid:null,started:0,pendingIce:[]};
  showCallUI(callHTMLActive('거는 중…'));
  playRing('out');
  if(!stream) toast('카메라·마이크 없이 연결해 볼게요','warn');
  else if(!stream.__video) toast('카메라를 켤 수 없어 음성으로 연결할게요 📞','warn');
  if(!isOnline(roleId)) toast('상대 화면이 꺼져 있으면 받을 수 없어요','warn');
  sendSignal({type:'ring',callId:callId,to:{role:roleId},video:!!video});
  call.timeout=setTimeout(()=>{ if(call&&call.callId===callId&&!call.started) endCall('noanswer'); },50000);
}
function askMediaOrContinue(err, roleId, video){
  const msg=mediaErrorText(err);
  console.warn('[call] 미디어 오류',err&&err.name);
  setModal(shHead('📵 카메라·마이크를 켤 수 없어요',msg,'🎥')+
    `<div class="sh-body">
      <div class="sec"><h4>이렇게 해 보세요</h4>
        <div class="hint">· 처음 통화할 때 화면에 뜨는 <b>허용</b>을 눌러 주세요.<br>
        · 아이폰: 설정 → Safari → 카메라 / 마이크 → <b>확인</b><br>
        · 홈 화면 앱이면 설정에서 그 앱의 카메라·마이크를 켜 주세요.<br>
        · 다른 앱이 카메라를 쓰고 있으면 끄고 다시 시도해 주세요.</div>
      </div>
      <button class="big-btn" onclick="closeModal();beginCall('${roleId}',${video?'true':'false'},null)">상대 화면만 보기로 연결 📞</button>
      <button class="ghost" onclick="closeModal()">나중에 할게요</button>
    </div>`,'narrow');
}
async function acceptIncoming(){
  const inc=incoming; if(!inc||call) return;
  const media=await tryMedia(!!inc.video);
  const stream=(media&&!media.__err)?media:null;
  dismissIncoming();
  call={callId:inc.callId,role:inc.from.role,video:!!inc.video,dir:'in',localStream:stream,pc:null,peerDid:inc.from.did,started:0,pendingIce:[]};
  sendSignal({type:'accept',callId:call.callId,to:{did:call.peerDid}});
  showCallUI(callHTMLActive('연결 중…'));
  call.timeout=setTimeout(()=>{ if(call&&call.callId===inc.callId&&!call.started) endCall('error'); },40000);
  if(!stream) toast('카메라·마이크 없이 연결해 볼게요','warn');
  else if(!stream.__video) toast('카메라를 켤 수 없어 음성으로 연결할게요 📞','warn');
}
function declineIncoming(){
  const inc=incoming;
  if(inc) sendSignal({type:'decline',callId:inc.callId,to:{did:inc.from.did}});
  dismissIncoming();
}
function endCall(reason){
  const c=call;
  call=null;
  stopRing();
  if(callTick){ clearInterval(callTick); callTick=null; }
  if(c&&c.timeout) clearTimeout(c.timeout);
  if(c){
    if(c.pc){ try{ c.pc.close(); }catch(e){} }
    if(c.localStream) c.localStream.getTracks().forEach(t=>{ try{ t.stop(); }catch(e){} });
  }
  hideCallUI();
  if((reason==='local'||reason==='noanswer'||reason==='error')&&c&&c.callId){
    sendSignal({type:'hangup',callId:c.callId,to:{did:c.peerDid||''}});
  }
  const msgs={
    'local':'통화를 종료했어요',
    'remote':'통화가 끝났어요',
    'decline':'상대가 통화를 받지 않았어요',
    'busy':'지금 다른 통화 중이에요',
    'noanswer':'연결되지 않았어요. 상대 화면이 켜져 있는지 확인해 주세요',
    'error':'통화 중 연결이 끊겼어요',
    'media':'카메라·마이크를 켜지 못했어요'
  };
  if(msgs[reason]) toast(msgs[reason], reason==='local'?'ok':'warn');
}
function toggleMute(){
  if(!call||!call.localStream) return;
  const t=call.localStream.getAudioTracks()[0];
  if(!t) return;
  t.enabled=!t.enabled;
  const b=document.getElementById('muteBtn');
  if(b){ b.textContent=t.enabled?'🎤':'🔇'; b.classList.toggle('off',!t.enabled); }
}
function toggleCam(){
  if(!call||!call.localStream) return;
  const t=call.localStream.getVideoTracks()[0];
  if(!t){ toast('카메라가 없어 음성으로만 연결돼요','warn'); return; }
  t.enabled=!t.enabled;
  const b=document.getElementById('camBtn');
  if(b){ b.textContent=t.enabled?'📷':'🚫'; b.classList.toggle('off',!t.enabled); }
  const pip=document.getElementById('callPip'); if(pip) pip.style.opacity=t.enabled?'1':'.35';
}

/* =========================================================
   📞 가족 통화 카드 · 💬 가족 수다 카드
   ========================================================= */
function commCardHTML(){
  const members=callTargets();
  const tiles=members.map(id=>{
    const on=isOnline(id);
    return `<div class="mem ${on?'':'offline'}" data-memrole="${id}">
      <span class="m-dot ${on?'on':''}"></span>
      <span class="m-av">${memberAvatar(id)}</span>
      <span class="m-nm">${esc(roleName(id))}</span>
      <span class="m-sub">${on?'켜져 있어요':'꺼져 있음'}</span>
      <span class="m-btns">
        <button class="video" ${cloudReady()?'':'disabled'} onclick="startCall('${id}',true)" aria-label="${esc(roleName(id))} 영상통화">📹</button>
        <button class="voice" ${cloudReady()?'':'disabled'} onclick="startCall('${id}',false)" aria-label="${esc(roleName(id))} 음성통화">📞</button>
      </span>
    </div>`;
  }).join('');
  return `<section class="card comm">
    <div class="card-head">
      <span class="ico" style="--ic:#FFE3EA">📹</span>

      <span class="sync-chip ${syncClass()}" id="commOnline"><i></i>${esc(syncLabel())}</span>
    </div>
    <div class="members">${tiles}</div>
    <div class="hint">처음 한 번만 카메라·마이크 <b>허용</b>을 눌러 주세요. 받는 사람은 화면 가운데 📞 버튼을 눌러 받아요.</div>
  </section>`;
}
function chatCardHTML(){
  const list=(S.chat||[]).slice(-40);
  const bubbles=list.length?list.map(m=>{
    const mine=m.from===S.currentUser;
    return `<div class="cb ${mine?'me':''}">
      ${mine?'':`<span class="c-av">${memberAvatar(m.from)}</span>`}
      <span class="c-body">
        ${mine?'':`<span class="c-nm">${esc(m.name||roleName(m.from))}</span>`}
        <span class="c-tx">${esc(m.text)}</span>
        <span class="c-tm">${timeHM(m.ts)}</span>
      </span>
    </div>`;
  }).join(''):'<div class="hint">아직 수다가 없어요. 첫 인사를 남겨 보세요 💬</div>';
  return `<section class="card chat-card">
    <div class="card-head"><span class="ico" style="--ic:#E4DCF8">💬</span>
      <div><h3>가족 수다</h3><p>폰·태블릿에 바로 보여요</p></div>
      <span class="sync-chip ${syncClass()}"><i></i>${cloudReady()?'실시간':'연결 전'}</span>
    </div>
    <div class="chat-list" id="chatList">${bubbles}</div>
    <div class="chat-in">
      <input id="chatInput" placeholder="하고 싶은 말을 적어 보세요" value="${esc(chatDraft)}"
        oninput="chatDraft=this.value" onkeydown="if(event.key==='Enter'){event.preventDefault();sendChat();}">
      <button onclick="sendChat()" aria-label="보내기">➤</button>
    </div>
  </section>`;
}

const VILLAGES=[
  {id:'vocab',href:'https://38kwangs-dotcom.github.io/English-study/family-board/vocab/',icon:'🌟',icoBg:'#F3ECFF',
   name:'초등 필수 영단어 마을',sub:'930단어 · 60일 · 퀴즈와 마을 꾸미기'},
  {id:'ielts',href:'https://38kwangs-dotcom.github.io/English-study/family-board/ielts/',icon:'📘',icoBg:'#E4F0FB',
   name:'엄마 IELTS 단어 마을',sub:'960단어 · 60일 · IELTS 7.0'}
];
function villageCardHTML(){
  return `<section class="card span2">
    <div class="card-head"><span class="ico" style="--ic:#EFE7FF">📚</span>
      <div><h3>학습 마을</h3><p>아이 영단어 · 엄마 IELTS 단어</p></div>
    </div>
    <div class="villages">
      ${VILLAGES.map(v=>`<a class="village${v.id==='ielts'?' ielts':''}" href="${v.href}" aria-label="${esc(v.name)}로 이동">

        <span class="v-go" aria-hidden="true">→</span>

    </div>

function scrollChatBottom(){
  const l=document.getElementById('chatList');
  if(l) l.scrollTop=l.scrollHeight;
}
function sendChat(){
  const el=document.getElementById('chatInput');
  const t=((el?el.value:chatDraft)||'').trim();
  if(!t) return;
  const m={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),from:S.currentUser,
    name:roleName(S.currentUser),text:t.slice(0,500),ts:Date.now(),did:myDid()};
  S.chat=(S.chat||[]).concat([m]).sort((a,b)=>(a.ts||0)-(b.ts||0)).slice(-300);
  chatDraft='';
  save();
  pushChat(m);
  render();
  setTimeout(scrollChatBottom,30);
}

/* =========================================================
   시작
   ========================================================= */
function boot(){
  ensureToday();
  if(!S.settings.onboarded){
    S.currentUser='family';
    render();
    openDeviceSetup();
  }else{
    if(S.device.user) S.currentUser=S.device.user;
    if(!ROLES[S.currentUser]) S.currentUser='family';
    save();
    render();
  }
  setInterval(drawClock,1000);
  initCloud();
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
  if(window.speechSynthesis){
    window.speechSynthesis.onvoiceschanged=()=>{koreanVoice();};
  }
  window.addEventListener('beforeunload',save);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') wakeCloud(); });
  setInterval(()=>{ if(document.visibilityState==='visible') wakeCloud(); },60000);
  if(!storageOK) console.warn('[board] localStorage 사용 불가');
}
boot();
