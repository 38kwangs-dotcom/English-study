<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFF9E6">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>📘 IELTS 단어 마을 · 엄마 필수 영단어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --cream:#FFF9E6; --cream2:#FFF3CE; --pinkbg:#FFF0F3; --greenbg:#EEF8E8;
  --paper:#FFFDF6; --ink:#3D312A; --ink2:#8A7A6B; --line:#E8DCC4;
  --yellow:#FFDE6A; --yellow2:#FFC93C;
  --pink:#FFD1DC; --pink2:#FF9EB5;
  --green:#D9F0C8; --green2:#7CC96B;
  --blue:#DCEBFF; --blue2:#7FB3F5;
  --purple:#EBDFFF; --purple2:#B493F2;
  --orange:#FFB25C;
  --bd:2.5px solid var(--ink);
  --shadow:0 4px 0 rgba(61,49,42,.9), 0 10px 24px rgba(61,49,42,.12);
  --shadow-sm:0 3px 0 rgba(61,49,42,.85);
  --r:22px;
}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Noto Sans KR','Noto Sans CJK KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color:var(--ink); background:var(--cream);
  min-height:100vh; -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(61,49,42,.05) 1.2px, transparent 1.2px);background-size:24px 24px}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;font-size:inherit}
h1,h2,h3,h4,p{margin:0}
.hidden{display:none!important}
.en{font-family:'Baloo 2','Noto Sans KR',system-ui,sans-serif}
#app{position:relative;z-index:1;max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}

/* ============ top bar ============ */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  background:rgba(255,249,230,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:var(--bd)}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand-badge{width:38px;height:38px;flex:none;border-radius:13px;display:grid;place-items:center;
  background:var(--yellow);border:var(--bd);box-shadow:var(--shadow-sm)}
.brand h1{font-size:16px;font-weight:900;letter-spacing:-.4px;line-height:1.1;white-space:nowrap}
.brand p{font-size:10.5px;color:var(--ink2);font-weight:700;margin-top:1px;white-space:nowrap}
.coins{display:flex;gap:6px;flex:none}
.coin{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 10px;border-radius:999px;
  background:var(--paper);border:var(--bd);box-shadow:var(--shadow-sm);font-weight:900;font-size:13.5px}
.coin svg{width:15px;height:15px}

/* ============ common ============ */
.wrap{padding:14px 14px 8px}
.card{background:var(--paper);border:var(--bd);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.pill{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 14px;border-radius:999px;
  border:var(--bd);background:var(--paper);box-shadow:var(--shadow-sm);font-weight:900;font-size:13.5px;white-space:nowrap}
.pill:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(61,49,42,.85)}
.pill.y{background:var(--yellow)} .pill.p{background:var(--pink)} .pill.g{background:var(--green)}
.pill.b{background:var(--blue)} .pill.v{background:var(--purple)}
.pill.sm{height:27px;padding:0 10px;font-size:12px;box-shadow:0 2px 0 rgba(61,49,42,.85)}
.pill:disabled{opacity:.45;box-shadow:none;cursor:default}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:10px 20px;
  border-radius:999px;border:var(--bd);box-shadow:var(--shadow-sm);font-weight:900;font-size:16px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(61,49,42,.85)}
.btn.y{background:var(--yellow)} .btn.g{background:var(--green)} .btn.p{background:var(--pink)}
.btn.w{background:var(--paper)}
.btn:disabled{opacity:.4;box-shadow:none}
.sec-head{display:flex;align-items:center;gap:8px;margin:4px 2px 10px}
.sec-num{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:999px;border:var(--bd);
  box-shadow:var(--shadow-sm);font-weight:900;font-size:13px}
.sec-title{font-size:15px;font-weight:900}
.sticker{position:absolute;pointer-events:none;z-index:2}

/* ============ bottom nav ============ */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  background:linear-gradient(rgba(255,249,230,0), rgba(255,249,230,.95) 34%);pointer-events:none}
.nav-in{pointer-events:auto;display:flex;gap:4px;background:var(--paper);border:var(--bd);border-radius:999px;
  box-shadow:var(--shadow);padding:5px}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:58px;padding:7px 6px 6px;
  border-radius:999px;font-size:10.5px;font-weight:900;color:var(--ink2)}
.nav-btn svg{width:21px;height:21px}
.nav-btn.on{background:var(--yellow);color:var(--ink);border:2px solid var(--ink)}
.badge-dot{position:absolute;margin-left:30px;margin-top:-2px;background:var(--pink2);color:#fff;
  border:2px solid var(--ink);border-radius:999px;font-size:10px;font-weight:900;padding:0 5px;min-width:17px;height:17px;
  display:inline-flex;align-items:center;justify-content:center}

/* ============ village ============ */
.village-card{position:relative;overflow:hidden;padding:0}
.village-sky{position:relative;height:380px;
  background:linear-gradient(#E8F4FF 0%, #F4FBEE 55%, #DFF0C8 55.2%, #C8E5A8 100%)}
.village-sky .sun{position:absolute;top:14px;right:16px;width:44px;height:44px;border-radius:50%;
  background:var(--yellow);border:var(--bd);box-shadow:var(--shadow-sm)}
.village-sky .cloud{position:absolute;opacity:.9}
.v-ground{position:absolute;left:0;right:0;bottom:0;height:45%}
.slot{position:absolute;transform:translate(-50%,-100%);display:flex;align-items:flex-end;justify-content:center;cursor:pointer}
.slot .thing{position:relative;display:grid;place-items:center;line-height:1}
.slot .art{filter:drop-shadow(0 2px 0 rgba(61,49,42,.35))}
.slot.pick .thing{animation:bob .8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.v-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--ink2);font-weight:700;font-size:13.5px;padding:20px}
.v-bar{display:flex;align-items:center;gap:8px;padding:12px 14px;border-top:var(--bd);background:var(--paper);flex-wrap:wrap}

/* ============ learn ============ */
.lvl-tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.lvl-tabs::-webkit-scrollbar{display:none}
.day-scroll{display:flex;gap:6px;overflow-x:auto;padding:6px 2px;scrollbar-width:none}
.day-scroll::-webkit-scrollbar{display:none}
.day-chip{flex:none;min-width:56px;padding:7px 10px;border-radius:16px;border:2px solid var(--ink);
  background:var(--paper);font-weight:900;font-size:12px;text-align:center;box-shadow:0 2px 0 rgba(61,49,42,.85)}
.day-chip.on{background:var(--yellow)}
.day-chip small{display:block;font-size:10px;color:var(--ink2);font-weight:700}
.wcard{position:relative;text-align:center;padding:22px 18px 18px}
.wcard .pos{display:inline-flex;height:24px;align-items:center;padding:0 10px;border-radius:999px;
  background:var(--pinkbg);border:2px solid var(--ink);font-size:12px;font-weight:900}
.wcard .w-en{font-size:44px;font-weight:800;line-height:1.05;margin:10px 0 2px;display:flex;align-items:center;justify-content:center;gap:10px}
.wcard .w-ko{font-size:19px;font-weight:900;margin-top:4px}
.known-badge{display:inline-block;margin-top:9px;padding:4px 11px;border-radius:999px;background:#fff;
  border:2px solid var(--green2);color:#4E8C3E;font-size:11.5px;font-weight:900;line-height:1.4}
.spk{width:40px;height:40px;border-radius:50%;background:var(--yellow);border:var(--bd);box-shadow:var(--shadow-sm);
  display:inline-grid;place-items:center;flex:none}
.spk:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(61,49,42,.85)}
.spk svg{width:19px;height:19px}
.spk.sm{width:30px;height:30px}.spk.sm svg{width:15px;height:15px}
.exbox{margin-top:14px;background:var(--greenbg);border:2px solid var(--ink);border-radius:16px;padding:12px 14px;text-align:left}
.exbox .ex-en{font-size:16.5px;font-weight:800;line-height:1.45}
.exbox .ex-en b{color:#E8641E}
.exbox .ex-ko{font-size:13px;color:var(--ink2);font-weight:700;margin-top:4px}
.card-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}
.w-idx{font-size:12px;font-weight:900;color:var(--ink2)}
.mem-row{display:flex;gap:8px;margin-top:12px}
.mem-row .btn{flex:1;min-height:44px;font-size:14.5px}
.prog{height:12px;border-radius:999px;border:2px solid var(--ink);background:#fff;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--orange));border-radius:999px;transition:width .4s}

/* ============ quiz ============ */
.quiz-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.quiz-q{font-size:20px;font-weight:900;text-align:center;line-height:1.35;margin:6px 0 14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:66px;justify-content:center;
  padding:10px 8px;border-radius:18px;border:var(--bd);background:var(--paper);box-shadow:var(--shadow-sm);
  font-weight:900;font-size:16.5px;text-align:center}
.opt small{font-size:11px;color:var(--ink2);font-weight:700}
.opt.ok{background:var(--green);animation:pop .35s}
.opt.no{background:var(--pink);animation:shake .4s}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:52px;margin:10px 0}
.tile{width:44px;height:48px;border-radius:12px;border:var(--bd);background:var(--paper);box-shadow:var(--shadow-sm);
  font-family:'Baloo 2',sans-serif;font-size:22px;font-weight:800;display:grid;place-items:center}
.tile.ghost{background:var(--cream2);border-style:dashed;box-shadow:none;color:transparent}
.tile.used{opacity:.28;pointer-events:none}
.tile.sm{width:34px;height:38px;font-size:18px}
.answer-line{min-height:54px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;
  background:var(--cream2);border:2px dashed var(--ink);border-radius:14px;padding:6px}
.ans-tile{width:38px;height:42px;border-radius:10px;border:var(--bd);background:var(--yellow);
  font-family:'Baloo 2',sans-serif;font-size:20px;font-weight:800;display:grid;place-items:center}
.quiz-prog{display:flex;gap:4px}
.quiz-prog i{flex:1;height:9px;border-radius:99px;background:#fff;border:2px solid var(--ink)}
.quiz-prog i.done{background:var(--green2)} .quiz-prog i.now{background:var(--yellow)}
.heard-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px}
.res-stars{font-size:34px;letter-spacing:2px;text-align:center;margin:6px 0}
.center{text-align:center}

/* ============ pets / combine ============ */
.pet-row{display:flex;gap:10px;overflow-x:auto;padding:8px 2px 4px;scrollbar-width:none}
.pet-row::-webkit-scrollbar{display:none}
.pet-card{flex:none;width:118px;border:var(--bd);border-radius:18px;background:var(--paper);box-shadow:var(--shadow-sm);
  padding:10px 8px;text-align:center;position:relative}
.pet-card .pv{width:64px;height:64px;margin:0 auto;display:grid;place-items:center}
.pet-card .nm{font-size:12.5px;font-weight:900;margin-top:4px}
.pet-card .sub{font-size:10.5px;color:var(--ink2);font-weight:700}
.pet-card.evo{background:var(--purple)}
.merge-ready{outline:3px solid var(--yellow2);outline-offset:2px;border-radius:18px}
.combine-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mat{display:flex;align-items:center;gap:8px;padding:9px 10px;border:var(--bd);border-radius:16px;background:var(--paper);
  box-shadow:var(--shadow-sm);font-weight:900;font-size:13px;text-align:left}
.mat .mi{width:34px;height:34px;flex:none;border-radius:11px;border:2px solid var(--ink);display:grid;place-items:center;background:var(--cream2)}
.mat .cnt{margin-left:auto;font-size:12px;color:var(--ink2);font-weight:900}
.mat.sel{background:var(--green)}
.combine-zone{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 0;flex-wrap:wrap}
.plus{font-size:22px;font-weight:900}
.book-item{display:flex;align-items:center;gap:10px;border:var(--bd);border-radius:18px;background:var(--paper);
  box-shadow:var(--shadow-sm);padding:10px 12px;margin-bottom:10px}
.book-item .bi{width:46px;height:46px;flex:none;border-radius:14px;border:2px solid var(--ink);background:var(--cream2);
  display:grid;place-items:center}
.book-item .bn{font-weight:900;font-size:14px}
.book-item .bd2{font-size:11.5px;color:var(--ink2);font-weight:700;margin-top:1px}
.book-item .bstar{margin-left:auto;font-size:13px;letter-spacing:1px;white-space:nowrap}
.locked{opacity:.55}

/* ============ report ============ */
.rep-row{margin:12px 0 2px}
.rep-lab{display:flex;justify-content:space-between;font-size:13px;font-weight:900;margin-bottom:5px}
.rep-note{background:var(--greenbg);border:2px solid var(--ink);border-radius:16px;padding:12px 14px;
  font-weight:800;font-size:14px;line-height:1.5;margin:10px 0}
.weak{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border:2px solid var(--ink);
  border-radius:14px;background:var(--paper);margin-bottom:8px;font-weight:800;font-size:14px}
.weak small{display:block;font-size:11.5px;color:var(--ink2);font-weight:700}

/* ============ toast / fx / modal ============ */
#toastHost{position:fixed;left:0;right:0;top:calc(14px + env(safe-area-inset-top));z-index:90;display:flex;justify-content:center;pointer-events:none}
.toast{background:var(--ink);color:#FFF6D8;font-weight:800;font-size:13.5px;border-radius:999px;padding:10px 18px;
  box-shadow:0 8px 20px rgba(0,0,0,.25);animation:toastIn .25s}
@keyframes toastIn{from{transform:translateY(-14px);opacity:0}to{transform:translateY(0);opacity:1}}
.star-float{position:fixed;z-index:95;font-weight:900;font-size:22px;color:#FFB300;pointer-events:none;
  text-shadow:0 2px 0 #fff, 0 0 8px rgba(255,200,0,.6);animation:floatUp 1.1s ease-out forwards}
@keyframes floatUp{from{transform:translateY(0);opacity:1}to{transform:translateY(-70px);opacity:0}}
.confetti{position:fixed;z-index:95;pointer-events:none;animation:conf 1.3s ease-in forwards}
@keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:.2}}
.modal-back{position:fixed;inset:0;z-index:80;background:rgba(61,49,42,.45);display:grid;place-items:center;padding:22px}
.modal{width:100%;max-width:340px;background:var(--paper);border:3px solid var(--ink);border-radius:24px;
  box-shadow:var(--shadow);padding:20px 18px;text-align:center;animation:pop .3s}
.modal .m-art{margin:8px 0}
.modal h3{font-size:19px;font-weight:900}
.modal p{font-size:13.5px;font-weight:700;color:var(--ink2);margin-top:6px;line-height:1.5}
.m-btns{display:flex;gap:8px;justify-content:center;margin-top:16px}
.box-art{width:120px;height:120px;margin:6px auto;animation:boxShake 1s ease-in-out infinite}
@keyframes boxShake{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(-4px)}}

/* ============ v3: IELTS 카드 · 목표 · 마을 방문 ============ */
.day-title{font-size:12.5px;font-weight:900;color:var(--ink2);margin:2px 2px 8px}
.syn-row{margin-top:8px;font-size:12.5px;font-weight:800;color:var(--ink2)}
.syn-row b{display:inline-block;margin-right:5px;padding:2px 8px;border-radius:999px;background:var(--purple);border:2px solid var(--ink);color:var(--ink);font-size:11.5px}
.goal-note{background:var(--yellow);border:2px solid var(--ink);border-radius:16px;padding:11px 14px;font-weight:800;font-size:13.5px;margin:10px 0;line-height:1.45}
.sync-chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;
  border:2px solid var(--ink);background:var(--paper);font-weight:900;font-size:11.5px;box-shadow:0 2px 0 rgba(61,49,42,.85)}
.sync-chip i{width:8px;height:8px;border-radius:50%;background:var(--ink2);display:inline-block}
.sync-chip.ok i{background:var(--green2)} .sync-chip.wait i{background:var(--yellow2)} .sync-chip.bad i{background:var(--pink2)}
.visit-head{display:flex;align-items:center;gap:8px;margin:4px 2px 10px;flex-wrap:wrap}
.visit-head .nm{font-size:16px;font-weight:900}
.village-sky.ro .slot{cursor:default}
.ro-note{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;background:rgba(255,253,246,.92);
  border:2px solid var(--ink);border-radius:999px;padding:3px 12px;font-size:11px;font-weight:900;color:var(--ink2);white-space:nowrap}
.visit-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.vstat{border:2px solid var(--ink);border-radius:16px;background:var(--paper);padding:9px 11px;box-shadow:0 2px 0 rgba(61,49,42,.85)}
.vstat b{display:block;font-size:16px;font-weight:900}
.vstat small{font-size:11px;font-weight:800;color:var(--ink2)}
.wall-item{border:2px solid var(--ink);border-radius:16px;background:var(--paper);padding:9px 12px;margin-bottom:8px}
.wall-item .who{font-size:11.5px;font-weight:900;color:var(--ink2);display:flex;justify-content:space-between;gap:8px}
.wall-item .msg{font-size:13.5px;font-weight:800;margin-top:3px;line-height:1.45}
.wall-item.gift{background:var(--pinkbg)}
.visit-form textarea{width:100%;min-height:64px;border:var(--bd);border-radius:14px;padding:10px 12px;
  font-family:inherit;font-size:14px;font-weight:700;resize:none;background:#fff;color:var(--ink)}
.gift-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.gift-row .btn{flex:1;min-height:44px;font-size:14px;min-width:130px}
.hint{font-size:11.5px;font-weight:800;color:var(--ink2);margin-top:6px;line-height:1.45}
.heart-line{display:flex;align-items:center;gap:6px;margin-top:8px}
.heart-line label{font-size:13px;font-weight:900}

</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-badge">📘</div>
      <div>
        <h1>IELTS 단어 마을</h1>
        <p id="topSub">IELTS 필수 영단어 960</p>
      </div>
    </div>
    <div class="coins">
      <span class="coin" title="별"><svg viewBox="0 0 24 24" fill="#FFC93C" stroke="#3D312A" stroke-width="1.6"><path d="M12 2l2.9 6.2 6.6.8-4.9 4.6 1.3 6.6L12 17l-5.9 3.2 1.3-6.6L2.5 9l6.6-.8z"/></svg><span id="coinStars">0</span></span>
      <span class="coin" title="상자"><span style="font-size:14px">🎁</span><span id="coinBoxes">0</span></span>
    </div>
  </header>

  <main id="screens">
    <section id="scr-village"></section>
    <section id="scr-learn" class="hidden"></section>
    <section id="scr-quiz" class="hidden"></section>
    <section id="scr-book" class="hidden"></section>
    <section id="scr-visit" class="hidden"></section>
    <section id="scr-report" class="hidden"></section>
  </main>

  <nav class="nav">
    <div class="nav-in" id="navIn"></div>
  </nav>
</div>
<div id="toastHost"></div>
<div id="fxHost"></div>
<div id="modalHost"></div>

gger","meaning":"촉발하다","pos":"동사","example":"One comment triggered a long argument.","exampleKo":"한 마디가 긴 말다툼을 촉발했다.","syn":"spark/provoke","level":"core","day":19},{"word":"impact","meaning":"영향","pos":"명사","example":"The impact of tourism on the coast is clear.","exampleKo":"관광이 해안에 미치는 영향은 분명하다.","syn":"effect","level":"core","day":19},{"word":"outcome","meaning":"결과","pos":"명사","example":"The outcome of the tests surprised everyone.","exampleKo":"시험 결과가 모두를 놀라게 했다.","syn":"result/conclusion","level":"core","day":19},{"word":"derive","meaning":"얻다, 파생되다","pos":"동사","example":"Many medicines derive from plants.","exampleKo":"많은 의약품이 식물에서 나온다.","syn":"obtain/originate","level":"core","day":19},{"word":"generate","meaning":"생성하다","pos":"동사","example":"Solar panels generate electricity quietly.","exampleKo":"태양광 패널은 조용히 전기를 생성한다.","syn":"produce/create","level":"core","day":19},{"word":"arise","meaning":"발생하다","pos":"동사","example":"Problems arise when rules are unclear.","exampleKo":"규칙이 불분명하면 문제가 발생한다.","syn":"emerge/occur","level":"core","day":19},{"word":"hence","meaning":"그러므로, 이로 인해","pos":"부사","example":"The data were weak, hence the cautious tone.","exampleKo":"데이터가 약했다, 그러므로 신중한 어조였다.","syn":"therefore/thus","level":"core","day":19},{"word":"therefore","meaning":"그러므로","pos":"부사","example":"The road is narrow; therefore, traffic is slow.","exampleKo":"그 길은 좁다; 그러므로 교통이 느리다.","syn":"thus/consequently","level":"core","day":19},{"word":"motive","meaning":"동기","pos":"명사","example":"Money was not his only motive.","exampleKo":"돈이 그의 유일한 동기는 아니었다.","syn":"reason/incentive","level":"core","day":19},{"word":"determine","meaning":"결정하다, 좌우하다","pos":"동사","example":"Early habits determine later success.","exampleKo":"초기 습관이 이후의 성공을 좌우한다.","syn":"decide/shape","level":"core","day":19},{"word":"stimulate","meaning":"자극하다, 촉진하다","pos":"동사","example":"Lower prices stimulate demand.","exampleKo":"낮은 가격은 수요를 자극한다.","syn":"encourage/spur","level":"core","day":19},{"word":"compare","meaning":"비교하다","pos":"동사","example":"The report compares two transport systems.","exampleKo":"그 보고서는 두 교통 체계를 비교한다.","syn":"contrast/weigh","level":"core","day":20},{"word":"contrast","meaning":"대조하다","pos":"동사","example":"The essay contrasts urban and rural life.","exampleKo":"그 글은 도시 생활과 농촌 생활을 대조한다.","syn":"compare/oppose","level":"core","day":20},{"word":"similar","meaning":"비슷한","pos":"형용사","example":"The two results were very similar.","exampleKo":"두 결과는 매우 비슷했다.","syn":"comparable/alike","level":"core","day":20},{"word":"distinct","meaning":"뚜렷이 다른","pos":"형용사","example":"The two groups have distinct needs.","exampleKo":"두 집단은 뚜렷이 다른 요구를 갖고 있다.","syn":"different/separate","level":"core","day":20},{"word":"significant","meaning":"중요한, 상당한","pos":"형용사","example":"There was a significant rise in 2019.","exampleKo":"2019년에 상당한 상승이 있었다.","syn":"important/considerable","level":"core","day":20},{"word":"minor","meaning":"사소한, 경미한","pos":"형용사","example":"Only minor changes were made.","exampleKo":"사소한 변경만 이루어졌다.","syn":"small/slight","level":"core","day":20},{"word":"superior","meaning":"더 나은, 우수한","pos":"형용사","example":"This method is superior to the old one.","exampleKo":"이 방법은 옛 방법보다 우수하다.","syn":"better/higher","level":"core","day":20},{"word":"inferior","meaning":"열등한, 더 낮은","pos":"형용사","example":"Cheap materials are often inferior in quality.","exampleKo":"값싼 재료는 흔히 품질이 더 낮다.","syn":"worse/lower","level":"core","day":20},{"word":"average","meaning":"평균의","pos":"형용사","example":"The average score rose by five points.","exampleKo":"평균 점수가 5점 올랐다.","syn":"typical/mean","level":"core","day":20},{"word":"equivalent","meaning":"동등한, 맞먹는","pos":"형용사","example":"One hour of cycling is equivalent to two hours of walking.","exampleKo":"한 시간의 자전거 타기는 두 시간 걷기와 맞먹는다.","syn":"equal/comparable","level":"core","day":20},{"word":"predominant","meaning":"주된, 지배적인","pos":"형용사","example":"Rice is the predominant crop in Asia.","exampleKo":"쌀은 아시아의 주된 작물이다.","syn":"dominant/main","level":"core","day":20},{"word":"remarkable","meaning":"놀라운","pos":"형용사","example":"She made remarkable progress in three months.","exampleKo":"그녀는 3개월 만에 놀라운 발전을 이루었다.","syn":"striking/impressive","level":"core","day":20},{"word":"ordinary","meaning":"평범한","pos":"형용사","example":"An ordinary day can still be useful.","exampleKo":"평범한 하루도 여전히 유용할 수 있다.","syn":"normal/routine","level":"core","day":20},{"word":"extreme","meaning":"극심한","pos":"형용사","example":"Extreme heat damages young plants.","exampleKo":"극심한 더위는 어린 식물을 해친다.","syn":"severe/intense","level":"core","day":20},{"word":"moderate","meaning":"중간 정도의, 온건한","pos":"형용사","example":"The area has moderate rainfall.","exampleKo":"그 지역은 중간 정도의 강수량을 보인다.","syn":"reasonable/medium","level":"core","day":20},{"word":"slight","meaning":"약간의","pos":"형용사","example":"There was a slight fall in February.","exampleKo":"2월에 약간의 하락이 있었다.","syn":"small/minor","level":"core","day":20},{"word":"refer","meaning":"언급하다, 가리키다","pos":"동사","example":"The writer refers to a study in paragraph two.","exampleKo":"글쓴이는 두 번째 단락에서 한 연구를 언급한다.","syn":"mention/allude","level":"skills","day":21},{"word":"indicate","meaning":"나타내다, 시사하다","pos":"동사","example":"The results indicate a steady improvement.","exampleKo":"결과는 꾸준한 향상을 나타낸다.","syn":"show/suggest","level":"skills","day":21},{"word":"specify","meaning":"명시하다","pos":"동사","example":"The notice does not specify a closing time.","exampleKo":"그 안내문은 폐장 시간을 명시하지 않는다.","syn":"state/define","level":"skills","day":21},{"word":"mention","meaning":"언급하다","pos":"동사","example":"She mentions three reasons for the change.","exampleKo":"그녀는 그 변화의 세 가지 이유를 언급한다.","syn":"note/refer to","level":"skills","day":21},{"word":"claim","meaning":"주장하다","pos":"동사","example":"The author claims that screens harm sleep.","exampleKo":"그 저자는 화면이 수면을 해친다고 주장한다.","syn":"assert/maintain","level":"skills","day":21},{"word":"state","meaning":"진술하다, 밝히다","pos":"동사","example":"The report states that costs will rise.","exampleKo":"그 보고서는 비용이 오를 것이라고 밝힌다.","syn":"declare/say","level":"skills","day":21},{"word":"explicit","meaning":"명백한, 분명히 밝힌","pos":"형용사","example":"The rules are explicit about late entry.","exampleKo":"그 규칙은 지각 입장에 대해 명백하다.","syn":"clear/direct","level":"skills","day":21},{"word":"imply","meaning":"암시하다","pos":"동사","example":"The final sentence may imply a warning.","exampleKo":"마지막 문장은 경고를 암시할 수 있다.","syn":"suggest/hint","level":"skills","day":21},{"word":"context","meaning":"문맥, 맥락","pos":"명사","example":"Guess the meaning from context.","exampleKo":"문맥에서 뜻을 추측하라.","syn":"setting/background","level":"skills","day":21},{"word":"passage","meaning":"지문, 구절","pos":"명사","example":"Read the passage and answer the questions.","exampleKo":"지문을 읽고 질문에 답하라.","syn":"text/extract","level":"skills","day":21},{"word":"emphasize","meaning":"강조하다","pos":"동사","example":"The writer emphasize the cost of inaction.","exampleKo":"글쓴이는 행동하지 않을 때의 비용을 강조한다.","syn":"stress/highlight","level":"skills","day":21},{"word":"illustrate","meaning":"예시로 보여 주다","pos":"동사","example":"The chart illustrates changes in rainfall.","exampleKo":"그 도표는 강수량 변화를 보여 준다.","syn":"show/demonstrate","level":"skills","day":21},{"word":"demonstrate","meaning":"입증하다","pos":"동사","example":"The study demonstrates a clear link.","exampleKo":"그 연구는 뚜렷한 연관성을 입증한다.","syn":"prove/show","level":"skills","day":21},{"word":"outline","meaning":"개요를 설명하다","pos":"동사","example":"The first paragraph outline the main argument.","exampleKo":"첫 단락은 주요 논지를 개요로 설명한다.","syn":"summarise/sketch","level":"skills","day":21},{"word":"summarise","meaning":"요약하다","pos":"동사","example":"Summarise the main idea in one sentence.","exampleKo":"주요 생각을 한 문장으로 요약하라.","syn":"sum up/condense","level":"skills","day":21},{"word":"define","meaning":"정의하다","pos":"동사","example":"The text define success in two ways.","exampleKo":"그 글은 성공을 두 가지로 정의한다.","syn":"explain/describe","level":"skills","day":21},{"word":"infer","meaning":"추론하다","pos":"동사","example":"You can infer her mood from the last line.","exampleKo":"마지막 문장에서 그녀의 기분을 추론할 수 있다.","syn":"deduce/gather","level":"skills","day":22},{"word":"assume","meaning":"가정하다, 추정하다","pos":"동사","example":"Do not assume that all readers agree.","exampleKo":"모든 독자가 동의한다고 가정하지 마라.","syn":"presume/suppose","level":"skills","day":22},{"word":"suggest","meaning":"시사하다, 제안하다","pos":"동사","example":"The data suggest a slower market.","exampleKo":"그 데이터는 시장이 둔화되고 있음을 시사한다.","syn":"indicate/propose","level":"skills","day":22},{"word":"attitude","meaning":"태도","pos":"명사","example":"The writer attitude towards tourism is mixed.","exampleKo":"관광에 대한 글쓴이의 태도는 엇갈린다.","syn":"stance/outlook","level":"skills","day":22},{"word":"sceptical","meaning":"회의적인","pos":"형용사","example":"She remains sceptical about the new method.","exampleKo":"그녀는 그 새 방법에 대해 여전히 회의적이다.","syn":"doubtful","level":"skills","day":22},{"word":"sympathetic","meaning":"공감하는, 동정적인","pos":"형용사","example":"The article is sympathetic to young workers.","exampleKo":"그 기사는 젊은 노동자에게 공감한다.","syn":"understanding","level":"skills","day":22},{"word":"critical","meaning":"비판적인","pos":"형용사","example":"The review is critical of the design.","exampleKo":"그 평가는 디자인에 비판적이다.","syn":"disapproving","level":"skills","day":22},{"word":"neutral","meaning":"중립적인","pos":"형용사","example":"The reporter keeps a neutral tone.","exampleKo":"그 기자는 중립적인 어조를 유지한다.","syn":"impartial/unbiased","level":"skills","day":22},{"word":"objective","meaning":"객관적인","pos":"형용사","example":"An objective summary avoids opinions.","exampleKo":"객관적인 요약은 의견을 피한다.","syn":"factual/impartial","level":"skills","day":22},{"word":"doubt","meaning":"의심","pos":"명사","example":"There is doubt about the sample size.","exampleKo":"표본 크기에 대한 의심이 있다.","syn":"uncertainty","level":"skills","day":22},{"word":"tendency","meaning":"경향","pos":"명사","example":"The author shows a tendency to generalise.","exampleKo":"그 저자는 일반화하는 경향을 보인다.","syn":"inclination","level":"skills","day":22},{"word":"cautious","meaning":"신중한","pos":"형용사","example":"The conclusion is cautious but positive.","exampleKo":"그 결론은 신중하지만 긍정적이다.","syn":"careful/guarded","level":"skills","day":22},{"word":"enthusiastic","meaning":"열성적인","pos":"형용사","example":"Readers were enthusiastic about the plan.","exampleKo":"독자들은 그 계획에 열성적이었다.","syn":"keen/eager","level":"skills","day":22},{"word":"dismissive","meaning":"무시하는, 일축하는","pos":"형용사","example":"His reply was dismissive and short.","exampleKo":"그의 답변은 무시하듯 짧았다.","syn":"offhand","level":"skills","day":22},{"word":"contradict","meaning":"반박하다, 모순되다","pos":"동사","example":"The two reports contradict each other.","exampleKo":"두 보고서는 서로 모순된다.","syn":"oppose/deny","level":"skills","day":22},{"word":"overlook","meaning":"간과하다","pos":"동사","example":"Critics often overlook the cost of delay.","exampleKo":"비평가들은 흔히 지연의 비용을 간과한다.","syn":"ignore/miss","level":"skills","day":22},{"word":"heading","meaning":"소제목","pos":"명사","example":"Choose the best heading for each paragraph.","exampleKo":"각 단락에 가장 알맞은 소제목을 고르라.","syn":"title","level":"skills","day":23},{"word":"section","meaning":"부분, 섹션","pos":"명사","example":"Section B describes the method.","exampleKo":"B 부분은 방법을 설명한다.","syn":"part/division","level":"skills","day":23},{"word":"paragraph","meaning":"단락","pos":"명사","example":"The last paragraph offers a solution.","exampleKo":"마지막 단락은 해결책을 제시한다.","syn":"passage/block","level":"skills","day":23},{"word":"topic","meaning":"주제","pos":"명사","example":"The topic of the text is urban farming.","exampleKo":"그 글의 주제는 도시 농업이다.","syn":"subject/theme","level":"skills","day":23},{"word":"theme","meaning":"주제, 테마","pos":"명사","example":"A common theme is the value of patience.","exampleKo":"흔한 주제는 인내의 가치이다.","syn":"topic/motif","level":"skills","day":23},{"word":"overview","meaning":"개요","pos":"명사","example":"The first page gives an overview of the course.","exampleKo":"첫 페이지는 그 과정의 개요를 제시한다.","syn":"summary/survey","level":"skills","day":23},{"word":"gist","meaning":"요지","pos":"명사","example":"Read quickly to catch the gist.","exampleKo":"요지를 잡기 위해 빠르게 읽어라.","syn":"main idea","level":"skills","day":23},{"word":"focus","meaning":"초점","pos":"명사","example":"The focus shifts to costs in the final part.","exampleKo":"마지막 부분에서 초점이 비용으로 옮겨간다.","syn":"emphasis/centre","level":"skills","day":23},{"word":"structure","meaning":"구조","pos":"명사","example":"Notice the structure of the argument.","exampleKo":"논증의 구조를 살펴라.","syn":"organisation/framework","level":"skills","day":23},{"word":"introduce","meaning":"도입하다, 소개하다","pos":"동사","example":"The writer introduce the topic with a story.","exampleKo":"글쓴이는 이야기로 주제를 도입한다.","syn":"present","level":"skills","day":23},{"word":"describe","meaning":"묘사하다","pos":"동사","example":"The passage describe a typical school day.","exampleKo":"그 지문은 전형적인 학교생활을 묘사한다.","syn":"depict/portray","level":"skills","day":23},{"word":"classify","meaning":"분류하다","pos":"동사","example":"The text classify the animals into three groups.","exampleKo":"그 글은 동물을 세 집단으로 분류한다.","syn":"categorise/group","level":"skills","day":23},{"word":"categorise","meaning":"분류하다","pos":"동사","example":"It is hard to categorise the style of the building.","exampleKo":"그 건물의 양식을 분류하기는 어렵다.","syn":"classify/group","level":"skills","day":23},{"word":"match","meaning":"짝짓다, 대응시키다","pos":"동사","example":"Match each heading to the correct paragraph.","exampleKo":"각 소제목을 알맞은 단락에 짝지으라.","syn":"pair/connect","level":"skills","day":23},{"word":"label","meaning":"표시하다, 명명하다","pos":"동사","example":"Label the parts of the diagram.","exampleKo":"도해의 각 부분을 표시하라.","syn":"name/mark","level":"skills","day":23},{"word":"order","meaning":"순서","pos":"명사","example":"The events appear in a clear order.","exampleKo":"사건들이 분명한 순서로 나타난다.","syn":"sequence","level":"skills","day":23},{"word":"lecture","meaning":"강의","pos":"명사","example":"The lecture on climate starts at ten.","exampleKo":"기후에 관한 강의는 10시에 시작한다.","syn":"talk/presentation","level":"skills","day":24},{"word":"tutoria aning":"확인하다, 확정하다","pos":"동사","example":"Please confirm the date by email.","exampleKo":"이메일로 날짜를 확정해 주세요.","syn":"verify/approve","level":"skills","day":26},{"word":"cancel","meaning":"취소하다","pos":"동사","example":"You can cancel up to 48 hours before.","exampleKo":"48시간 전까지 취소할 수 있다.","syn":"call off","level":"skills","day":26},{"word":"refund","meaning":"환불","pos":"명사","example":"A full refund is available within a week.","exampleKo":"일주일 안에는 전액 환불이 가능하다.","syn":"repayment","level":"skills","day":26},{"word":"insurance","meaning":"보험","pos":"명사","example":"Travel insurance covers lost luggage.","exampleKo":"여행자 보험은 분실 수하물을 보상한다.","syn":"cover/protection","level":"skills","day":26},{"word":"passport","meaning":"여권","pos":"명사","example":"Your passport must be valid for six months.","exampleKo":"여권은 6개월 이상 유효해야 한다.","syn":"travel document","level":"skills","day":26},{"word":"visa","meaning":"비자","pos":"명사","example":"The visa allows a stay of ninety days.","exampleKo":"그 비자는 90일 체류를 허용한다.","syn":"entry permit","level":"skills","day":26},{"word":"baggage","meaning":"수하물","pos":"명사","example":"Baggage claim is on the ground floor.","exampleKo":"수하물 찾는 곳은 1층에 있다.","syn":"luggage","level":"skills","day":26},{"word":"gate","meaning":"탑승구","pos":"명사","example":"The flight leaves from gate twelve.","exampleKo":"그 항공편은 12번 탑승구에서 출발한다.","syn":"boarding gate","level":"skills","day":26},{"word":"departure","meaning":"출발","pos":"명사","example":"Departure time moved to six fifteen.","exampleKo":"출발 시간이 6시 15분으로 바뀌었다.","syn":"leaving","level":"skills","day":26},{"word":"arrival","meaning":"도착","pos":"명사","example":"The arrival was delayed by fog.","exampleKo":"도착이 안개 때문에 지연되었다.","syn":"coming in","level":"skills","day":26},{"word":"transfer","meaning":"환승, 이동","pos":"명사","example":"The transfer at Seoul station takes ten minutes.","exampleKo":"서울역에서 환승은 10분 걸린다.","syn":"connection","level":"skills","day":26},{"word":"package","meaning":"패키지 상품","pos":"명사","example":"The package includes two nights and breakfast.","exampleKo":"그 패키지에는 2박과 조식이 포함된다.","syn":"deal/bundle","level":"skills","day":26},{"word":"guide","meaning":"안내자, 안내서","pos":"명사","example":"A local guide showed us the old streets.","exampleKo":"현지 안내자가 우리에게 옛 거리를 보여 주었다.","syn":"leader/handbook","level":"skills","day":26},{"word":"sightseeing","meaning":"관광","pos":"명사","example":"We spent the morning sightseeing in the old town.","exampleKo":"우리는 오전에 구시가지를 관광했다.","syn":"touring","level":"skills","day":26},{"word":"appointment","meaning":"예약, 진료 예약","pos":"명사","example":"My appointment with the doctor is at three.","exampleKo":"의사 선생님과의 진료 예약은 3시이다.","syn":"booking","level":"skills","day":27},{"word":"prescription","meaning":"처방전","pos":"명사","example":"Take the prescription to the pharmacy.","exampleKo":"처방전을 약국에 가져가세요.","syn":"medical order","level":"skills","day":27},{"word":"pharmacy","meaning":"약국","pos":"명사","example":"The pharmacy closes at seven on weekdays.","exampleKo":"그 약국은 평일에 7시에 문을 닫는다.","syn":"drugstore","level":"skills","day":27},{"word":"allergy","meaning":"알레르기","pos":"명사","example":"The nurse asked about any allergy to nuts.","exampleKo":"간호사가 견과류 알레르기가 있는지 물었다.","syn":"reaction","level":"skills","day":27},{"word":"injury","meaning":"부상","pos":"명사","example":"A knee injury kept him out for a month.","exampleKo":"무릎 부상으로 그는 한 달을 쉬었다.","syn":"wound/harm","level":"skills","day":27},{"word":"patient","meaning":"환자","pos":"명사","example":"Each patient receives a printed summary.","exampleKo":"각 환자는 인쇄된 요약본을 받는다.","syn":"sufferer","level":"skills","day":27},{"word":"dentist","meaning":"치과 의사","pos":"명사","example":"The dentist found a small cavity.","exampleKo":"치과 의사가 작은 충치를 발견했다.","syn":"dental surgeon","level":"skills","day":27},{"word":"infection","meaning":"감염","pos":"명사","example":"The infection cleared up after a week.","exampleKo":"그 감염은 일주일 뒤 사라졌다.","syn":"contagion","level":"skills","day":27},{"word":"surgery","meaning":"수술","pos":"명사","example":"The surgery lasted about two hours.","exampleKo":"그 수술은 두 시간 정도 걸렸다.","syn":"operation","level":"skills","day":27},{"word":"emergency","meaning":"응급 상황","pos":"명사","example":"In an emergency, call this number.","exampleKo":"응급 상황에서는 이 번호로 전화하세요.","syn":"crisis","level":"skills","day":27},{"word":"checkup","meaning":"건강 검진","pos":"명사","example":"An annual checkup is recommended after forty.","exampleKo":"40세 이후에는 연례 건강 검진을 권한다.","syn":"medical exam","level":"skills","day":27},{"word":"referral","meaning":"진료 의뢰","pos":"명사","example":"The clinic sent a referral to a specialist.","exampleKo":"그 의원은 전문의에게 진료 의뢰를 보냈다.","syn":"recommendation","level":"skills","day":27},{"word":"painkiller","meaning":"진통제","pos":"명사","example":"Take one painkiller with water.","exampleKo":"진통제 한 알을 물과 함께 드세요.","syn":"pain relief","level":"skills","day":27},{"word":"dose","meaning":"복용량","pos":"명사","example":"Do not exceed the recommended dose.","exampleKo":"권장 복용량을 초과하지 마세요.","syn":"amount","level":"skills","day":27},{"word":"recovery","meaning":"회복","pos":"명사","example":"Full recovery takes four to six weeks.","exampleKo":"완전한 회복에는 4~6주가 걸린다.","syn":"healing","level":"skills","day":27},{"word":"vaccination","meaning":"예방 접종","pos":"명사","example":"Vaccination protects both mother and baby.","exampleKo":"예방 접종은 산모와 아기 모두를 보호한다.","syn":"inoculation","level":"skills","day":27},{"word":"increase","meaning":"증가하다","pos":"동사","example":"The number of cyclists increase each year.","exampleKo":"자전거 이용자 수가 매년 증가한다.","syn":"rise/grow","level":"skills","day":28},{"word":"rise","meaning":"오르다","pos":"동사","example":"House prices rise faster in the capital.","exampleKo":"집값은 수도권에서 더 빨리 오른다.","syn":"increase/climb","level":"skills","day":28},{"word":"grow","meaning":"성장하다","pos":"동사","example":"Online sales grow steadily from 2015.","exampleKo":"온라인 매출은 2015년부터 꾸준히 성장한다.","syn":"expand/rise","level":"skills","day":28},{"word":"climb","meaning":"(수치가) 오르다","pos":"동사","example":"The figure climb to 40 percent by 2020.", 율이 45퍼센트로 올랐다.","syn":"proportion/rate","level":"skills","day":30},{"word":"proportion","meaning":"비율","pos":"명사","example":"A large proportion of workers commute by bus.","exampleKo":"많은 비율의 근로자가 버스로 통근한다.","syn":"share/percentage","level":"skills","day":30},{"word":"majority","meaning":"대다수","pos":"명사","example":"The majority of respondents preferred morning classes.","exampleKo":"응답자의 대다수가 오전 수업을 선호했다.","syn":"most","level":"skills","day":30},{"word":"minority","meaning":"소수","pos":"명사","example":"Only a minority supported the change.","exampleKo":"소수만 그 변화를 지지했다.","syn":"small number","level":"skills","day":30},{"word":"quarter","meaning":"4분의 1","pos":"명사","example":"A quarter of the budget goes to transport.","exampleKo":"예산의 4분의 1이 교통에 쓰인다.","syn":"one fourth","level":"skills","day":30},{"word":"third","meaning":"3분의 1","pos":"명사","example":"About a third of the land is farmland.","exampleKo":"토지의 약 3분의 1이 농지이다.","syn":"one third","level":"skills","day":30},{"word":"half","meaning":"절반","pos":"명사","example":"Half of the students live on campus.","exampleKo":"학생의 절반이 캠퍼스에 산다.","syn":"50 percent","level":"skills","day":30},{"word":"total","meaning":"총계","pos":"명사","example":"The total fell by two thousand visitors.","exampleKo":"총계가 방문객 2천 명만큼 줄었다.","syn":"sum/whole","level":"skills","day":30},{"word":"distribution","meaning":"분포","pos":"명사","example":"The distribution of ages is uneven.","exampleKo":"연령 분포가 고르지 않다.","syn":"spread/allocation","level":"skills","day":30},{"word":"estimate","meaning":"추정치","pos":"명사","example":"The estimate is based on last year's data.","exampleKo":"그 추정치는 작년 데이터에 근거한다.","syn":"projection","level":"skills","day":30},{"word":"represent","meaning":"나타내다, 대표하다","pos":"동사","example":"The bars represent monthly sales.","exampleKo":"막대는 월별 매출을 나타낸다.","syn":"show/stand for","level":"skills","day":30},{"word":"rank","meaning":"순위","pos":"명사","example":"Korea ranks second in the table.","exampleKo":"한국은 그 표에서 순위 2위이다.","syn":"position/place","level":"skills","day":30},{"word":"map","meaning":"지도","pos":"명사","example":"The map shows the village in 1990 and today.","exampleKo":"그 지도는 1990년과 현재의 마을을 보여 준다.","syn":"plan/chart","level":"skills","day":31},{"word":"location","meaning":"위치","pos":"명사","example":"The library moved to a new location.","exampleKo":"도서관이 새 위치로 옮겼다.","syn":"position/site","level":"skills","day":31},{"word":"situated","meaning":"위치한","pos":"형용사","example":"The school is situated beside the river.","exampleKo":"그 학교는 강 옆에 위치해 있다.","syn":"located/placed","level":"skills","day":31},{"word":"replace","meaning":"대체하다","pos":"동사","example":"A car park will replace the old market.","exampleKo":"옛 시장을 주차장이 대체할 것이다.","syn":"substitute","level":"skills","day":31},{"word":"expand","meaning":"확장하다","pos":"동사","example":"The factory plan to expand next year.","exampleKo":"그 공장은 내년에 확장할 계획이다.","syn":"extend/enlarge","level":"skills","day":31},{"word":"demolish","meaning":"철거하다","pos":"동사","example":"Workers will demolish the old cinema.","exampleKo":"노동자들이 옛 영화관을 철거할 것이다.","syn":"knock down","level":"skills","day":31},{"word":"process","meaning":"과정","pos":"명사","example":"The diagram shows the process of making paper.","exampleKo":"그 도해는 종이를 만드는 과정을 보여 준다.","syn":"procedure","level":"skills","day":31},{"word":"stage","meaning":"단계","pos":"명사","example":"The first stage takes about an hour.","exampleKo":"첫 단계는 약 한 시간 걸린다.","syn":"step/phase","level":"skills","day":31},{"word":"step","meaning":"단계","pos":"명사","example":"The final step is cooling the mixture.","exampleKo":"마지막 단계는 혼합물을 식히는 것이다.","syn":"stage","level":"skills","day":31},{"word":"initially","meaning":"처음에는","pos":"부사","example":"Initially, the land was used for farming.","exampleKo":"처음에는 그 땅이 농업에 쓰였다.","syn":"at first","level":"skills","day":31},{"word":"subsequently","meaning":"그 후에","pos":"부사","example":"Subsequently, a road was built through the field.","exampleKo":"그 후에 그 밭을 가로질러 도로가 지어졌다.","syn":"later/afterwards","level":"skills","day":31},{"word":"convert","meaning":"전환하다, 개조하다","pos":"동사","example":"They convert the warehouse into flats.","exampleKo":"그들은 그 창고를 아파트로 개조한다.","syn":"transform","level":"skills","day":31},{"word":"install","meaning":"설치하다","pos":"동사","example":"Workers install new lights along the path.","exampleKo":"노동자들이 길을 따라 새 조명을 설치한다.","syn":"fit/set up","level":"skills","day":31},{"word":"northern","meaning":"북쪽의","pos":"형용사","example":"A new bridge connects the northern area.","exampleKo":"새 다리가 북쪽 지역을 연결한다.","syn":"north","level":"skills","day":31},{"word":"centre","meaning":"중심","pos":"명사","example":"The shops are in the centre of the town.","exampleKo":"상점들은 마을 중심에 있다.","syn":"middle/core","level":"skills","day":31},{"word":"boundary","meaning":"경계","pos":"명사","example":"A fence marks the boundary of the park.","exampleKo":"울타리가 공원의 경계를 표시한다.","syn":"border/edge","level":"skills","day":31},{"word":"opinion","meaning":"의견","pos":"명사","example":"In my opinion, the benefits are greater.","exampleKo":"내 의견으로는 이익이 더 크다.","syn":"view/belief","level":"skills","day":32},{"word":"argue","meaning":"주장하다","pos":"동사","example":"Some people argue that fees should be free.","exampleKo":"어떤 사람들은 수업료가 무료여야 한다고 주장한다.","syn":"claim/maintain","level":"skills","day":32},{"word":"viewpoint","meaning":"관점","pos":"명사","example":"Try to see the issue from another viewpoint.","exampleKo":"그 문제를 다른 관점에서 보려고 해라.","syn":"perspective/standpoint","level":"skills","day":32},{"word":"stance","meaning":"입장","pos":"명사","example":"The essay states a clear stance in the first line.","exampleKo":"그 글은 첫 줄에서 분명한 입장을 밝힌다.","syn":"position","level":"skills","day":32},{"word":"agree","meaning":"동의하다","pos":"동사","example":"I agree with the second view for two reasons.","exampleKo":"나는 두 가지 이유로 두 번째 견해에 동의한다.","syn":"concur","level":"skills","day":32},{"word":"disagree","meaning":"동의하지 않다","pos":"동사","example":"Others disagree with this conclusion.","exampleKo":"다른 사람들은 이 결론에 동의하지 않는다.","syn":"differ/object","level":"skills","day":32},{"word":"conviction","meaning":"확신, 신념","pos":"명사","example":"She writes with real conviction.","exampleKo":"그녀는 진정한 확신을 갖고 쓴다.","syn":"belief/certainty","level":"skills","day":32},{"word":"justify","meaning":"정당화하다","pos":"동사","example":"It is hard to justify such high costs.","exampleKo":"그렇게 높은 비용을 정당화하기는 어렵다.","syn":"defend/explain","level":"skills","day":32},{"word":"back","meaning":"뒷받침하다","pos":"동사","example":"The new figures back the main claim.","exampleKo":"새 수치가 주요 주장을 뒷받침한다.","syn":"support/confirm","level":"skills","day":32},{"word":"oppose","meaning":"반대하다","pos":"동사","example":"Many residents oppose the new road.","exampleKo":"많은 주민이 새 도로를 반대한다.","syn":"object to/resist","level":"skills","day":32},{"word":"debate","meaning":"논쟁","pos":"명사","example":"The debate about testing continues.","exampleKo":"시험에 관한 논쟁이 계속되고 있다.","syn":"discussion/argument","level":"skills","day":32},{"word":"controversial","meaning":"논란이 많은","pos":"형용사","example":"Uniforms remain a controversial topic.","exampleKo":"교복은 여전히 논란이 많은 주제이다.","syn":"disputed/contentious","level":"skills","day":32},{"word":"assert","meaning":"단언하다, 주장하다","pos":"동사","example":"The writer assert that sport builds character.","exampleKo":"그 글쓴이는 스포츠가 인격을 기른다고 단언한다.","syn":"claim/declare","level":"skills","day":32},{"word":"defend","meaning":"옹호하다","pos":"동사","example":"He defend the policy in three paragraphs.","exampleKo":"그는 세 문단에 걸쳐 그 정책을 옹호한다.","syn":"support/uphold","level":"skills","day":32},{"word":"contend","meaning":"주장하다","pos":"동사","example":"Some economists contend that the tax helps families.","exampleKo":"일부 경제학자는 그 세금이 가정에 도움이 된다고 주장한다.","syn":"argue/maintain","level":"skills","day":32},{"word":"conclusion","meaning":"결론","pos":"명사","example":"The conclusion restates the writer's position.","exampleKo":"그 결론은 글쓴이의 입장을 다시 말한다.","syn":"summary","level":"skills","day":32},{"word":"discuss","meaning":"논의하다","pos":"동사","example":"The essay discuss both sides of the issue.","exampleKo":"그 글은 그 문제의 양측을 논의한다.","syn":"consider/examine","level":"skills","day":33},{"word":"view","meaning":"견해","pos":"명사","example":"The second view is more convincing to me.","exampleKo":"두 번째 견해가 내게는 더 설득력 있다.","syn":"opinion/position","level":"skills","day":33},{"word":"side","meaning":"측, 편","pos":"명사","example":"Each side has a fair point.","exampleKo":"각 측에는 타당한 지적이 있다.","syn":"party/position","level":"skills","day":33},{"word":"consider","meaning":"고려하다","pos":"동사","example":"We should consider the cost to families.","exampleKo":"우리는 가정이 치를 비용을 고려해야 한다.","syn":"weigh/examine","level":"skills","day":33},{"word":"acknowledge","meaning":"인정하다","pos":"동사","example":"The writer acknowledge the weakness of this view.","exampleKo":"그 글쓴이는 이 견해의 약점을 인정한다.","syn":"admit/recognise","level":"skills","day":33},{"word":"alternative","meaning":"대안","pos":"명사","example":"There is a cheaper alternative.","exampleKo":"더 저렴한 대안이 있다.","syn":"option/substitute","level":"skills","day":33},{"word":"counter","meaning":"반박하다","pos":"동사","example":"Critics counter that the evidence is thin.","exampleKo":"비평가들은 근거가 빈약하다고 반박한다.","syn":"rebut/answer","level":"skills","day":33},{"word":"rebut","meaning":"반론하다","pos":"동사","example":"The author rebut the argument in one sentence.","exampleKo":"그 저자는 한 문장으로 그 주장에 반론한다.","syn":"refute/counter","level":"skills","day":33},{"word":"address","meaning":"다루다","pos":"동사","example":"The essay address the issue of fairness.","exampleKo":"그 글은 공정성의 문제를 다룬다.","syn":"tackle/cover","level":"skills","day":33},{"word":"examine","meaning":"검토하다","pos":"동사","example":"This section examine two possible causes.","exampleKo":"이 부분은 두 가지 가능한 원인을 검토한다.","syn":"inspect/explore","level":"skills","day":33},{"word":"weigh","meaning":"저울질하다","pos":"동사","example":"We must weigh the benefits against the risks.","exampleKo":"우리는 이익과 위험을 저울질해야 한다.","syn":"balance/assess","level":"skills","day":33},{"word":"perspective","meaning":"관점","pos":"명사","example":"A historical perspective helps here.","exampleKo":"여기서는 역사적 관점이 도움이 된다.","syn":"viewpoint","level":"skills","day":33},{"word":"advocate","meaning":"주장하다, 옹호하다","pos":"동사","example":"Some parents advocate shorter school holidays.","exampleKo":"일부 부모는 더 짧은 방학을 옹호한다.","syn":"champion/support","level":"skills","day":33},{"word":"opponent","meaning":"반대자","pos":"명사","example":"Opponents of the plan raise traffic fears.","exampleKo":"그 계획에 반대하는 사람들은 교통 우려를 제기한다.","syn":"critic/objector","level":"skills","day":33},{"word":"compromise","meaning":"타협","pos":"명사","example":"A compromise could satisfy both groups.","exampleKo":"타협이 두 집단 모두를 만족시킬 수 있다.","syn":"middle ground","level":"skills","day":33},{"word":"consensus","meaning":"합의","pos":"명사","example":"There is no consensus among researchers.","exampleKo":"연구자들 사이에 합의가 없다.","syn":"agreement","level":"skills","day":33},{"word":"problem","meaning":"문제","pos":"명사","example":"Traffic is the main problem in this area.","exampleKo":"교통이 이 지역의 주요 문제이다.","syn":"issue/difficulty","level":"skills","day":34},{"word":"issue","meaning":"문제, 쟁점","pos":"명사","example":"Housing is a social issue in many cities.","exampleKo":"주거는 많은 도시에서 사회적 쟁점이다.","syn":"problem/matter","level":"skills","day":34},{"word":"solution","meaning":"해결책","pos":"명사","example":"A simple solution is to raise the fare.","exampleKo":"간단한 해결책은 요금을 올리는 것이다.","syn":"answer/remedy","level":"skills","day":34},{"word":"solve","meaning":"해결하다","pos":"동사","example":"Better buses may solve the rush-hour problem.","exampleKo":"더 나은 버스가 출퇴근 시간 문제를 해결할 수 있다.","syn":"resolve/fix","level":"skills","day":34},{"word":"tackle","meaning":"다루다, 해결하다","pos":"동사","example":"Governments must tackle youth unemployment.","exampleKo":"정부는 청년 실업을 해결해야 한다.","syn":"address/combat","level":"skills","day":34},{"word":"measure","meaning":"조치","pos":"명사","example":"The city took three measure to cut waste.","exampleKo":"그 도시는 폐기물을 줄이기 위해 세 가지 조치를 취했다.","syn":"step/action","level":"skills","day":34},{"word":"remedy","meaning":"해결책, 구제책","pos":"명사","example":"There is no quick remedy for this shortage.","exampleKo":"이 부족에 대한 빠른 해결책은 없다.","syn":"fix/solution","level":"skills","day":34},{"word":"prevent","meaning":"막다","pos":"동사","example":"Early checks can prevent serious illness.","exampleKo":"조기 검사는 심각한 병을 막을 수 있다.","syn":"stop/avoid","level":"skills","day":34},{"word":"reduce","meaning":"줄이다","pos":"동사","example":"Charging for bags reduce plastic waste.","exampleKo":"봉투에 요금을 매기면 플라스틱 폐기물이 줄어든다.","syn":"cut/lower","level":"skills","day":34},{"word":"mitigate","meaning":"완화하다","pos":"동사","example":"Trees help mitigate the heat in cities.","exampleKo":"나무는 도시의 더위를 완화하는 데 도움이 된다.","syn":"ease/reduce","level":"skills","day":34},{"word":"implement","meaning":"시행하다","pos":"동사","example":"Schools implement the new rules in March.","exampleKo":"학교들은 3월에 새 규칙을 시행한다.","syn":"apply/carry out","level":"skills","day":34},{"word":"propose","meaning":"제안하다","pos":"동사","example":"I propose a free bus for students.","exampleKo":"나는 학생 무료 버스를 제안한다.","syn":"suggest/recommend","level":"skills","day":34},{"word":"feasible","meaning":"실현 가능한","pos":"형용사","example":"A later start is feasible for most schools.","exampleKo":"더 늦은 시작은 대부분 학교에서 실현 가능하다.","syn":"workable/possible","level":"skills","day":34},{"word":"urgent","meaning":"긴급한","pos":"형용사","example":"The need for clean water is urgent.","exampleKo":"깨끗한 물에 대한 필요는 긴급하다.","syn":"pressing/immediate","level":"skills","day":34},{"word":"priority","meaning":"우선순위","pos":"명사","example":"Safety should be the first priority.","exampleKo":"안전이 첫 번째 우선순위여야 한다.","syn":"precedence","level":"skills","day":34},{"word":"overcome","meaning":"극복하다","pos":"동사","example":"Training helps workers overcome language barriers.","exampleKo":"훈련은 근로자가 언어 장벽을 극복하도록 돕는다.","syn":"surmount/beat","level":"skills","day":34},{"word":"advantage","meaning":"장점","pos":"명사","example":"The main advantage is flexibility.","exampleKo":"주된 장점은 유연성이다.","syn":"benefit/plus","level":"skills","day":35},{"word":"disadvantage","meaning":"단점","pos":"명사","example":"A clear disadvantage is the cost.","exampleKo":"분명한 단점은 비용이다.","syn":"drawback/minus","level":"skills","day":35},{"word":"benefit","meaning":"이익, 혜택","pos":"명사","example":"The benefits last long after the course.","exampleKo":"그 혜택은 과정이 끝난 뒤에도 오래간다.","syn":"advantage/gain","level":"skills","day":35},{"word":"drawback","meaning":"결점","pos":"명사","example":"The biggest drawback is the distance.","exampleKo":"가장 큰 결점은 거리이다.","syn":"disadvantage/flaw","level":"skills","day":35},{"word":"merit","meaning":"가치, 장점","pos":"명사","example":"The plan has real merit.","exampleKo":"그 계획에는 실제 가치가 있다.","syn":"strength/virtue","level":"skills","day":35},{"word":"demerit","meaning":"단점","pos":"명사","example":"One demerit is the lack of parking.","exampleKo":"한 가지 단점은 주차 공간 부족이다.","syn":"disadvantage","level":"skills","day":35},{"word":"outweigh","meaning":"능가하다","pos":"동사","example":"The gains outweigh the losses here.","exampleKo":"여기서는 이익이 손실을 능가한다.","syn":"exceed/surpass","level":"skills","day":35},{"word":"positive","meaning":"긍정적인","pos":"형용사","example":"The change had a positive effect on attendance.","exampleKo":"그 변화는 출석에 긍정적인 영향을 주었다.","syn":"favourable","level":"skills","day":35},{"word":"negative","meaning":"부정적인","pos":"형용사","example":"Noise has a negative impact on health.","exampleKo":"소음은 건강에 부정적인 영향을 준다.","syn":"harmful","level":"skills","day":35},{"word":"valuable","meaning":"가치 있는","pos":"형용사","example":"Work experience is valuable for students.","exampleKo":"직무 경험은 학생들에게 가치 있다.","syn":"useful/precious","level":"skills","day":35},{"word":"harmful","meaning":"해로운","pos":"형용사","example":"Too much screen time is harmful for children.","exampleKo":"너무 많은 화면 시간은 아이들에게 해롭다.","syn":"damaging","level":"skills","day":35},{"word":"trade-off","meaning":"맞바꿈, 상충 관계","pos":"명사","example":"There is a trade-off between price and quality.","exampleKo":"가격과 품질 사이에는 상충 관계가 있다.","syn":"compromise","level":"skills","day":35},{"word":"favourable","meaning":"호의적인, 유리한","pos":"형용사","example":"The weather was favourable for the harvest.","exampleKo":"날씨가 수확에 유리했다.","syn":"positive/advantageous","level":"skills","day":35},{"word":"risk","meaning":"위험","pos":"명사","example":"The risk of failure is small.","exampleKo":"실패의 위험은 작다.","syn":"danger/hazard","level":"skills","day":35},{"word":"gain","meaning":"이득","pos":"명사","example":"The financial gain was modest.","exampleKo":"재정적 이득은 크지 않았다.","syn":"profit/benefit","level":"skills","day":35},{"word":"cost","meaning":"비용, 대가","pos":"명사","example":"The cost to the environment is high.","exampleKo":"환경에 대한 대가는 크다.","syn":"price/expense","level":"skills","day":35},{"word":"however","meaning":"그러나","pos":"부사","example":"The plan is popular; however, it is costly.","exampleKo":"그 계획은 인기가 있다; 그러나 비용이 많이 든다.","syn":"nevertheless","level":"skills","day":36},{"word":"moreover","meaning":"게다가","pos":"부사","example":"Moreover, the service is free.","exampleKo":"게다가 그 서비스는 무료이다.","syn":"furthermore/besides","level":"skills","day":36},{"word":"furthermore","meaning":"더욱이","pos":"부사","example":"Furthermore, the results were repeated.","exampleKo":"더욱이 그 결과는 반복되었다.","syn":"moreover","level":"skills","day":36},{"word":"nevertheless","meaning":"그럼에도 불구하고","pos":"부사","example":"The data are limited; nevertheless, a trend is visible.","exampleKo":"데이터는 제한적이다; 그럼에도 불구하고 추세는 보인다.","syn":"nonetheless","level":"skills","day":36},{"word":"consequently","meaning":"결과적으로","pos":"부사","example":"Prices rose, and consequently demand fell.","exampleKo":"가격이 올랐고, 결과적으로 수요가 줄었다.","syn":"as a result","level":"skills","day":36},{"word":"thus","meaning":"따라서","pos":"부사","example":"The sample was small; thus, the result is uncertain.","exampleKo":"표본이 작았다; 따라서 결과는 불확실하다.","syn":"therefore","level":"skills","day":36},{"word":"similarly","meaning":"마찬가지로","pos":"부사","example":"Similarly, rural areas face a shortage of doctors.","exampleKo":"마찬가지로 농촌 지역 ntially","meaning":"상당히","pos":"부사","example":"Costs fell substantially last year.","exampleKo":"작년에 비용이 상당히 줄었다.","syn":"considerably","level":"band","day":50},{"word":"marginally","meaning":"약간","pos":"부사","example":"Output rose marginally in March.","exampleKo":"3월에 생산량이 약간 올랐다.","syn":"slightly","level":"band","day":50},{"word":"predominantly","meaning":"주로","pos":"부사","example":"The area is predominantly farmland.","exampleKo":"그 지역은 주로 농지이다.","syn":"mainly","level":"band","day":50},{"word":"invariably","meaning":"항상, 예외 없이","pos":"부사","example":"Such delays invariably cost more.","exampleKo":"그런 지연은 항상 비용이 더 든다.","syn":"always","level":"band","day":50},{"word":"consistently","meaning":"일관되게","pos":"부사","example":"She consistently scores above average.","exampleKo":"그녀는 일관되게 평균 이상의 점수를 받는다.","syn":"steadily","level":"band","day":50},{"word":"exceedingly","meaning":"극히","pos":"부사","example":"The task was exceedingly difficult.","exampleKo":"그 과제는 극히 어려웠다.","syn":"extremely","level":"band","day":50},{"word":"strikingly","meaning":"눈에 띄게","pos":"부사","example":"The two maps are strikingly different.","exampleKo":"두 지도는 눈에 띄게 다르다.","syn":"remarkably","level":"band","day":50},{"word":"modestly","meaning":"완만하게, 겸손하게","pos":"부사","example":"Prices rose modestly this quarter.","exampleKo":"이번 분기 가격은 완만하게 올랐다.","syn":"slightly","level":"band","day":50},{"word":"narrowly","meaning":"간신히, 좁게","pos":"부사","example":"He narrowly passed the speaking test.","exampleKo":"그는 말하기 시험에 간신히 합격했다.","syn":"barely","level":"band","day":50},{"word":"readily","meaning":"쉽게, 선뜻","pos":"부사","example":"Information is readily available online.","exampleKo":"정보는 온라인에서 쉽게 구할 수 있다.","syn":"easily","level":"band","day":50},{"word":"scarcely","meaning":"거의 ~않다","pos":"부사","example":"There is scarcely any space left.","exampleKo":"남은 공간이 거의 없다.","syn":"hardly","level":"band","day":50},{"word":"ultimately","meaning":"궁극적으로","pos":"부사","example":"Ultimately, the choice belongs to parents.","exampleKo":"궁극적으로 선택은 부모의 몫이다.","syn":"in the end","level":"band","day":50},{"word":"conversely","meaning":"반대로","pos":"부사","example":"Conversely, rural schools have smaller classes.","exampleKo":"반대로 농촌 학교는 학급이 더 작다.","syn":"on the other hand","level":"band","day":50},{"word":"accordingly","meaning":"그에 따라","pos":"부사","example":"Prices changed, and costs were adjusted accordingly.","exampleKo":"가격이 변했고 비용도 그에 따라 조정되었다.","syn":"correspondingly","level":"band","day":50},{"word":"namely","meaning":"즉","pos":"부사","example":"Two groups benefit, namely students and parents.","exampleKo":"두 집단, 즉 학생과 학부모가 혜택을 본다.","syn":"specifically","level":"band","day":50},{"word":"commence","meaning":"시작하다","pos":"동사","example":"The ceremony will commence at ten.","exampleKo":"그 행사는 10시에 시작할 것이다.","syn":"begin/start","level":"band","day":51},{"word":"terminate","meaning":"종료하다, 끝내다","pos":"동사","example":"The company may terminate the contract early.","exampleKo":"그 회사는 계약을 조기 종료할 수 있다.","syn":"end/stop","level":"band","day":51},{"word":"endeavour","meaning":"노력하다","pos":"동사","example":"We endeavour to reply within two days.","exampleKo":"우리는 이틀 안에 답하려고 노력한다.","syn":"try/strive","level":"band","day":51},{"word":"sufficient","meaning":"충분한","pos":"형용사","example":"Sufficient sleep improves memory.","exampleKo":"충분한 수면은 기억력을 높인다.","syn":"enough/adequate","level":"band","day":51},{"word":"numerous","meaning":"수많은","pos":"형용사","example":"Numerous studies support this view.","exampleKo":"수많은 연구가 이 견해를 뒷받침한다.","syn":"many","level":"band","day":51},{"word":"prior","meaning":"사전의, 이전의","pos":"형용사","example":"Prior experience is not required.","exampleKo":"사전 경험은 필요하지 않다.","syn":"previous/earlier","level":"band","day":51},{"word":"subsequent","meaning":"그 이후의","pos":"형용사","example":"Subsequent tests gave the same result.","exampleKo":"그 이후의 검사도 같은 결과를 냈다.","syn":"following/later","level":"band","day":51},{"word":"albeit","meaning":"비록 ~이지만","pos":"접속사","example":"The plan is workable, albeit expensive.", ption of the police has changed.","exampleKo":"경찰에 대한 대중의 인식이 바뀌었다.","syn":"view/impression","level":"band","day":52},{"word":"assumption","meaning":"가정, 추정","pos":"명사","example":"The study rests on a simple assumption.","exampleKo":"그 연구는 단순한 가정에 기대고 있다.","syn":"premise","level":"band","day":52},{"word":"assertion","meaning":"단언, 주장","pos":"명사","example":"The assertion needs more evidence.","exampleKo":"그 주장에는 더 많은 근거가 필요하다.","syn":"claim","level":"band","day":52},{"word":"objection","meaning":"반대, 이의","pos":"명사","example":"Residents raised an objection to the plan.","exampleKo":"주민들이 그 계획에 반대를 제기했다.","syn":"complaint/protest","level":"band","day":52},{"word":"justification","meaning":"정당화, 근거","pos":"명사","example":"There is no justification for the delay.","exampleKo":"그 지연에 대한 근거는 없다.","syn":"reason","level":"band","day":52},{"word":"obligation","meaning":"의무","pos":"명사","example":"Employers have an obligation to train staff.","exampleKo":"고용주는 직원을 훈련할 의무가 있다.","syn":"duty","level":"band","day":52},{"word":"entitlement","meaning":"권리, 자격","pos":"명사","example":"The entitlement applies to all residents.","exampleKo":"그 권리는 모든 주민에게 적용된다.","syn":"right","level":"band","day":52},{"word":"intervention","meaning":"개입, 중재","pos":"명사","example":"Early intervention improves outcomes.","exampleKo":"조기 개입은 결과를 개선한다.","syn":"involvement","level":"band","day":52},{"word":"initiative","meaning":"주도권, 계획","pos":"명사","example":"The recycling initiative began last spring.","exampleKo":"그 재활용 계획은 지난봄 시작되었다.","syn":"scheme/drive","level":"band","day":52},{"word":"incentive","meaning":"유인, 장려책","pos":"명사","example":"A tax cut is a strong incentive to invest.","exampleKo":"세금 감면은 투자에 강한 유인이다.","syn":"motivation","level":"band","day":52},{"word":"deterrent","meaning":"억제책","pos":"명사","example":"Higher fines act as a deterrent.","exampleKo":"높은 벌금은 억제책 역할을 한다.","syn":"disincentive","level":"band","day":52},{"word":"constraint","meaning":"제약","pos":"명사","example":"Time is the main constr var pickMode = null; /* {type:'item'|'pet', id:...} 인벤토리에서 꺼낸 것 */
function placedList() {
  var out = [];
  for (var k in S.placed) out.push({ key: k, val: S.placed[k] });
  return out;
}
/* 마을에 실제로 놓인 이 물건의 개수 — 창고 수량은 오직 이 값으로만 계산한다 */
function placedItemCount(id) {
  return placedList().filter(function (p) { return p.val.type === 'item' && p.val.id === id; }).length;
}
/* 받침에 맞춰 목적격 조사를 붙인다 (분수대를 / 나무를) */
function objJosa(word) {
  var s = String(word || '');
  if (!s) return '을(를)';
  var c = s.charCodeAt(s.length - 1);
  if (c < 0xac00 || c > 0xd7a3) return '을(를)';
  return ((c - 0xac00) % 28) ? '을' : '를';
}
/* 주격 조사 (지우가 / 은진이) */
function subJosa(word) {
  var s2 = String(word || '');
  if (!s2) return '이(가)';
  var c = s2.charCodeAt(s2.length - 1);
  if (c < 0xac00 || c > 0xd7a3) return '이(가)';
  return ((c - 0xac00) % 28) ? '이' : '가';
}
function pickedName() {
  if (!pickMode) return '';
  if (pickMode.type === 'pet') {
    var pt = S.pets.filter(function (q) { return q.uid === pickMode.uid; })[0];
    return pt && PET_BY_SP[pt.sp] ? PET_BY_SP[pt.sp].name : '친구';
  }
  var it = COMBO_BY_ID[pickMode.id];
  return it ? it.art + ' ' + it.name : '물건';
}

    '<button class="pill" id="btnName">' + (S.onboarded ? '✏️ 이름 바꾸기' : '👶 시작하기') + '</button>' +

function storageCount() {
  var n = 0;
  for (var id in S.combos) {

    var left = made - placedItemCount(id);
    if (left > 0) n += left;
  }
  return n;
}
function onThingTap(key) {

    return;
  }

  if (!p) return;
  if (p.type === 'pet') {
    var pt = S.pets.filter(function (q) { return q.uid === p.uid; })[0];
    if (pt) toast(PET_BY_SP[pt.sp].name + '이(가) 반가워요! (' + pt.hugs + '번 안아 줬어요)');

    modal('<h3>' + COMBO_BY_ID[p.id].art + ' ' + esc(COMBO_BY_ID[p.id].name) + '</h3><p>창고로 넣어 둘까요?</p>' +

function placePick(x, yBottom) {
  if (!pickMode) return;

    S.placed[key] = { type: 'pet', uid: pickMode.uid, x: x, y: 100 - yBottom };

  }

}

/* ================= 상자 열기 ================= */
function rollPet() {
  var chance = 0.32;
  if (Math.random() > chance) return null;
  var owned = {};
  S.pets.forEach(function (p) { if (!p.evo) owned[p.sp] = (owned[p.sp] || 0) + 1; });
  var pool = PETS.filter(function (p) { return (owned[p.sp] || 0) < 2; });
  if (!pool.length) return null;
  return pool[Math.floor(Math.random() * pool.length)].sp;
}
function grantMats(n) {
  var got = {};
  for (var i = 0; i < n; i++) {
    var m = MATS[Math.floor(Math.random() * MATS.length)].id;
    S.mats[m] = (S.mats[m] || 0) + 1;
    got[m] = (got[m] || 0) + 1;
  }
  return got;
}
function openBox() {
  if (S.boxes < 1) return;
  S.boxes--;
  var petSp = rollPet();
  var mats = grantMats(2 + Math.floor(Math.random() * 2));
  save(); updateCoins(); beep('box');
  var matTxt = Object.keys(mats).map(function (k) { return MAT_BY_ID[k].art + ' ' + MAT_BY_ID[k].name + '×' + mats[k]; }).join(', ');
  var html;
  if (petSp) {
    var uid = 'p' + Date.now();
    S.pets.push({ uid: uid, sp: petSp, evo: false, hugs: 0 });
    save();
    confetti(); beep('combo');
    html = '<div class="m-art" style="width:110px;height:110px;margin:6px auto">' + petSVG(petSp) + '</div>' +
      '<h3>' + esc(PET_BY_SP[petSp].name) + ' 탄생!</h3><p>새 친구가 마을에 왔어요!<br>+' + esc(matTxt) + '</p>';
  } else {
    html = '<div class="m-art" style="font-size:56px">📦</div><h3>재료를 찾았어요!</h3><p>+' + esc(matTxt) + '</p>' +

function pickPool(kind) {
  var pool;
  if (kind === 'wrong') {
    pool = shuffle(wrongWords()).slice(0, 8);
  } else if (quizSel.scope === 'day') {
    pool = shuffle((BY_DAY[quizSel.day] || []).slice());
  } else if (quizSel.scope === 'lvl') {
    pool = shuffle(BY_LVL[quizSel.lvl].slice());
  } else {
    pool = shuffle(W.slice());
  }
  if (!pool.length) return [];
  if (kind === 'wrong') return pool;
  /* 우선순위: 안 본 것(0) > 오답(1) > 덜 익힌 것(2) > 익숙한 것(3) */
  var wgt = function (w) {
    var r = S.words[w.en];
    if (!r || !r.seen) return 0;
    if (r.wrong > 0 && r.level < 3) return 1;
    if (r.level === 0) return 1;
    if (r.level < 3) return 2;
    return 3;
  };
  pool.sort(function (a, b) { return wgt(a) - wgt(b); });
  var out = [];
  var buckets = [[], [], [], []];
  pool.forEach(function (w) { buckets[wgt(w)].push(w); });
  buckets.forEach(function (b) { shuffle(b); });
  var i = 0;
  while (out.length < 8 && buckets.some(function (b) { return b.length; })) {
    var b2 = buckets[i % 3];
    if (b2.length) out.push(b2.pop());
    i++;
    if (i > 60) break;
  }
  return out.slice(0, 8);
}

function makeDistractors(w, field) {
  var sameDay = BY_DAY[w.day].filter(function (x) { return x.en !== w.en; });
  var sameLvl = BY_LVL[w.level].filter(function (x) { return x.en !== w.en && !sameDay.some(function (y) { return y.en === x.en; }); });
  var pool = shuffle(sameDay).concat(shuffle(sameLvl));
  var out = [], used = {};
  used[field === 'en' ? w.ko : w.en] = 1;
  for (var i = 0; i < pool.length && out.length < 3; i++) {
    var k = field === 'en' ? pool[i].ko : pool[i].en;
    if (used[k]) continue;
    used[k] = 1; out.push(pool[i]);
  }
  while (out.length < 3) { var c = W[(Math.random() * W.length) | 0]; var k2 = field === 'en' ? c.ko : c.en; if (!used[k2]) { used[k2] = 1; out.push(c); } }
  return out;
}

function startSession(kind) {
  var pool = pickPool(kind);
  if (!pool.length) { toast('풀 수 있는 단어가 없어요. 공부 탭에서 단어를 먼저 봐요!'); go('learn'); return; }
  session = { kind: kind || 'normal', words: pool, qi: 0, correct: 0, wrongNow: [], type: kind === 'wrong' ? 'mix' : quizSel.type };
  renderQuestion();
  go('quiz');
}
function buildQuestion(w, no) {
  var types = ['choose', 'spell', 'blank'];
  var t = session.type === 'mix' ? types[no % 3] : session.type;
  /* 예문에 그 단어가 없으면 빈칸 문제를 낼 수 없다 → 단어 고르기로 대체 */
  if (t === 'blank' && !w.blankHit) t = 'choose';
  if (t === 'spell' && !/[a-z]/i.test(w.en)) t = 'choose';
  var r = rec(w.en);
  r.seen = true; r.last = Date.now();
  var q = { w: w, t: t, answered: false };
  if (t === 'choose') {
    q.title = '뜻에 맞는 <span style="color:#E8641E">영단어</span>는?';
    q.opts = shuffle([w].concat(makeDistractors(w, 'ko')));
    q.answer = w.en;
  } else if (t === 'spell') {
    q.title = '스펠링을 <span style="color:#E8641E">순서대로</span> 눌러요';
    q.letters = shuffle(w.en.replace(/[^a-z]/gi, '').split(''));
  } else {
    q.title = '<span style="color:#E8641E">빈칸</span>에 알맞은 단어는?';
    q.opts = shuffle([w].concat(makeDistractors(w, 'en')));
    q.answer = w.en;
  }
  return q;
}

function normWord(s) { return String(s || '').toLowerCase().replace(/[^a-z]/g, ''); }
function onAnswer(ok, msg) {
  var w = session.q.w, r = rec(w.en);
  if (ok) {

  } else {
    r.wrong++; session.wrongNow.push(w.en); beep('no');
    toast('오답노트로 이동: ' + msg || '');
  }
  r.level = wLevel(r);
  save(); updateCoins();
  setTimeout(function () {
    session.qi++;
    if (session.qi >= session.words.length) sessionDone();
    else renderQuestion();
  }, ok ? 650 : 1400);
}
function sessionDone() {

  var bonusStars = isWrongSession ? 0 : perfect ? 6 : c >= n * 0.7 ? 3 : 1;
  var boxGain = isWrongSession ? 0 : perfect ? 2 : 1;
  S.stars += bonusStars; S.boxes += boxGain;
  var t = todayObj();

    session.words.forEach(function (w) {

    '<button class="btn w" id="rAgain">한 세션 더!</button>' +
    '<button class="btn w" id="rHome">퀴즈 홈으로</button>' +
    '</div></div></div>';
  $('#scr-quiz').innerHTML = html;
  window.scrollTo(0, 0);
  if (perfect) { confetti(); beep('combo'); }

function villageSnap() {
  var items = [], pets = [];
  for (var k in S.placed) {
    var p = S.placed[k];
    if (!p || !p.type) continue;
    if (p.type === 'item') {
      var it = COMBO_BY_ID[p.id];
      if (it) items.push({ id: p.id, x: p.x, y: p.y, art: it.art, name: it.name });
    } else if (p.type === 'pet') {
      var pt = (S.pets || []).filter(function (q) { return q.uid === p.uid; })[0];
      if (pt && PET_BY_SP[pt.sp]) {
        pets.push({ sp: pt.sp, evo: !!pt.evo, x: p.x, y: p.y, name: (pt.evo ? PET_BY_SP[pt.sp].evoName : PET_BY_SP[pt.sp].name) });
      }
    }
  }
  return { items: items, pets: pets };

function todayWordList() {
  var now = new Date(), out = [];
  Object.keys(S.words || {}).forEach(function (en) {
    var r = S.words[en];
    if (!r || !r.last) return;
    var d = new Date(r.last);
    if (d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate()) {
      var w = BY_EN[en];
      out.push({ en: en, ko: w ? w.ko : '', lv: r.level || 0 });

  });
  out.sort(function (a, b) { return (b.lv || 0) - (a.lv || 0); });
  return out.slice(0, 12);

function cloudPush(force) {
  if (!sb) { console.info('[village] push 보류: 연결 전'); return; }
  /* 빈 기록으로 서버를 덮어쓰지 않는다. 단 '기록 초기화'처럼 일부러 비운 경우(force)는 올린다. */
  if (!hasProgress() && !force) { console.info('[village] push 보류: 기기 기록 없음'); return; }
  S.rev = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  var doc = myDoc();
  return sb.from(SYNC_TABLE).upsert({ id: MY_ROW, doc: doc, updated_at: new Date().toISOString() }, { onConflict: 'id' })
    .then(function (res) {
      if (res && res.error) { console.warn('[village] 저장 실패', res.error); cloud.msg = '저장 실패'; }
      else { cloud.last = Date.now(); cloud.msg = ''; console.info('[village] 저장 완료', MY_ROW); }
    }, function (err) { console.warn('[village] 저장 실패', err); cloud.msg = '저장 실패'; });
}
function adoptDoc(doc) {
