<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFF9E6">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>🌟 단어 마을 · 초등 필수 영단어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --cream:#FFF9E6; --cream2:#FFF3CE; --pinkbg:#FFF0F3; --greenbg:#EEF8E8;
  --paper:#FFFDF6; --ink:#3D312A; --ink2:#8A7A6B; --line:#E8DCC4;
  --yellow:#FFDE6A; --yellow2:#FFC93C;
  --pink:#FFD1DC; --pink2:#FF9EB5;
  --green:#D9F0C8; --green2:#7CC96B;
  --blue:#DCEBFF; --blue2:#7FB3F5;
  --purple:#EBDFFF; --purple2:#B493F2;
  --orange:#FFB25C;
  --bd:2.5px solid var(--ink);
  --shadow:0 4px 0 rgba(61,49,42,.9), 0 10px 24px rgba(61,49,42,.12);
  --shadow-sm:0 3px 0 rgba(61,49,42,.85);
  --r:22px;
}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Noto Sans KR','Noto Sans CJK KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color:var(--ink); background:var(--cream);
  min-height:100vh; -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(61,49,42,.05) 1.2px, transparent 1.2px);background-size:24px 24px}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;font-size:inherit}
h1,h2,h3,h4,p{margin:0}
.hidden{display:none!important}
.en{font-family:'Baloo 2','Noto Sans KR',system-ui,sans-serif}
#app{position:relative;z-index:1;max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}

/* ============ top bar ============ */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  background:rgba(255,249,230,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:var(--bd)}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand-badge{width:38px;height:38px;flex:none;border-radius:13px;display:grid;place-items:center;
  background:var(--yellow);border:var(--bd);box-shadow:var(--shadow-sm)}
.brand h1{font-size:16px;font-weight:900;letter-spacing:-.4px;line-height:1.1;white-space:nowrap}
.brand p{font-size:10.5px;color:var(--ink2);font-weight:700;margin-top:1px;white-space:nowrap}
.coins{display:flex;gap:6px;flex:none}
.coin{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 10px;border-radius:999px;
  background:var(--paper);border:var(--bd);box-shadow:var(--shadow-sm);font-weight:900;font-size:13.5px}
.coin svg{width:15px;height:15px}

/* ============ common ============ */
.wrap{padding:14px 14px 8px}
.card{background:var(--paper);border:var(--bd);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.pill{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 14px;border-radius:999px;
  border:var(--bd);background:var(--paper);box-shadow:var(--shadow-sm);font-weight:900;font-size:13.5px;white-space:nowrap}
.pill:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(61,49,42,.85)}
.pill.y{background:var(--yellow)} .pill.p{background:var(--pink)} .pill.g{background:var(--green)}
.pill.b{background:var(--blue)} .pill.v{background:var(--purple)}
.pill.sm{height:27px;padding:0 10px;font-size:12px;box-shadow:0 2px 0 rgba(61,49,42,.85)}
.pill:disabled{opacity:.45;box-shadow:none;cursor:default}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:10px 20px;
  border-radius:999px;border:var(--bd);box-shadow:var(--shadow-sm);font-weight:900;font-size:16px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(61,49,42,.85)}
.btn.y{background:var(--yellow)} .btn.g{background:var(--green)} .btn.p{background:var(--pink)}
.btn.w{background:var(--paper)}
.btn:disabled{opacity:.4;box-shadow:none}
.sec-head{display:flex;align-items:center;gap:8px;margin:4px 2px 10px}
.sec-num{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:999px;border:var(--bd);
  box-shadow:var(--shadow-sm);font-weight:900;font-size:13px}
.sec-title{font-size:15px;font-weight:900}
.sticker{position:absolute;pointer-events:none;z-index:2}

/* ============ bottom nav ============ */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  background:linear-gradient(rgba(255,249,230,0), rgba(255,249,230,.95) 34%);pointer-events:none}
.nav-in{pointer-events:auto;display:flex;gap:4px;background:var(--paper);border:var(--bd);border-radius:999px;
  box-shadow:var(--shadow);padding:5px}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:58px;padding:7px 6px 6px;
  border-radius:999px;font-size:10.5px;font-weight:900;color:var(--ink2)}
.nav-btn svg{width:21px;height:21px}
.nav-btn.on{background:var(--yellow);color:var(--ink);border:2px solid var(--ink)}
.badge-dot{position:absolute;margin-left:30px;margin-top:-2px;background:var(--pink2);color:#fff;
  border:2px solid var(--ink);border-radius:999px;font-size:10px;font-weight:900;padding:0 5px;min-width:17px;height:17px;
  display:inline-flex;align-items:center;justify-content:center}

/* ============ village ============ */
.village-card{position:relative;overflow:hidden;padding:0}
.village-sky{position:relative;height:380px;overflow:hidden;background:#CBEAAD;
  touch-action:manipulation}
.v-scene{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.village-sky .sun{position:absolute;top:14px;right:16px;width:44px;height:44px;border-radius:50%;
  background:var(--yellow);border:var(--bd);box-shadow:var(--shadow-sm)}
.village-sky .cloud{position:absolute;opacity:.9}
.v-ground{position:absolute;left:0;right:0;bottom:0;height:45%}
.slot{position:absolute;transform:translate(-50%,-100%);display:flex;align-items:flex-end;justify-content:center;
  cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}
.slot .thing{position:relative;display:grid;place-items:center;line-height:0;transition:transform .12s}
.slot .iv{display:grid;place-items:center;line-height:0}
.slot .iv svg{display:block;overflow:visible}
.slot .thing svg{filter:drop-shadow(0 3px 2px rgba(61,49,42,.22))}
.village-sky.theme-night .slot .thing{filter:brightness(.94) saturate(.96)}
.slot.dragging{cursor:grabbing;z-index:99!important}
.slot.dragging .thing{transform:scale(1.06)}
.slot.pick .thing{animation:bob .8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.up-badge{position:absolute;top:-4px;right:-8px;height:17px;padding:0 5px;border-radius:999px;
  background:var(--yellow);border:2px solid var(--ink);font-size:9.5px;font-weight:900;
  display:grid;place-items:center;box-shadow:0 2px 0 rgba(61,49,42,.7)}
.up-badge.inline{position:static;display:inline-grid;height:16px;vertical-align:middle;margin-left:3px;box-shadow:none}
.t2-badge{position:absolute;top:-4px;right:-8px;height:17px;padding:0 5px;border-radius:999px;
  background:var(--purple);border:2px solid var(--ink);font-size:9.5px;font-weight:900;
  display:grid;place-items:center;box-shadow:0 2px 0 rgba(61,49,42,.7)}
.sky-switch{position:absolute;top:10px;left:10px;z-index:40;display:inline-flex;align-items:center;gap:4px;
  height:28px;padding:0 10px;border-radius:999px;border:2px solid var(--ink);background:rgba(255,253,246,.92);
  font-weight:900;font-size:11.5px;box-shadow:0 2px 0 rgba(61,49,42,.75)}
.v-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--ink2);
  font-weight:700;font-size:13.5px;padding:20px;pointer-events:none}
.village-sky.theme-night .v-empty{color:#FFF6D8;text-shadow:0 1px 3px #2B3566}
.v-bar{display:flex;align-items:center;gap:8px;padding:12px 14px;border-top:var(--bd);background:var(--paper);flex-wrap:wrap}
.t2-line{padding:8px 14px 0;font-size:12px;font-weight:800;color:var(--ink2)}
.t2-line.on{color:#4E8C3E}
.v-help{padding:6px 14px 12px;font-size:11.5px;font-weight:700;color:var(--ink2);line-height:1.4}

/* ============ 2단계 · 창고 · 도감 ============ */
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px;border-radius:999px}
.st-tabs{display:flex;gap:6px;margin:10px 0 6px}
.st-tab{flex:1;text-align:center;padding:7px 8px;border-radius:12px;border:2px solid var(--ink);
  background:var(--paper);font-weight:900;font-size:12.5px;box-shadow:0 2px 0 rgba(61,49,42,.8)}
.st-tab.on{background:var(--yellow)}
.st-tab.locked{opacity:.5;box-shadow:none}
.st-sec{margin-top:12px}
.st-head{display:flex;align-items:baseline;gap:6px;font-weight:900;font-size:13px;margin:14px 2px 8px}
.st-head b{color:#E8641E}
.st-head span{margin-left:auto;font-size:11px;font-weight:800;color:var(--ink2)}
.book-item .bi.art{background:#FFFDF6}
.book-item.t2{border-color:#8B6FC9;background:#FBF7FF}
.cchip{display:inline-flex;align-items:center;gap:2px;padding:1px 6px;margin:2px 3px 0 0;border-radius:999px;
  border:1.5px solid var(--ink);background:var(--cream2);font-size:10.5px;font-weight:800}
.cchip.lack{background:var(--pinkbg);border-color:var(--pink2);color:#B2405E}
.enc-prog{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.enc-box{border:2px solid var(--ink);border-radius:14px;background:var(--paper);padding:8px 10px;font-size:12.5px;font-weight:900}
.enc-box.on{background:var(--purple)}
.t2-hero{border:3px solid var(--ink);border-radius:18px;padding:12px 14px;background:var(--cream2);
  box-shadow:var(--shadow-sm)}
.t2-hero.on{background:var(--purple)}
.t2-hero-top{display:flex;align-items:center;gap:9px}
.t2-crown{font-size:26px}
.t2-hero-t{font-size:16px;font-weight:900}
.t2-hero-s{font-size:11.5px;font-weight:800;color:var(--ink2)}
.t2-miss{display:flex;flex-wrap:wrap;gap:6px}
.miss-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:999px;
  border:2px solid var(--ink);background:var(--paper);font-size:11.5px;font-weight:800}
.t2-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.t2-card{border:2.5px solid var(--ink);border-radius:16px;background:var(--paper);padding:9px 8px;text-align:center;
  box-shadow:var(--shadow-sm);display:flex;flex-direction:column;align-items:center;gap:2px}
.t2-card.got{background:#FBF3FF}
.t2-art{position:relative;height:82px;display:grid;place-items:center}
.t2-art .iv{display:grid;place-items:center}
.t2-done{position:absolute;top:0;right:0;width:20px;height:20px;border-radius:50%;background:var(--green2);
  border:2px solid var(--ink);color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center}
.t2-nm{font-size:12px;font-weight:900;line-height:1.25;min-height:30px;display:grid;place-items:center}
.t2-stars{font-size:11.5px;font-weight:900;color:#C77A00}
.t2-need{font-size:10.5px;line-height:1.5}
.t2-btn{min-height:32px;font-size:12.5px;padding:4px 12px;margin-top:4px;width:100%}
.t2-done-txt{font-size:11.5px;font-weight:900;color:#4E8C3E;margin-top:6px}
.upg-row{display:flex;align-items:center;gap:9px;border:2px solid var(--ink);border-radius:14px;background:var(--paper);
  padding:8px 10px;margin-bottom:8px;box-shadow:0 2px 0 rgba(61,49,42,.8)}
.upg-row.got{background:#FBF3FF}
.upg-row .bi{flex:none;display:grid;place-items:center;border:2px solid var(--ink);border-radius:12px;background:#FFFDF6}
.sky-chips{display:flex;gap:8px;flex-wrap:wrap}
.sky-chip{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:12px;border:2px solid var(--ink);
  background:var(--paper);font-weight:900;font-size:12.5px;box-shadow:0 2px 0 rgba(61,49,42,.8)}
.sky-chip.on{background:var(--yellow)}
.sky-chip.locked{opacity:.45;box-shadow:none}
.sky-e{font-size:14px}

/* ============ learn ============ */
.lvl-tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.lvl-tabs::-webkit-scrollbar{display:none}
.lvl-tabs.wrap{flex-wrap:wrap;overflow:visible}
.day-scroll{display:flex;gap:6px;overflow-x:auto;padding:6px 2px;scrollbar-width:none}
.day-scroll::-webkit-scrollbar{display:none}
.day-chip{flex:none;min-width:56px;padding:7px 10px;border-radius:16px;border:2px solid var(--ink);
  background:var(--paper);font-weight:900;font-size:12px;text-align:center;box-shadow:0 2px 0 rgba(61,49,42,.85)}
.day-chip.on{background:var(--yellow)}
.day-chip small{display:block;font-size:10px;color:var(--ink2);font-weight:700}
.wcard{position:relative;text-align:center;padding:22px 18px 18px}
.wcard .pos{display:inline-flex;height:24px;align-items:center;padding:0 10px;border-radius:999px;
  background:var(--pinkbg);border:2px solid var(--ink);font-size:12px;font-weight:900}
.wcard .w-en{font-size:44px;font-weight:800;line-height:1.05;margin:10px 0 2px;display:flex;align-items:center;justify-content:center;gap:10px}
.wcard .w-ko{font-size:19px;font-weight:900;margin-top:4px}
.known-badge{display:inline-block;margin-top:9px;padding:4px 11px;border-radius:999px;background:#fff;
  border:2px solid var(--green2);color:#4E8C3E;font-size:11.5px;font-weight:900;line-height:1.4}
.spk{width:40px;height:40px;border-radius:50%;background:var(--yellow);border:var(--bd);box-shadow:var(--shadow-sm);
  display:inline-grid;place-items:center;flex:none}
.spk:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(61,49,42,.85)}
.spk svg{width:19px;height:19px}
.spk.sm{width:30px;height:30px}.spk.sm svg{width:15px;height:15px}
.exbox{margin-top:14px;background:var(--greenbg);border:2px solid var(--ink);border-radius:16px;padding:12px 14px;text-align:left}
.exbox .ex-en{font-size:16.5px;font-weight:800;line-height:1.45}
.exbox .ex-en b{color:#E8641E}
.exbox .ex-ko{font-size:13px;color:var(--ink2);font-weight:700;margin-top:4px}
.speak-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:9px;border-top:2px dashed rgba(61,49,42,.18)}
.speak-row .btn{flex:none}
.speak-note{font-size:11.5px;font-weight:800;color:var(--ink2);line-height:1.4;flex:1;min-width:120px}
.speak-note.ok{color:#4E8C3E}
.speak-note.miss{color:#B2405E}
.speak-note.warn{color:#A5761C}
.cd-hint{margin-top:9px;font-size:11.5px;font-weight:800;color:#A5761C;background:var(--cream2);
  border:2px dashed #D9B44A;border-radius:12px;padding:6px 10px}
.cd-msg{color:#A5761C}
.cd-sub{font-size:11.5px;font-weight:700;color:var(--ink2);margin-top:4px}
.visit-tabs{display:flex;gap:6px;margin:6px 0 2px}
.card-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}
.w-idx{font-size:12px;font-weight:900;color:var(--ink2)}
.mem-row{display:flex;gap:8px;margin-top:12px}
.mem-row .btn{flex:1;min-height:44px;font-size:14.5px}
.prog{height:12px;border-radius:999px;border:2px solid var(--ink);background:#fff;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--orange));border-radius:999px;transition:width .4s}

/* ============ quiz ============ */
.quiz-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.quiz-q{font-size:20px;font-weight:900;text-align:center;line-height:1.35;margin:6px 0 14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:66px;justify-content:center;
  padding:10px 8px;border-radius:18px;border:var(--bd);background:var(--paper);box-shadow:var(--shadow-sm);
  font-weight:900;font-size:16.5px;text-align:center}
.opt small{font-size:11px;color:var(--ink2);font-weight:700}
.opt.ok{background:var(--green);animation:pop .35s}
.opt.no{background:var(--pink);animation:shake .4s}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:52px;margin:10px 0}
.tile{width:44px;height:48px;border-radius:12px;border:var(--bd);background:var(--paper);box-shadow:var(--shadow-sm);
  font-family:'Baloo 2',sans-serif;font-size:22px;font-weight:800;display:grid;place-items:center}
.tile.ghost{background:var(--cream2);border-style:dashed;box-shadow:none;color:transparent}
.tile.used{opacity:.28;pointer-events:none}
.tile.sm{width:34px;height:38px;font-size:18px}
.answer-line{min-height:54px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;
  background:var(--cream2);border:2px dashed var(--ink);border-radius:14px;padding:6px}
.ans-tile{width:38px;height:42px;border-radius:10px;border:var(--bd);background:var(--yellow);
  font-family:'Baloo 2',sans-serif;font-size:20px;font-weight:800;display:grid;place-items:center}
.quiz-prog{display:flex;gap:4px}
.quiz-prog i{flex:1;height:9px;border-radius:99px;background:#fff;border:2px solid var(--ink)}
.quiz-prog i.done{background:var(--green2)} .quiz-prog i.now{background:var(--yellow)}
.heard-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px}
.res-stars{font-size:34px;letter-spacing:2px;text-align:center;margin:6px 0}
.center{text-align:center}

/* ============ pets / combine ============ */
.pet-row{display:flex;gap:10px;overflow-x:auto;padding:8px 2px 4px;scrollbar-width:none}
.pet-row::-webkit-scrollbar{display:none}
.pet-card{flex:none;width:118px;border:var(--bd);border-radius:18px;background:var(--paper);box-shadow:var(--shadow-sm);
  padding:10px 8px;text-align:center;position:relative}
.pet-card .pv{width:64px;height:64px;margin:0 auto;display:grid;place-items:center}
.pet-card .nm{font-size:12.5px;font-weight:900;margin-top:4px}
.pet-card .sub{font-size:10.5px;color:var(--ink2);font-weight:700}
.pet-card.evo{background:var(--purple)}
.merge-ready{outline:3px solid var(--yellow2);outline-offset:2px;border-radius:18px}
.combine-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mat{display:flex;align-items:center;gap:8px;padding:9px 10px;border:var(--bd);border-radius:16px;background:var(--paper);
  box-shadow:var(--shadow-sm);font-weight:900;font-size:13px;text-align:left}
.mat .mi{width:34px;height:34px;flex:none;border-radius:11px;border:2px solid var(--ink);display:grid;place-items:center;background:var(--cream2)}
.mat .cnt{margin-left:auto;font-size:12px;color:var(--ink2);font-weight:900}
.mat.sel{background:var(--green)}
.combine-zone{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 0;flex-wrap:wrap}
.plus{font-size:22px;font-weight:900}
.book-item{display:flex;align-items:center;gap:10px;border:var(--bd);border-radius:18px;background:var(--paper);
  box-shadow:var(--shadow-sm);padding:10px 12px;margin-bottom:10px}
.book-item .bi{width:46px;height:46px;flex:none;border-radius:14px;border:2px solid var(--ink);background:var(--cream2);
  display:grid;place-items:center}
.book-item .bn{font-weight:900;font-size:14px}
.book-item .bd2{font-size:11.5px;color:var(--ink2);font-weight:700;margin-top:1px}
.book-item .bstar{margin-left:auto;font-size:13px;letter-spacing:1px;white-space:nowrap}
.locked{opacity:.55}

/* ============ report ============ */
.rep-row{margin:12px 0 2px}
.rep-lab{display:flex;justify-content:space-between;font-size:13px;font-weight:900;margin-bottom:5px}
.rep-note{background:var(--greenbg);border:2px solid var(--ink);border-radius:16px;padding:12px 14px;
  font-weight:800;font-size:14px;line-height:1.5;margin:10px 0}
.weak{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border:2px solid var(--ink);
  border-radius:14px;background:var(--paper);margin-bottom:8px;font-weight:800;font-size:14px}
.weak small{display:block;font-size:11.5px;color:var(--ink2);font-weight:700}

/* ============ toast / fx / modal ============ */
#toastHost{position:fixed;left:0;right:0;top:calc(14px + env(safe-area-inset-top));z-index:90;display:flex;justify-content:center;pointer-events:none}
.toast{background:var(--ink);color:#FFF6D8;font-weight:800;font-size:13.5px;border-radius:999px;padding:10px 18px;
  box-shadow:0 8px 20px rgba(0,0,0,.25);animation:toastIn .25s}
@keyframes toastIn{from{transform:translateY(-14px);opacity:0}to{transform:translateY(0);opacity:1}}
.star-float{position:fixed;z-index:95;font-weight:900;font-size:22px;color:#FFB300;pointer-events:none;
  text-shadow:0 2px 0 #fff, 0 0 8px rgba(255,200,0,.6);animation:floatUp 1.1s ease-out forwards}
@keyframes floatUp{from{transform:translateY(0);opacity:1}to{transform:translateY(-70px);opacity:0}}
.confetti{position:fixed;z-index:95;pointer-events:none;animation:conf 1.3s ease-in forwards}
@keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:.2}}
.modal-back{position:fixed;inset:0;z-index:80;background:rgba(61,49,42,.45);display:grid;place-items:center;padding:22px}
.modal{width:100%;max-width:340px;background:var(--paper);border:3px solid var(--ink);border-radius:24px;
  box-shadow:var(--shadow);padding:20px 18px;text-align:center;animation:pop .3s}
.modal .m-art{margin:8px 0}
.modal h3{font-size:19px;font-weight:900}
.modal p{font-size:13.5px;font-weight:700;color:var(--ink2);margin-top:6px;line-height:1.5}
.m-btns{display:flex;gap:8px;justify-content:center;margin-top:16px}
.box-art{width:120px;height:120px;margin:6px auto;animation:boxShake 1s ease-in-out infinite}
@keyframes boxShake{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(-4px)}}

/* ============ v3: IELTS 카드 · 목표 · 마을 방문 ============ */
.day-title{font-size:12.5px;font-weight:900;color:var(--ink2);margin:2px 2px 8px}
.syn-row{margin-top:8px;font-size:12.5px;font-weight:800;color:var(--ink2)}
.syn-row b{display:inline-block;margin-right:5px;padding:2px 8px;border-radius:999px;background:var(--purple);border:2px solid var(--ink);color:var(--ink);font-size:11.5px}
.goal-note{background:var(--yellow);border:2px solid var(--ink);border-radius:16px;padding:11px 14px;font-weight:800;font-size:13.5px;margin:10px 0;line-height:1.45}
.sync-chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;

.sync-chip i{width:8px;height:8px;border-radius:50%;background:var(--ink2);display:inline-block}

.visit-head{display:flex;align-items:center;gap:8px;margin:4px 2px 10px;flex-wrap:wrap}
.visit-head .nm{font-size:16px;font-weight:900}
.village-sky.ro .slot{cursor:default}
.ro-note{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;background:rgba(255,253,246,.92);
  border:2px solid var(--ink);border-radius:999px;padding:3px 12px;font-size:11px;font-weight:900;color:var(--ink2);white-space:nowrap}
.visit-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.vstat{border:2px solid var(--ink);border-radius:16px;background:var(--paper);padding:9px 11px;box-shadow:0 2px 0 rgba(61,49,42,.85)}
.vstat b{display:block;font-size:16px;font-weight:900}
.vstat small{font-size:11px;font-weight:800;color:var(--ink2)}
.wall-item{border:2px solid var(--ink);border-radius:16px;background:var(--paper);padding:9px 12px;margin-bottom:8px}
.wall-item .who{font-size:11.5px;font-weight:900;color:var(--ink2);display:flex;justify-content:space-between;gap:8px}
.wall-item .msg{font-size:13.5px;font-weight:800;margin-top:3px;line-height:1.45}
.wall-item.gift{background:var(--pinkbg)}
.visit-form textarea{width:100%;min-height:64px;border:var(--bd);border-radius:14px;padding:10px 12px;
  font-family:inherit;font-size:14px;font-weight:700;resize:none;background:#fff;color:var(--ink)}
.gift-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.gift-row .btn{flex:1;min-height:44px;font-size:14px;min-width:130px}
.hint{font-size:11.5px;font-weight:800;color:var(--ink2);margin-top:6px;line-height:1.45}
.heart-line{display:flex;align-items:center;gap:6px;margin-top:8px}
.heart-line label{font-size:13px;font-weight:900}

/* ============ 친구 학습 진도 (놀러가기) ============ */
.prog-card{padding:14px 12px}
.prog-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-weight:900;font-size:14px;margin-bottom:10px}
.prog-head .hint{margin:0}
.prog-tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.ptile{border:2px solid var(--ink);border-radius:14px;background:var(--cream2);padding:8px 6px;text-align:center}
.ptile b{display:block;font-size:14px;font-weight:900;line-height:1.2}
.ptile small{font-size:10px;font-weight:800;color:var(--ink2);line-height:1.2}
.day-grid{display:flex;flex-wrap:wrap;gap:3px;margin:2px 0 4px}
.dcell{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--ink);background:#FFFDF6;
  display:grid;place-items:center;font-size:9.5px;font-weight:900;color:var(--ink2)}
.dcell.part{background:var(--yellow);color:var(--ink)}
.dcell.done{background:var(--green2);color:#fff}
.chip-wrap{display:flex;gap:6px;flex-wrap:wrap}
.upg-row .btn.sm{min-height:36px;height:36px;padding:0 14px;font-size:13px;box-shadow:0 2px 0 rgba(61,49,42,.8)}
.upg-row .bn small{font-weight:800}

/* 마을 조작: 끌어서 옮기기 · 톡 눌러 정보 · 놓기 */
function bindMap(sky) {
  if (!sky) return;
  var drag = null, movedAt = 0;
  sky.addEventListener('pointerdown', function (e) {
    var slot = e.target.closest ? e.target.closest('.slot') : null;
    if (pickMode) return;
    if (!slot) return;
    var key = slot.getAttribute('data-key');
    if (!key || !S.placed[key]) return;
    var pl = S.placed[key];
    drag = { key: key, slot: slot, r: sky.getBoundingClientRect(), sx: e.clientX, sy: e.clientY, moved: false,
      id: pl.type === 'item' ? pl.id : null, pet: pl.type === 'pet' };
    try { slot.setPointerCapture(e.pointerId); } catch (err) {}
  });
  sky.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (!drag.moved) {
      if (Math.abs(dx) < 5 && Math.abs(dy) < 5) return;
      drag.moved = true; drag.slot.classList.add('dragging');
    }
    var r = drag.r;
    var pad = xPadFor(drag.id, drag.pet);
    var x = Math.max(pad, Math.min(100 - pad, ((e.clientX - r.left) / r.width) * 100));
    var yb = Math.max(3, Math.min(50, ((r.bottom - e.clientY) / r.height) * 100));
    drag.slot.style.left = x.toFixed(1) + '%';
    drag.slot.style.bottom = yb.toFixed(1) + '%';
    drag.slot.style.transform = 'translate(-50%,-100%)';
    drag.pos = { x: Math.round(x), y: Math.round(100 - yb) };
    if (e.cancelable) e.preventDefault();
  });
  function end() {
    if (!drag) return;
    var d = drag; drag = null;
    if (d.moved) {
      movedAt = Date.now();
      var p = S.placed[d.key];
      if (p && d.pos) { p.x = d.pos.x; p.y = d.pos.y; save(); beep('tap'); }
      renderVillage();
    } else {
      onThingTap(d.key);
    }
  }
  sky.addEventListener('pointerup', end);
  sky.addEventListener('pointercancel', function () { if (drag && drag.moved) { drag = null; renderVillage(); } drag = null; });
  sky.addEventListener('click', function (e) {
    if (Date.now() - movedAt < 300) return;
    if (!pickMode) return;
    var slot = e.target.closest ? e.target.closest('.slot') : null;
    if (slot) return;
    var rect = sky.getBoundingClientRect();
    var x = Math.round(((e.clientX - rect.left) / rect.width) * 100);
    var yBottom = Math.round(((rect.bottom - e.clientY) / rect.height) * 100);
    if (yBottom > 50) yBottom = 50; else if (yBottom < 3) yBottom = 3;
    var pad = xPadFor(pickMode.type === 'item' ? pickMode.id : null, pickMode.type === 'pet');
    if (x < pad) x = Math.round(pad); else if (x > 100 - pad) x = Math.round(100 - pad);
    placePick(x, yBottom);
  });
}
/* 물건 크기만큼 가장자리를 비워 둔다 — 큰 건물이 화면 밖으로 잘리지 않게 */
function xPadFor(id, isPet) {
  var map = $('#vMap') || $('#scr-village .village-sky');
  var w = (map && map.clientWidth) || 360;
  var sz = isPet ? 60 : itemSize(id);
  var pad = ((sz / 2 + 2) / w) * 100;
  return Math.max(7, Math.min(42, pad));
}

function costChips(need) {
  return need.map(function (m) {
    var have = S.mats[m] || 0;
    return '<span class="cchip' + (have < 1 ? ' lack' : '') + '">' + MAT_BY_ID[m].art + MAT_BY_ID[m].name + '</span>';
  }).join('');
}
function needCounts(need) {
  var c = {};
  need.forEach(function (m) { c[m] = (c[m] || 0) + 1; });
  return c;
}
function haveNeed(need) {
  var c = needCounts(need), ok = true;
  for (var m in c) if ((S.mats[m] || 0) < c[m]) ok = false;
  return ok;
}
function spendNeed(need) {
  var c = needCounts(need);
  for (var m in c) { S.mats[m] = (S.mats[m] || 0) - c[m]; if (S.mats[m] < 1) delete S.mats[m]; }
}
function buildTier2(id) {
  var c = COMBO_BY_ID[id];
  if (!c || c.tier !== 2) return;
  if (!tier2Unlocked()) { toast('1단계 물건을 다 모으면 열려요'); return; }

  if ((S.stars || 0) < c.cost) { toast('별이 ' + (c.cost - S.stars) + '개 더 필요해요'); return; }
  if (!haveNeed(c.need)) { toast('재료가 부족해요. 상자를 열어 모아요!'); return; }
  S.stars -= c.cost;

  save(); updateCoins(); confetti(); beep('combo');
  modal('<p style="font-weight:900;font-size:13px;color:var(--ink2)">2단계 명물 완성!</p>' +

  var owned = {};

function pickPool(kind) {
  var pool;
  if (kind === 'wrong') {
    pool = shuffle(wrongWords()).slice(0, 8);
  } else if (quizSel.scope === 'day') {
    pool = shuffle((BY_DAY[quizSel.day] || []).slice());
  } else if (quizSel.scope === 'lvl') {
    pool = shuffle(BY_LVL[quizSel.lvl].slice());
  } else {
    pool = shuffle(W.slice());
  }
  if (!pool.length) return [];
  if (kind === 'wrong') return pool;
  /* 우선순위: 안 본 것(0) > 오답(1) > 덜 익힌 것(2) > 익숙한 것(3) */
  var wgt = function (w) {
    var r = S.words[w.en];
    if (!r || !r.seen) return 0;
    if (r.wrong > 0 && r.level < 3) return 1;
    if (r.level === 0) return 1;
    if (r.level < 3) return 2;
    return 3;
  };
  pool.sort(function (a, b) { return wgt(a) - wgt(b); });
  var out = [];
  var buckets = [[], [], [], []];
  pool.forEach(function (w) { buckets[wgt(w)].push(w); });
  buckets.forEach(function (b) { shuffle(b); });
  var i = 0;
  while (out.length < 8 && buckets.some(function (b) { return b.length; })) {
    var b2 = buckets[i % 3];
    if (b2.length) out.push(b2.pop());
    i++;
    if (i > 60) break;
  }
  return out.slice(0, 8);
}

function makeDistractors(w, field) {
  var sameDay = BY_DAY[w.day].filter(function (x) { return x.en !== w.en; });
  var sameLvl = BY_LVL[w.level].filter(function (x) { return x.en !== w.en && !sameDay.some(function (y) { return y.en === x.en; }); });
  var pool = shuffle(sameDay).concat(shuffle(sameLvl));
  var out = [], used = {};
  used[field === 'en' ? w.ko : w.en] = 1;
  for (var i = 0; i < pool.length && out.length < 3; i++) {
    var k = field === 'en' ? pool[i].ko : pool[i].en;
    if (used[k]) continue;
    used[k] = 1; out.push(pool[i]);
  }
  while (out.length < 3) { var c = W[(Math.random() * W.length) | 0]; var k2 = field === 'en' ? c.ko : c.en; if (!used[k2]) { used[k2] = 1; out.push(c); } }
  return out;
}

function startSession(kind) {
  var pool = pickPool(kind);
  if (!pool.length) { toast('풀 수 있는 단어가 없어요. 공부 탭에서 단어를 먼저 봐요!'); go('learn'); return; }
  session = { kind: kind || 'normal', words: pool, qi: 0, correct: 0, wrongNow: [],
    type: kind === 'wrong' ? 'mix' : quizSel.type,
    fresh: 0, blocked: 0, warned: false, rewardKey: sessionRewardKey(),
    locked: kind !== 'wrong' && cooldownLeft((S.dayReward || {})[sessionRewardKey()] || 0) > 0,
    lockedLeft: kind !== 'wrong' ? cooldownLeft((S.dayReward || {})[sessionRewardKey()] || 0) : 0 };
  renderQuestion();
  go('quiz');
}

  if (t === 'spell' && !/[a-z]/i.test(w.en)) t = 'choose';

/* 친구 앱에서 보여 줄 상세 진도 — 단계별 · Day별 · 자주 틀린 단어 · 오늘 단어 */
function myProgress() {
  var seenN = 0, masteredN = 0;
  Object.keys(S.words || {}).forEach(function (en) {
    var r = S.words[en];
    if (r && r.seen) seenN++;
    if (r && r.level >= 3) masteredN++;
  });
  var levels = LEVELS.map(function (l) {
    var p = lvlProgress(l.id);
    return { id: l.id, name: l.name, sub: l.sub, from: l.days[0], to: l.days[1],
      total: p.total, seen: p.seen, mastered: p.mastered };
  });
  var days = [], doneN = 0;
  Object.keys(BY_DAY).map(Number).sort(function (a, b) { return a - b; }).forEach(function (d) {
    var list = BY_DAY[d] || [], seen = 0, mast = 0, last = 0, fresh = 0;
    list.forEach(function (w) {
      var r = S.words[w.en];
      if (!r) return;
      if (r.seen) seen++;
      if (r.level >= 3) mast++;
      if (r.last > last) last = r.last;
      if (r.starAt && Date.now() - r.starAt < COOLDOWN_MS) fresh++;
    });
    if (list.length && seen >= list.length) doneN++;

  });

  var wrong = W.filter(function (w) {

  }).sort(function (a, b) { return (S.words[b.en].wrong || 0) - (S.words[a.en].wrong || 0); })
    .slice(0, 8).map(function (w) {

    });

    daysDone: doneN, daysTotal: days.length,
    currentDay: (lastDay ? lastDay.d : (firstOpen ? firstOpen.d : (days[0] ? days[0].d : 1))),

}

/* ---------- 내 기록 올리기 / 내려받기 ---------- */
function cloudPush(force) {
  if (!sb) { console.info('[village] push 보류: 연결 전'); return; }
  /* 빈 기록으로 서버를 덮어쓰지 않는다. 단 '기록 초기화'처럼 일부러 비운 경우(force)는 올린다. */
  if (!hasProgress() && !force) { console.info('[village] push 보류: 기기 기록 없음'); return; }
  S.rev = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  var doc = myDoc();
  return sb.from(SYNC_TABLE).upsert({ id: MY_ROW, doc: doc, updated_at: new Date().toISOString() }, { onConflict: 'id' })
    .then(function (res) {
      if (res && res.error) { console.warn('[village] 저장 실패', res.error); cloud.msg = '저장 실패'; }
      else { cloud.last = Date.now(); cloud.msg = ''; console.info('[village] 저장 완료', MY_ROW); }
    }, function (err) { console.warn('[village] 저장 실패', err); cloud.msg = '저장 실패'; });
}
function adoptDoc(doc) {
  var d = doc.data || {};
  applyingRemote = true;
  ['stars', 'boxes', 'mats', 'words', 'daily', 'pets', 'placed', 'combos', 'upg', 'dayReward', 'name', 'onboarded', 'createdAt', 'sky'].forEach(function (k) {
    if (d[k] !== undefined && d[k] !== null) S[k] = d[k];
  });
  ['words', 'daily', 'mats', 'placed', 'combos', 'upg', 'dayReward'].forEach(function (k) { S[k] = S[k] || {}; });
  S.pets = Array.isArray(S.pets) ? S.pets : [];
  S.rev = doc.rev || Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  applyingRemote = false;
  updateCoins(); renderNav();
  if (curTab === 'village') renderVillage();
  if (curTab === 'learn') renderLearn();
  if (curTab === 'report') renderReport();
}
function mergeDoc(doc) {
  var d = doc.data || {};
  applyingRemote = true;
  S.stars = Math.max(S.stars || 0, d.stars || 0);
  S.boxes = Math.max(S.boxes || 0, d.boxes || 0);
  if (!S.name && d.name) S.name = d.name;
  if (d.onboarded) S.onboarded = true;
  var mats = {}, src = [S.mats || {}, d.mats || {}];
  src.forEach(function (m) { for (var k in m) mats[k] = Math.max(mats[k] || 0, m[k] || 0); });
  S.mats = mats;
  var words = S.words || {}, rw = d.words || {};
  for (var en in rw) {
    var b = rw[en];
    if (!b) continue;
    var a = words[en];
    if (!a) { if (BY_EN[en]) words[en] = b; continue; }
    a.right = Math.max(a.right || 0, b.right || 0);
    a.wrong = Math.max(a.wrong || 0, b.wrong || 0);
    a.level = Math.max(a.level || 0, b.level || 0);
    a.seen = !!(a.seen || b.seen);
    a.known = !!(a.known || b.known);
    a.last = Math.max(a.last || 0, b.last || 0);
  }
  S.words = words;
  var daily = S.daily || {}, rd = d.daily || {};
  for (var day in rd) {
    var x = daily[day], y = rd[day];
    if (!x || typeof x !== 'object') { daily[day] = y; continue; }
    ['q', 'c', 'stars', 'newWords'].forEach(function (f) { x[f] = Math.max(x[f] || 0, (y && y[f]) || 0); });
  }
  S.daily = daily;
  var uids = {};
  (S.pets || []).forEach(function (p) { uids[p.uid] = 1; });
  (d.pets || []).forEach(function (p) { if (p && p.uid && !uids[p.uid]) { S.pets.push(p); uids[p.uid] = 1; } });
  var rp = d.placed || {};
  for (var k2 in rp) if (!S.placed[k2]) S.placed[k2] = rp[k2];
  var rc = d.combos || {};
  for (var cid in rc) {
    if (!S.combos[cid]) S.combos[cid] = rc[cid];
    else S.combos[cid].made = Math.max(S.combos[cid].made || 0, (rc[cid] && rc[cid].made) || 0);
  }
  /* 2단계: 건물별 최고 업그레이드만 남기고, 하늘은 내 선택을 지킨다 */
  var ru = d.upg || {};
  S.upg = S.upg || {};
  for (var uid2 in ru) S.upg[uid2] = Math.max(S.upg[uid2] || 0, ru[uid2] || 0);
  var rd2 = d.dayReward || {};
  S.dayReward = S.dayReward || {};
  for (var dk in rd2) S.dayReward[dk] = Math.max(S.dayReward[dk] || 0, rd2[dk] || 0);
  /* 단어별 마지막 별 수령 시각도 양쪽 중 늦은 쪽을 남긴다 (쿨다운 우회 방지) */
  var rw2 = d.words || {};
  for (var en2 in rw2) {
    if (!S.words[en2] || !rw2[en2]) continue;
    S.words[en2].starAt = Math.max(S.words[en2].starAt || 0, rw2[en2].starAt || 0);
    S.words[en2].spokenOk = !!(S.words[en2].spokenOk || rw2[en2].spokenOk);
  }
  if (!S.sky && d.sky) S.sky = d.sky;
  S.sky = S.sky === 'sunset' || S.sky === 'night' ? S.sky : 'day';
  S.rev = Math.max(S.rev || 0, doc.rev || 0);
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  applyingRemote = false;
  updateCoins(); renderNav();
  if (curTab === 'village') renderVillage();
  if (curTab === 'learn') renderLearn();
  if (curTab === 'report') renderReport();
}
function cloudPullOwn() {
  if (!sb) return Promise.resolve();
  return sb.from(SYNC_TABLE).select('id,doc,updated_at').eq('id', MY_ROW).then(function (res) {
    if (res.error) throw res.error;
    var row = (res.data || [])[0];
    console.info('[village] 내 기록 확인', !!row, '기기 기록 있음:', hasProgress());
    if (!row || !row.doc || !row.doc.data) {
      /* 서버에 내 마을이 없다 → 이 기기의 기록을 먼저 올린다 (아이 기록 보호) */
      if (hasProgress()) return cloudPush();
      return;
    }
    var srv = row.doc, srvRev = srv.rev || Date.parse(row.updated_at) || 0;
    if (!hasProgress()) {
      /* 이 기기에서 기록을 초기화한 뒤라면 옛 서버 기록을 다시 가져오지 않는다 */
      if (S.cleared && (S.rev || 0) >= srvRev) return cloudPush(true);
      adoptDoc(srv);
      return;
    }
    /* 초기화한 기기는 옛 기록과 합치지 않고 그대로 올린다 */
    if (S.cleared && (S.rev || 0) >= srvRev) return cloudPush(true);
    /* 양쪽 기록을 합친 뒤 올린다 — 어느 쪽 기록도 지우지 않는다 */
    mergeDoc(srv);
    return cloudPush();
  });
}

      '<div class="v-bar" style="justify-content:space-between">' +
      '<span class="hint" style="margin:0">' + (friendDoc.updated_at ? agoText(Date.parse(friendDoc.updated_at)) + ' 업데이트' : '') + '</span>' +
      '<button class="pill sm" id="vRefresh">새로고침</button></div></div>';

    html += '<div class="visit-stats">' +
      '<div class="vstat"><b>' + esc(st.level || '-') + '</b><small>지금 단계</small></div>' +
      '<div class="vstat"><b>' + (st.mastered || 0) + ' / ' + (st.total || TOTAL) + '</b><small>완벽히 익힌 단어</small></div>' +
      '<div class="vstat"><b>' + (st.items || 0) + '개 · ' + (st.pets || 0) + '마리</b><small>마을 물건 · 친구</small></div>' +
      '<div class="vstat"><b>1단계 ' + ((doc.village && doc.village.t1) || st.ency || 0) + '/16 · 2단계 ' + ((doc.village && doc.village.t2) || 0) + '/8</b><small>모은 물건 · 명물</small></div>' +
      '<div class="vstat"><b>' + (st.stars || 0) + '★</b><small>모은 별</small></div></div>';

    html += '<div class="card" style="margin-top:12px"><div style="font-weight:900;font-size:14px">오늘 공부한 단어 ' + todayW.length + '개</div>' +
      (todayW.length ? '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">' + todayW.map(function (w) {
        return '<span class="pill sm" style="height:auto;padding:4px 10px">' + esc(w.en) + ' <small style="color:var(--ink2)">' + esc(w.ko) + '</small></span>';
      }).join('') + '</div>' : '<p class="hint">오늘은 아직 공부 기록이 없어요. 응원 메시지를 남겨 주세요!</p>') +
      '</div>';
  }

  html += '<div class="card" style="margin-top:12px"><div style="font-weight:900;font-size:14px">💌 방명록 남기기</div>' +
    '<textarea id="gMsg" maxlength="80" placeholder="' + esc(FRIEND.name) + '에게 한마디 (80자까지)"></textarea>' +
    '<div class="heart-line"><input type="checkbox" id="gHeart" checked><label for="gHeart">❤️ 하트도 함께 보내기</label></div>' +
    '<button class="btn y" id="gSend" style="width:100%;margin-top:10px">방명록 보내기</button>' +
    '<p class="hint">' + esc(FRIEND.name) + subJosa(FRIEND.name) + ' 앱을 열면 알림으로 확인해요.</p></div>';

  html += '<div class="card" style="margin-top:12px"><div style="font-weight:900;font-size:14px">🎁 오늘의 선물 (하루 1번)</div>' +
    '<div class="gift-row">' +
    '<button class="btn p" id="giftStars"' + (sent ? ' disabled' : '') + '>⭐ 별 +5 보내기</button>' +
    '<button class="btn g" id="giftMat"' + (sent ? ' disabled' : '') + '>🧰 재료 1개 보내기</button></div>' +
    '<p class="hint">' + (sent ? '오늘은 이미 선물을 보냈어요. 내일 또 보낼 수 있어요.' : '내가 모은 별이 줄지 않고 선물이 만들어져요.') + '</p></div>';

  html += '<div class="card" style="margin-top:12px"><div style="font-weight:900;font-size:14px;margin-bottom:8px">🏡 ' + esc(nm) + ' 마을 소식</div>' +
    (wall.length ? wall.map(function (r) {
      var d = r.doc, giftTxt = '';
      if (d.type === 'gift' && d.gift) {
        giftTxt = d.gift.t === 'stars' ? '⭐ 별 ' + (d.gift.n || 5) + '개를 선물했어요' : '🧰 ' + ((MAT_BY_ID[d.gift.id] || {}).name || '재료') + '을(를) 선물했어요';
      }
      return '<div class="wall-item' + (d.type === 'gift' ? ' gift' : '') + '"><div class="who"><span>' + esc(d.fromName || d.from || '가족') +
        (d.heart ? ' ❤️' : '') + '</span><span>' + agoText(d.ts) + '</span></div>' +
        '<div class="msg">' + esc(d.type === 'gift' ? giftTxt : (d.msg || '')) + '</div></div>';
    }).join('') : '<p class="hint">아직 남겨진 방명록이 없어요. 첫 번째로 남겨 보세요!</p>') + '</div>';

  html += '<p style="text-align:center;font-size:11.5px;font-weight:800;color:var(--ink2);margin-top:12px">' +
    '내 마을: ' + esc(S.name || CFG.ownerName || '나') + ' · ' + esc(cloudLabel()) + '</p></div>';
  sc.innerHTML = html;

  var rf2 = $('#vRefresh'); if (rf2) rf2.addEventListener('click', function () { loadVisit(true); });
  $$('#scr-visit [data-vt]').forEach(function (b) {
    b.addEventListener('click', function () { visitTab = b.getAttribute('data-vt'); renderVisit(); });
  });
  var gs = $('#gSend');
  if (gs) gs.addEventListener('click', function () {
    var el = $('#gMsg'), msg = (el.value || '').trim();
    if (!msg) { toast('한마디를 적어 주세요'); el.focus(); return; }
    sendSocial('guest', { msg: msg.slice(0, 80), heart: !!$('#gHeart').checked });
  });
  var g1 = $('#giftStars');
  if (g1) g1.addEventListener('click', function () {
    if (sentToday()) { toast('선물은 하루에 한 번만 보낼 수 있어요'); return; }
    sendSocial('gift', { gift: { t: 'stars', n: 5 } });
  });
  var g2 = $('#giftMat');
  if (g2) g2.addEventListener('click', function () {
    if (sentToday()) { toast('선물은 하루에 한 번만 보낼 수 있어요'); return; }
    var pick = MATS[Math.floor(Math.random() * MATS.length)];
    sendSocial('gift', { gift: { t: 'mat', id: pick.id } });
  });
  if (visitTimer) clearInterval(visitTimer);
  visitTimer = setInterval(function () {
    if (curTab !== 'visit' || document.hidden) return;
    loadVisit(false);
  }, 20000);
}
function sendSocial(type, extra) {
  if (!cloudReady()) { toast('인터넷 연결을 기다리고 있어요'); return; }
  if (sending) return;
  sending = true;
  var doc = {
    kind: 'social', type: type, from: OWNER, fromName: S.name || CFG.ownerName || '', to: FRIEND.id,
    ts: Date.now(), heart: !!extra.heart
  };
  if (extra.msg) doc.msg = extra.msg;
  if (extra.gift) doc.gift = extra.gift;
  sb.from(SYNC_TABLE).insert({ id: socialRowId(FRIEND.id), doc: doc, updated_at: new Date().toISOString() })
    .then(function (res) {
      sending = false;
      if (res && res.error) { console.warn('[village] 보내기 실패', res.error); toast('보내지 못했어요. 잠시 뒤 다시 해 볼게요'); return; }
      if (type === 'gift') { markSent(); }
      beep('combo'); confetti();
      toast(type === 'gift' ? FRIEND.name + '에게 선물을 보냈어요! 🎁' : FRIEND.name + '에게 방명록을 남겼어요! 💌');
      loadVisit(false);
    }, function (err) { sending = false; console.warn('[village] 보내기 실패', err); toast('보내지 못했어요'); });
}
function loadVisit(showBusy) {
  if (!cloudReady()) { renderVisit(); return; }
  if (visitFetching) return;
  visitFetching = true;
  if (showBusy) toast('마을을 불러오는 중…');
  Promise.all([cloudPullFriend(), cloudPullFriendWall()]).then(function () {
    visitFetching = false;
    if (curTab === 'visit') renderVisit();
  }).catch(function (e) {
    visitFetching = false;
    console.warn('[village] 마을 불러오기 실패', e);
    if (curTab === 'visit') renderVisit();
  });
}

/* ---------- 시작 · 알림 ---------- */
function cloudInit() {
  if (typeof supabase === 'undefined' || !supabase || typeof supabase.createClient !== 'function') {
    cloud.state = 'off'; cloud.msg = '라이브러리 없음';
    if (curTab === 'visit') renderVisit();
    return;
  }
  cloud.state = 'wait';
  try {
    sb = supabase.createClient(CLOUD_URL, CLOUD_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
  } catch (e) { cloud.state = 'off'; cloud.msg = '연결 실패'; return; }
  cloudPullOwn().then(function () {
    cloud.state = 'on'; cloud.last = Date.now(); cloud.booted = true;
    if (curTab === 'visit') loadVisit(false);
    return cloudPullSocial();
  }).then(function () {
    if (cloud.booted) notifySocial();
  }).catch(function (e) { console.warn('[village] 연결 실패', e); cloud.state = 'off'; cloud.msg = '연결 실패'; if (curTab === 'visit') renderVisit(); });
}
function notifySocial() {
  var gifts = pendingGifts(), msgs = newMessages();
  if (!gifts.length && !msgs.length) return;
  var from = {};
  gifts.concat(msgs).forEach(function (r) { if (r.doc.fromName) from[r.doc.fromName] = (from[r.doc.fromName] || 0) + 1; });
  var who = Object.keys(from)[0] || '가족';
  var html = '<div class="m-art" style="font-size:46px">📬</div>' +
    '<h3>' + esc(who) + subJosa(who) + ' 다녀갔어요!</h3>' +
    '<p>' + (msgs.length ? '새 방명록 ' + msgs.length + '개' : '') + (msgs.length && gifts.length ? ' · ' : '') +
    (gifts.length ? '선물 ' + gifts.length + '개' : '') + '가 도착했어요.</p>' +
    '<div class="m-btns"><button class="btn w" id="nLater">나중에</button><button class="btn y" id="nNow">받기</button></div>';
  modal(html);
  $('#nLater').addEventListener('click', function () { closeModal(); });
  $('#nNow').addEventListener('click', function () { closeModal(); claimSocial(false); });
}
document.addEventListener('visibilitychange', function () {
  if (document.hidden || !cloudReady()) return;
  cloudPullOwn().then(cloudPullSocial).then(function () { notifySocial(); if (curTab === 'visit') loadVisit(false); }).catch(function () {});
});
window.addEventListener('online', function () { if (!cloudReady()) cloudInit(); });

boot();
})();

</script>
</body>
</html>
