<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="referrer" content="no-referrer" />
<meta name="description" content="원서 문장을 원어민 발음으로 한 번 듣고, 내가 따라 읽으며 발음을 확인하는 따라 읽기 앱" />
<meta name="theme-color" content="#fbf6ee" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="원서 따라 읽기" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" href="icon-192.png" />
<title>📖 원서 따라 읽기</title>
<style>
  :root{
    --paper:#fbf6ee;
    --paper2:#f4ece0;
    --card:#ffffff;
    --ink:#3a302a;
    --ink-soft:#5c4c42;
    --muted:#8b786a;
    --line:#eadfd0;
    --line-soft:#f1e7da;
    --accent:#b1643f;
    --accent-dark:#8f4c2c;
    --accent-soft:#f7e5d7;
    --teal:#2f6b60;
    --teal-dark:#245249;
    --teal-soft:#e2f0eb;
    --ok:#1f6b43;
    --ok-soft:#d8f0df;
    --bad:#b23c31;
    --bad-soft:#fbdcd7;
    --gold:#c99a3f;
    --shadow:0 10px 26px rgba(120,90,60,.10);
    --shadow-lift:0 16px 40px rgba(120,90,60,.16);
    --r:20px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--paper)}
  body{
    margin:0;min-width:320px;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
    background:
      radial-gradient(circle at 8% 0%, rgba(247,225,207,.55), transparent 22rem),
      radial-gradient(circle at 96% 4%, rgba(226,240,235,.6), transparent 20rem),
      var(--paper);
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
  input,textarea{font:inherit;color:inherit}
  .serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif}

  .shell{width:min(100% - 2rem,740px);margin:0 auto}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:30;
    padding:calc(env(safe-area-inset-top) + .55rem) 1rem .55rem;
    background:rgba(251,246,238,.86);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line-soft);
    display:flex;align-items:center;gap:.55rem;
  }
  .topbar .tb-nav{display:grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:1.1rem;color:var(--ink-soft);flex:0 0 auto}
  .topbar .tb-nav:active{background:var(--paper2)}
  .tb-body{min-width:0;flex:1}
  .tb-title{display:block;font-weight:800;font-size:.95rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tb-sub{display:block;margin-top:.1rem;font-size:.68rem;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tb-act{display:grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:1rem;flex:0 0 auto}

  /* ---------- library ---------- */
  .screen{padding:1.1rem 0 2.5rem}
  .hero{padding:.5rem .1rem 1.1rem}
  .eyebrow{display:inline-flex;align-items:center;gap:.4rem;margin:0 0 .7rem;padding:.32rem .7rem;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--accent-dark);font-size:.66rem;font-weight:900;letter-spacing:.05em}
  .hero h1{margin:0 0 .45rem;font-size:1.9rem;line-height:1.18;letter-spacing:-.03em;font-weight:850}
  .hero h1 em{font-style:normal;color:var(--accent)}
  .hero p{margin:0;color:var(--ink-soft);font-size:.92rem;line-height:1.6;font-weight:650}
  .stat-row{display:flex;gap:.5rem;margin:1.05rem 0 .2rem}
  .stat{flex:1;padding:.72rem .6rem;border-radius:16px;background:#fff;border:1px solid var(--line);text-align:center;box-shadow:0 4px 12px rgba(120,90,60,.05)}
  .stat b{display:block;font-size:1.1rem;line-height:1.2}
  .stat span{display:block;margin-top:.12rem;font-size:.62rem;font-weight:800;color:var(--muted);letter-spacing:.02em}

  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:.6rem;margin:1.5rem 0 .7rem;padding:0 .1rem}
  .sec-head h2{margin:0;font-size:.98rem;font-weight:850;letter-spacing:-.01em}
  .sec-head .link{font-size:.74rem;font-weight:800;color:var(--accent-dark);background:#fff;border:1px solid var(--line);border-radius:999px;padding:.3rem .62rem}

  .book{
    display:flex;align-items:center;gap:.85rem;width:100%;text-align:left;
    padding:.85rem;margin-bottom:.6rem;border-radius:var(--r);
    background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
    transition:transform .12s ease;
  }
  .book:active{transform:scale(.985)}
  .cover{display:grid;place-items:center;width:3.6rem;height:4.8rem;border-radius:12px;font-size:1.75rem;flex:0 0 auto;position:relative;overflow:hidden;box-shadow:inset 0 -14px 20px rgba(0,0,0,.05)}
  .cover::after{content:"";position:absolute;left:.35rem;top:0;bottom:0;width:2px;background:rgba(255,255,255,.55)}
  .cover.a{background:linear-gradient(160deg,#ffe6c9,#f7cfa5)}
  .cover.v{background:linear-gradient(160deg,#fbe0e6,#f3c3ce)}
  .cover.l{background:linear-gradient(160deg,#dcecf7,#bcd8ea)}
  .cover.c{background:linear-gradient(160deg,#e9e3f6,#cdc3ea)}
  .book-body{min-width:0;flex:1}
  .book-title{display:block;font-weight:850;font-size:1rem;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .book-en{display:block;margin-top:.08rem;font-size:.72rem;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chips{display:flex;flex-wrap:wrap;gap:.28rem;margin-top:.42rem}
  .chip{font-size:.6rem;font-weight:850;color:var(--accent-dark);background:var(--accent-soft);border-radius:999px;padding:.16rem .45rem;letter-spacing:.02em}
  .chip.gray{color:var(--muted);background:var(--paper2)}
  .bar{height:5px;margin-top:.5rem;border-radius:999px;background:var(--paper2);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),#d08a5f);transition:width .3s ease}
  .bar-row{display:flex;align-items:center;gap:.5rem;margin-top:.5rem}
  .bar-row .bar{flex:1;margin-top:0}
  .bar-row .num{font-size:.64rem;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}

  .add-card{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;padding:1rem;border-radius:var(--r);border:1.6px dashed #d9c8b1;background:rgba(255,255,255,.55);color:var(--accent-dark);font-weight:850;font-size:.9rem}
  .add-card:active{background:#fff}

  .foot{margin:1.8rem 0 0;padding:0 .2rem;color:var(--muted);font-size:.66rem;line-height:1.7;font-weight:600}

  /* ---------- chapter list ---------- */
  .book-head{display:flex;gap:.9rem;align-items:center;padding:.4rem .1rem 1rem}
  .book-head .cover{width:4.2rem;height:5.6rem;font-size:2rem;border-radius:14px}
  .book-head h1{margin:0;font-size:1.25rem;line-height:1.25;letter-spacing:-.02em}
  .book-head .en{display:block;margin-top:.15rem;font-size:.76rem;font-weight:700;color:var(--muted)}
  .book-head .au{display:block;margin-top:.3rem;font-size:.7rem;font-weight:700;color:var(--ink-soft)}
  .resume{display:flex;align-items:center;justify-content:center;gap:.4rem;width:100%;margin:.2rem 0 .9rem;padding:.85rem;border-radius:16px;background:linear-gradient(180deg,#b96c46,#a45733);color:#fff;font-weight:900;font-size:.92rem;box-shadow:0 10px 22px rgba(160,90,50,.28)}
  .resume:active{transform:scale(.985)}
  .chap{display:flex;align-items:center;gap:.75rem;width:100%;text-align:left;padding:.78rem .85rem;margin-bottom:.5rem;border-radius:16px;background:#fff;border:1px solid var(--line);box-shadow:0 4px 12px rgba(120,90,60,.05)}
  .chap:active{background:var(--paper2)}
  .chap .n{display:grid;place-items:center;width:2rem;height:2rem;border-radius:999px;background:var(--paper2);font-size:.76rem;font-weight:900;color:var(--ink-soft);flex:0 0 auto}
  .chap.done .n{background:var(--ok-soft);color:var(--ok)}
  .chap-body{min-width:0;flex:1}
  .chap-title{display:block;font-weight:800;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chap-ko{display:block;margin-top:.1rem;font-size:.68rem;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chap-pct{font-size:.68rem;font-weight:900;color:var(--accent-dark);flex:0 0 auto;font-variant-numeric:tabular-nums}
  .chap-pct.full{color:var(--ok)}
  .danger-link{display:block;margin:1.2rem auto 0;padding:.5rem .9rem;border-radius:999px;color:#a8453a;font-size:.75rem;font-weight:800;background:#fff;border:1px solid #f0d6d1}

  /* ---------- reader ---------- */
  .progline{display:flex;align-items:center;gap:.6rem;margin:.3rem 0 .7rem}
  .progline .bar{flex:1;margin:0;height:6px}
  .progline .num{font-size:.7rem;font-weight:850;color:var(--muted);font-variant-numeric:tabular-nums}
  .segmented{display:flex;gap:.25rem;padding:.22rem;border-radius:999px;background:#efe5d7;border:1px solid #e6d9c7;margin-bottom:.85rem}
  .segmented button{flex:1;padding:.42rem 0;border-radius:999px;font-size:.76rem;font-weight:850;color:var(--muted)}
  .segmented button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(120,90,60,.12)}

  .sentence-card{position:relative;padding:1.25rem 1.15rem 1.1rem;border-radius:var(--r);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
  .sentence-card.playing{box-shadow:0 0 0 3px rgba(177,100,63,.16),var(--shadow)}
  .sent-meta{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.55rem}
  .sent-meta .lbl{font-size:.64rem;font-weight:900;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
  .sent-meta .st{font-size:.66rem;font-weight:850;color:var(--muted)}
  .sent-meta .st.ok{color:var(--ok)}
  .sentence{margin:0;font-size:1.28rem;line-height:1.75;letter-spacing:.002em;color:#332a24}
  .sentence .w{border-radius:5px;padding:.02em 0;transition:background .12s}
  .sentence .w:active{background:var(--accent-soft)}
  .sentence .w.ok{color:var(--ok);background:linear-gradient(transparent 58%,var(--ok-soft) 58%)}
  .sentence .w.miss{color:var(--bad);background:linear-gradient(transparent 58%,var(--bad-soft) 58%)}
  .para-view p{margin:0 0 1rem;font-size:1.06rem;line-height:1.8;color:#3b312b}
  .para-view p:last-child{margin-bottom:0}
  .para-view .s{border-radius:6px;cursor:pointer}
  .para-view .s.cur{background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
  .para-view .s.done{color:var(--ink-soft)}
  .para-view .s.done::after{content:" ✓";font-size:.72em;color:var(--ok);font-weight:700}
  .moral{margin-top:.9rem;padding-top:.75rem;border-top:1px dashed var(--line);font-size:.88rem;font-weight:750;color:var(--accent-dark);line-height:1.55}
  .moral b{font-size:.62rem;letter-spacing:.08em;color:var(--muted);display:block;margin-bottom:.2rem}

  .feedback{margin-top:.9rem;border-radius:14px;padding:.7rem .8rem;font-size:.8rem;font-weight:750;line-height:1.5;display:none}
  .feedback.show{display:block}
  .feedback.ok{background:var(--ok-soft);color:#1b5738}
  .feedback.bad{background:var(--bad-soft);color:#8f2f26}
  .feedback.warn{background:#fdf1d8;color:#7d5b16}
  .feedback .pct{font-weight:900;font-size:.95rem}
  .feedback .next-btn{display:inline-flex;align-items:center;gap:.25rem;margin-top:.6rem;padding:.44rem .85rem;border-radius:999px;background:rgba(255,255,255,.78);border:1px solid rgba(0,0,0,.06);font-weight:900;font-size:.78rem;color:#2c4a3a}
  .feedback .next-btn:active{transform:scale(.97)}
  .feedback .heard{display:block;margin-top:.25rem;font-weight:650;color:inherit;opacity:.85;font-size:.76rem;word-break:break-word}

  .controls{margin-top:.9rem;display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
  .btn{display:flex;align-items:center;justify-content:center;gap:.42rem;padding:.92rem .5rem;border-radius:16px;font-weight:900;font-size:.92rem;letter-spacing:-.01em;transition:transform .1s ease}
  .btn:active{transform:scale(.97)}
  .btn-primary{background:linear-gradient(180deg,#bc6f49,#a45833);color:#fff;box-shadow:0 10px 22px rgba(160,90,50,.26)}
  .btn-mic{background:linear-gradient(180deg,#357a6d,#286054);color:#fff;box-shadow:0 10px 22px rgba(40,96,84,.24)}
  .btn-mic.rec{background:linear-gradient(180deg,#c04a3f,#a53a30);box-shadow:0 0 0 4px rgba(192,74,63,.18),0 10px 22px rgba(160,60,50,.26);animation:pulse 1.1s infinite}
  .btn[disabled]{opacity:.72}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.015)}}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink-soft);font-weight:850;font-size:.8rem;padding:.62rem .5rem;border-radius:14px;grid-column:1/-1}
  .btn-ghost.stop{color:#a8453a;border-color:#f0d6d1;background:#fff7f5}

  .mini-row{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-top:.6rem}
  .speed{display:flex;gap:.22rem;padding:.2rem;border-radius:999px;background:#efe5d7;border:1px solid #e6d9c7}
  .speed button{padding:.3rem .62rem;border-radius:999px;font-size:.72rem;font-weight:900;color:var(--muted);font-variant-numeric:tabular-nums}
  .speed button.on{background:#fff;color:var(--accent-dark);box-shadow:0 2px 6px rgba(120,90,60,.12)}
  .mini-link{font-size:.72rem;font-weight:850;color:var(--muted);padding:.34rem .6rem;border-radius:999px;background:rgba(255,255,255,.7);border:1px solid var(--line-soft)}

  .story-nav{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-top:1rem;padding:.5rem;border-radius:999px;background:#fff;border:1px solid var(--line)}
  .story-nav button{display:flex;align-items:center;gap:.25rem;padding:.55rem .9rem;border-radius:999px;font-size:.8rem;font-weight:850;color:var(--ink-soft)}
  .story-nav button[disabled]{opacity:.35}
  .story-nav .count{font-size:.76rem;font-weight:900;color:var(--muted);font-variant-numeric:tabular-nums}

  .hint{margin-top:1.1rem;padding:.85rem .95rem;border-radius:14px;background:rgba(255,255,255,.62);border:1px solid var(--line-soft);font-size:.74rem;line-height:1.65;color:var(--muted);font-weight:650}
  .hint b{color:var(--ink-soft)}

  /* ---------- forms ---------- */
  .field{margin-bottom:.85rem}
  .field label{display:block;margin-bottom:.35rem;font-size:.74rem;font-weight:850;color:var(--ink-soft)}
  .field input,.field textarea{width:100%;padding:.78rem .85rem;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:.92rem;outline:none}
  .field input:focus,.field textarea:focus{border-color:#d8b795;box-shadow:0 0 0 3px rgba(177,100,63,.1)}
  .field textarea{min-height:190px;resize:vertical;line-height:1.6}
  .field .help{margin-top:.3rem;font-size:.68rem;font-weight:650;color:var(--muted);line-height:1.5}
  .primary-wide{display:flex;align-items:center;justify-content:center;width:100%;margin-top:.4rem;padding:.95rem;border-radius:16px;background:linear-gradient(180deg,#bc6f49,#a45833);color:#fff;font-weight:900;font-size:.95rem;box-shadow:0 10px 22px rgba(160,90,50,.24)}
  .primary-wide:active{transform:scale(.985)}

  /* ---------- sheet ---------- */
  .sheet-wrap{position:fixed;inset:0;z-index:60;display:none}
  .sheet-wrap.show{display:block}
  .backdrop{position:absolute;inset:0;background:rgba(52,40,32,.42);animation:fade .16s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{position:absolute;left:0;right:0;bottom:0;max-height:86vh;overflow:auto;background:var(--paper);border-radius:24px 24px 0 0;padding:.7rem 1.1rem calc(1.3rem + env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(60,40,25,.22);animation:up .2s ease}
  @keyframes up{from{transform:translateY(18px)}to{transform:translateY(0)}}
  .sheet .grab{width:2.6rem;height:.28rem;border-radius:999px;background:#ddcdb8;margin:.15rem auto .9rem}
  .sheet h3{margin:0 0 .2rem;font-size:1.02rem;font-weight:850;letter-spacing:-.01em}
  .sheet h3.serif{font-size:1.5rem;letter-spacing:.005em;margin-bottom:.3rem}
  .sheet .sub{margin:0 0 .9rem;font-size:.74rem;font-weight:700;color:var(--muted);line-height:1.5}
  .sheet-row{display:flex;gap:.5rem;margin-bottom:.55rem}
  .sheet-row .btn{flex:1;font-size:.84rem;padding:.78rem .4rem;border-radius:14px}
  .sheet-row a.btn{text-decoration:none}
  .btn-line{background:#fff;border:1px solid var(--line);color:var(--ink-soft);font-weight:850}
  .btn-star{background:var(--accent-soft);color:var(--accent-dark);font-weight:900}
  .btn-star.on{background:#e8f4e9;color:var(--ok)}
  .sheet-note{font-size:.66rem;font-weight:650;color:var(--muted);line-height:1.6;margin:.7rem 0 0}
  .word-ko{font-size:.8rem;font-weight:750;color:var(--ink-soft);margin:0 0 .8rem;word-break:break-word}
  .word-ko .ph{font-family:var(--serif,serif);color:var(--muted);font-size:.78rem;font-weight:600}

  .wlist-item{display:flex;align-items:center;gap:.6rem;padding:.66rem .8rem;margin-bottom:.45rem;border-radius:14px;background:#fff;border:1px solid var(--line)}
  .wlist-item .w{flex:1;min-width:0;font-size:.95rem;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wlist-item .w small{display:block;font-size:.62rem;font-weight:700;color:var(--muted);margin-top:.1rem}
  .wlist-item button{width:2.2rem;height:2.2rem;display:grid;place-items:center;border-radius:999px;background:var(--paper2);font-size:.95rem}
  .empty{padding:2rem 1rem;text-align:center;color:var(--muted);font-size:.82rem;font-weight:700;line-height:1.7}

  .toast{position:fixed;left:50%;bottom:calc(1.4rem + env(safe-area-inset-bottom));transform:translate(-50%,12px);z-index:80;max-width:min(88vw,420px);padding:.7rem 1rem;border-radius:999px;background:rgba(48,36,28,.94);color:#fff;font-size:.78rem;font-weight:750;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  .float-stop{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(1.2rem + env(safe-area-inset-bottom));z-index:70;display:none;align-items:center;gap:.5rem;padding:.62rem .95rem;border-radius:999px;background:rgba(48,36,28,.94);color:#fff;font-size:.78rem;font-weight:850;box-shadow:0 10px 26px rgba(40,28,18,.3)}
  .float-stop.show{display:flex}

  @media (min-width:640px){
    .hero h1{font-size:2.3rem}
    .sentence{font-size:1.42rem}
    .controls{gap:.7rem}
  }
</style>
</head>
<body>
<div id="app"></div>

<div class="sheet-wrap" id="sheetWrap" aria-hidden="true">
  <div class="backdrop" data-close-sheet></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="grab"></div>
    <div id="sheetBody"></div>
  </div>
</div>

<div class="float-stop" id="floatStop">
  <span id="floatStopLabel">▶︎ 전체 듣기</span>
  <button data-stop-all>■ 멈추기</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden />

<script>
const BOOKS = [
 {
  "id": "aesop",
  "emoji": "🦊",
  "title": "이솝 우화",
  "en": "Aesop's Fables",
  "author": "Aesop · V. S. Vernon Jones 역",
  "level": "입문 · 5분",
  "blurb": "짧고 또렷한 문장으로 시작하는 따라 읽기",
  "chapters": [
   {
    "id": "the-fox-and-the-grapes",
    "title": "The Fox and the Grapes",
    "ko": "여우와 포도",
    "emoji": "🦊",
    "paras": [

    "ko": "크리스마스 아침",
    "paras": [
     "There was once a velveteen rabbit, and in the beginning he was really splendid. He was fat and bunchy, as a rabbit should be; his coat was spotted brown and white, he had real thread whiskers, and his ears were lined with pink sateen. On Christmas morning, when he sat wedged in the top of the Boy's stocking, with a sprig of holly between his paws, the effect was charming.",
     "There were other things in the stocking, nuts and oranges and a toy engine, and chocolate almonds and a clockwork mouse, but the Rabbit was quite the best of all. For at least two hours the Boy loved him, and then Aunts and Uncles came to dinner, and there was a great rustling of tissue paper and unwrapping of parcels, and in the excitement of looking at all the new presents the Velveteen Rabbit was forgotten.",
     "For a long time he lived in the toy cupboard or on the nursery floor, and no one thought very much about him. He was naturally shy, and being only made of velveteen, some of the more expensive toys quite snubbed him. The mechanical toys were very superior, and looked down upon every one else; they were full of modern ideas, and pretended they were real. The model boat, who had lived through two seasons and lost most of his paint, caught the tone from them and never missed an opportunity of referring to his rigging in technical terms. The Rabbit could not claim to be a model of anything, for he didn't know that real rabbits existed; he thought they were all stuffed with sawdust like himself, and he understood that sawdust was quite out-of-date and should never be mentioned in modern circles. Even Timothy, the jointed wooden lion, who was made by the disabled soldiers, and should have had broader views, put on airs and pretended he was connected with Government. Between them all the poor little Rabbit was made to feel himself very insignificant and commonplace, and the only person who was kind to him at all was the Skin Horse."

     "The Skin Horse had lived longer in the nursery than any of the others. He was so old that his brown coat was bald in patches and showed the seams underneath, and most of the hairs in his tail had been pulled out to string bead necklaces. He was wise, for he had seen a long succession of mechanical toys arrive to boast and swagger, and by-and-by break their mainsprings and pass away, and he knew that they were only toys, and would never turn into anything else. For nursery magic is very strange and wonderful, and only those playthings that are old and wise and experienced like the Skin Horse understand all about it.",
     "\"What is REAL?\" asked the Rabbit one day, when they were lying side by side near the nursery fender, before Nana came to tidy the room. \"Does it mean having things that buzz inside you and a stick-out handle?\"",

     "There was a person called Nana who ruled the nursery. Sometimes she took no notice of the playthings lying about, and sometimes, for no reason whatever, she went swooping about like a great wind and hustled them away in cupboards. She called this \"tidying up,\" and the playthings all hated it, especially the tin ones. The Rabbit didn't mind it so much, for wherever he was thrown he came down soft.",

     "Weeks passed, and the little Rabbit grew very old and shabby, but the Boy loved him just as much. He loved him so hard that he loved all his whiskers off, and the pink lining to his ears turned grey, and his brown spots faded. He even began to lose his shape, and he scarcely looked like a rabbit any more, except to the Boy. To him he was always beautiful, and that was all that the little Rabbit cared about. He didn't mind how he looked to other people, because the nursery magic had made him Real, and when you are Real shabbiness doesn't matter.",

    "ko": "토끼굴 아래로",
    "paras": [
     "Alice was beginning to get very tired of sitting by her sister on the bank, and of having nothing to do: once or twice she had peeped into the book her sister was reading, but it had no pictures or conversations in it, “and what is the use of a book,” thought Alice “without pictures or conversations?”",
     "So she was considering in her own mind (as well as she could, for the hot day made her feel very sleepy and stupid), whether the pleasure of making a daisy-chain would be worth the trouble of getting up and picking the daisies, when suddenly a White Rabbit with pink eyes ran close by her.",
     "There was nothing so very remarkable in that; nor did Alice think it so very much out of the way to hear the Rabbit say to itself, “Oh dear! Oh dear! I shall be late!” (when she thought it over afterwards, it occurred to her that she ought to have wondered at this, but at the time it all seemed quite natural); but when the Rabbit actually took a watch out of its waistcoat-pocket, and looked at it, and then hurried on, Alice started to her feet, for it flashed across her mind that she had never before seen a rabbit with either a waistcoat-pocket, or a watch to take out of it, and burning with curiosity, she ran across the field after it, and fortunately was just in time to see it pop down a large rabbit-hole under the hedge.",
     "In another moment down went Alice after it, never once considering how in the world she was to get out again.",
     "The rabbit-hole went straight on like a tunnel for some way, and then dipped suddenly down, so suddenly that Alice had not a moment to think about stopping herself before she found herself falling down a very deep well.",
     "Either the well was very deep, or she fell very slowly, for she had plenty of time as she went down to look about her and to wonder what was going to happen next. First, she tried to look down and make out what she was coming to, but it was too dark to see anything; then she looked at the sides of the well, and noticed that they were filled with cupboards and bookshelves; here and there she saw maps and pictures hung upon pegs. She took down a jar from one of the shelves as she passed; it was labelled “Orange Marmalade,” but to her great disappointment it was empty: she did not like to drop the jar for fear of killing somebody, so managed to put it into one of the cupboards as she fell past it.",
     "“Well!” thought Alice to herself, “after such a fall as this, I shall think nothing of tumbling down stairs! How brave they’ll all think me at home! Why, I wouldn’t say anything about it, even if I fell off the top of the house!” (Which was very likely true.)",

     "Down, down, down. There was nothing else to do, so Alice soon began talking again. “Dinah’ll miss me very much tonight, I should think!” (Dinah was the cat.) “I hope they’ll remember her saucer of milk at teatime. Dinah my dear! I wish you were down here with me! There are no mice in the air, I’m afraid, but you might catch a bat, and that’s very like a mouse, you know. But do cats eat bats, I wonder?” And here Alice began to get rather sleepy, and went on saying to herself, in a dreamy sort of way, “Do cats eat bats? Do cats eat bats?” and sometimes, “Do bats eat cats?” for, you see, as she couldn’t answer either question, it didn’t much matter which way she put it. She felt that she was dozing off, and had just begun to dream that she was walking hand in hand with Dinah, and saying to her very earnestly, “Now, Dinah, tell me the truth: did you ever eat a bat?” when suddenly, thump! thump! down she came upon a heap of sticks and dry leaves, and the fall was over.",
     "Alice was not a bit hurt, and she jumped up on to her feet in a moment: she looked up, but it was all dark overhead; before her was another long passage, and the White Rabbit was still in sight, hurrying down it. There was not a moment to be lost: away went Alice like the wind, and was just in time to hear it say, as it turned a corner, “Oh my ears and whiskers, how late it’s getting!” She was close behind it when she turned the corner, but the Rabbit was no longer to be seen: she found herself in a long, low hall, which was lit up by a row of lamps hanging from the roof.",

/* ---------------- sentence splitting ---------------- */
const ABBR = new Set(['mr', 'mrs', 'ms', 'dr', 'st', 'prof', 'sr', 'jr', 'vs', 'etc', 'no', 'mt', 'capt', 'col', 'gen', 'lt', 'sgt', 'rev', 'hon', 'fig', 'ch', 'p', 'e.g', 'i.e', 'a.m', 'p.m']);

function splitSentences(par) {
  const t = String(par || '').replace(/\s+/g, ' ').trim();
  if (!t) return [];
  const out = [];
  let start = 0;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (c !== '.' && c !== '!' && c !== '?') continue;
    if (c === '.' && t[i + 1] === '.') continue;            // "..." run
    let j = i + 1;
    while (j < t.length && /["'”’)\]]/.test(t[j])) j++;      // closing quotes/brackets
    if (j < t.length && !/\s/.test(t[j])) { i = j - 1; continue; }  // 3.5 , U.S. etc.
    const raw = t.slice(start, j).trim();
    const lastWord = (raw.match(/([A-Za-z.]+)\.$/) || [])[1];
    if (c === '.' && lastWord && ABBR.has(lastWord.toLowerCase())) { i = j - 1; continue; }
    const nextCh = (t.slice(j).match(/^\s*([\s\S])/) || [])[1];
    if (nextCh && !/[A-Z0-9"“'‘(\[]/.test(nextCh)) { i = j - 1; continue; }  // lowercase continues
    if (raw) out.push(raw);
    start = j; i = j - 1;
  }
  const rest = t.slice(start).trim();
  if (rest) out.push(rest);
  return out;
}

const SCACHE = {};
function sents(book, ch) {
  const k = book.id + '/' + ch.id;
  if (SCACHE[k]) return SCACHE[k];
  const out = [];
  (ch.paras || []).forEach((p, pi) => {
    splitSentences(p).forEach(t => out.push({ t: t, pi: pi }));
  });
  SCACHE[k] = out;
  return out;
}

/* ---------------- books / progress ---------------- */
function allBooks() { return BOOKS.concat(ST.books || []); }
function getBook(id) { return allBooks().filter(b => b.id === id)[0] || null; }

function pkey(b, c) { return b.id + '/' + c.id; }
function pget(b, c) { const k = pkey(b, c); if (!ST.prog[k]) ST.prog[k] = { done: {}, last: 0 }; return ST.prog[k]; }
function doneRead(b, c) { return ST.prog[pkey(b, c)] || null; }
function chapterDone(b, c) {
  const p = doneRead(b, c); const n = sents(b, c).length; let k = 0;
  if (p) for (const i in p.done) if (+i < n) k++;
  return k;
}
function bookTotals(b) {
  let total = 0, done = 0;
  (b.chapters || []).forEach(c => { total += sents(b, c).length; done += chapterDone(b, c); });
  return { total: total, done: done, pct: total ? Math.round(done / total * 100) : 0 };
}
function stats() {
  const start = todayStart();
  let total = 0, done = 0, today = 0;
  allBooks().forEach(b => (b.chapters || []).forEach(c => {
    const list = sents(b, c); total += list.length;
    const p = doneRead(b, c); if (!p) return;
    for (const i in p.done) {
      if (+i >= list.length) continue;
      done++;
      if (((p.done[i] || {}).at || 0) >= start) today++;
    }
  }));
  return { total: total, done: done, today: today, words: (ST.words || []).length };
}
function markDone(b, c, idx, acc) {
  const p = pget(b, c);
  const prev = p.done[idx];
  p.done[idx] = { acc: Math.round((acc || 0) * 100), at: (prev && prev.at) || Date.now() };
  p.last = idx; save();
}
function touchLast(b, c, idx) {
  const p = pget(b, c); p.last = idx; save();
}
function resumePoint(b) {
  let best = null;
  (b.chapters || []).forEach(c => {
    const p = doneRead(b, c); if (!p) return;
    const at = Object.keys(p.done).reduce((m, k) => Math.max(m, (p.done[k] || {}).at || 0), 0) || ((p.last || 0) > 0 ? 1 : 0);
    const hasAny = Object.keys(p.done).length > 0 || (p.last || 0) > 0;
    if (hasAny && (!best || at > best.at)) best = { c: c, i: p.last || 0, at: at };
  });
  if (!best) best = { c: b.chapters[0], i: 0, at: 0 };
  const list = sents(b, best.c);
  if (best.i >= list.length) best.i = Math.max(0, list.length - 1);
  return best;
}

/* ---------------- routing ---------------- */
let ROUTE = { view: 'lib' };
let DEPTH = 0;
function renderAll() {
  const app = $('#app');
  stopAllPlay();
  if (ROUTE.view === 'book') {
    const b = getBook(ROUTE.bid);
    if (!b) { ROUTE = { view: 'lib' }; return renderAll(); }
    app.innerHTML = viewBook(b); bindBook(b);
  } else if (ROUTE.view === 'reader') {
    const b = getBook(ROUTE.bid), c = getChap(b, ROUTE.cid);
    if (!b || !c) { ROUTE = { view: 'lib' }; return renderAll(); }
    RT.bookId = b.id; RT.chapId = c.id;
    const list = sents(b, c);
    RT.i = Math.max(0, Math.min(ROUTE.i || 0, Math.max(0, list.length - 1)));
    RT.fb = null; RT.heard = null; RT.marks = null; RT.acc = null; RT.recActive = false;
    app.innerHTML = readerHTML(); bindReader();
    document.title = c.title + ' · 원서 따라 읽기';
  } else if (ROUTE.view === 'add') {
    app.innerHTML = viewAdd(ROUTE.bid); bindAdd(ROUTE.bid);
  } else if (ROUTE.view === 'words') {
    app.innerHTML = viewWords(); bindWords();
  } else {
    app.innerHTML = viewLib(); bindLib();
    document.title = '📖 원서 따라 읽기';
  }
  window.scrollTo(0, 0);
  updateStopBar();
}
function go(route, replace) {
  ROUTE = route;
  try {
    if (replace) history.replaceState(route, '', location.href);
    else { history.pushState(route, '', location.href); DEPTH++; }
  } catch (e) {}

}
function back() {
  if (DEPTH > 0) { try { history.back(); return; } catch (e) {} }
  go({ view: 'lib' }, true);
}
window.addEventListener('popstate', e => {
  DEPTH = Math.max(0, DEPTH - 1);

function scoreSentence(text, heard) {
  const tokens = String(text || '').split(/\s+/).filter(Boolean);
  const exp = [], map = [];
  tokens.forEach(function (tok, k) {
    cmpParts(tok).forEach(function (part) { exp.push(part); map.push(k); });
  });
  const heardTokens = normSpeech(heard).split(' ').filter(Boolean)
    .map(function (w) { return w.replace(/'/g, ''); });
  const raw = alignMarks(exp, heardTokens);
  const marks = new Array(tokens.length).fill(false);
  let matched = 0;
  exp.forEach(function (w, i) { if (raw[i]) { matched++; marks[map[i]] = true; } });
  tokens.forEach(function (tok, k) { if (!cmpParts(tok).length) marks[k] = true; });
  const total = exp.length || 1;
  return { marks: marks, acc: matched / total, matched: matched, total: total };
}

async function toggleAll() {
  if (ALLON) { stopAllPlay(); return; }
  stopAudio();
  const seq = TTS.seq;
  ALLON = true; updateStopBar();
  const list = curSents();
  for (let i = RT.i; i < list.length; i++) {
    if (!ALLON || seq !== TTS.seq) break;

function startRec() {
  const b = curBook(), c = curChap(); if (!b || !c) return;
  if (RT.recActive) return;
  if (!recSupported()) {
    toast('이 브라우저에서는 마이크 인식을 쓸 수 없어요 · “읽기 완료”로 표시해 주세요');
    return;
  }
  stopAllPlay();
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec;
  try { rec = new Rec(); } catch (e) { toast('마이크를 켤 수 없어요'); return; }
  const s = curSents()[RT.i]; if (!s) return;
  rec.lang = 'en-US'; rec.interimResults = false; rec.continuous = false; rec.maxAlternatives = 1;
  RT.recActive = true; RT.rec = rec; RT.fb = null; RT.marks = null;
  renderReader(true);
  let finished = false;
  rec.onresult = ev => {
    if (finished) return; finished = true;
    let heard = '';
    try { heard = (ev.results && ev.results[0] && ev.results[0][0] && ev.results[0][0].transcript) || ''; } catch (e) {}
    const sc = scoreSentence(s.t, heard);
    RT.recActive = false; RT.heard = heard; RT.marks = sc.marks; RT.acc = sc.acc;
    const pct = Math.round(sc.acc * 100);
    if (sc.acc >= 0.75) {
      markDone(b, c, RT.i, sc.acc);
      setFb('ok', '<span class="pct">' + pct + '%</span> 정확해요! ' + sc.matched + '/' + sc.total + ' 단어를 알아들었어요. ✅ 이 문장 완료!' +
        (heard ? '<span class="heard">들린 문장: “' + esc(heard) + '”</span>' : '') + nextBtnHTML());
      try { rec.stop(); } catch (e) {}
      renderReader(true);
      maybeAutoNext();
    } else {
      setFb('bad', '<span class="pct">' + pct + '%</span> 조금만 더 또박또박 읽어 볼까요? 빨간 단어를 다시 읽어 보세요.' +
        (heard ? '<span class="heard">들린 문장: “' + esc(heard) + '”</span>' : '<span class="heard">소리가 잘 들리지 않았어요. 조금 크게 읽어 주세요.</span>'));
      try { rec.stop(); } catch (e) {}
      renderReader(true);
    }
  };
  rec.onerror = ev => {
    if (finished) return; finished = true;
    RT.recActive = false;
    const code = (ev && ev.error) || '';
    if (code === 'not-allowed' || code === 'service-not-allowed') {
      setFb('warn', '마이크 사용이 허용되지 않았어요. 주소창의 마이크 권한을 허용하거나, <b>✅ 읽기 완료</b>로 표시해 주세요.');
    } else if (code === 'no-speech') {
      setFb('warn', '소리가 들리지 않았어요. 🎤를 다시 누르고 조금 크게 읽어 보세요.');
    } else {
      setFb('warn', '잘 듣지 못했어요. 다시 한 번 눌러 볼까요?');
    }
    renderReader(true);
  };
  rec.onend = () => {
    RT.recActive = false;
    if (!finished) {
      finished = true;
      if (!RT.fb) setFb('warn', '잘 듣지 못했어요. 🎤를 다시 눌러 읽어 보세요.');
      renderReader(true);
    }
  };
  try { rec.start(); }
  catch (e) {
    RT.recActive = false;
    toast('마이크를 켤 수 없어요 · 권한을 확인해 주세요');
    renderReader(true);
  }
}

/* =========================================================
   sheets
   ========================================================= */
let SHEET_BOOK = null;
function openSheet(kind, book) {
  SHEET_BOOK = book || null;
  const body = $('#sheetBody');
  if (kind === 'settings') body.innerHTML = settingsHTML();
  else if (kind === 'bookmenu') body.innerHTML = bookMenuHTML(book);
  $('#sheetWrap').classList.add('show');
  $('#sheetWrap').setAttribute('aria-hidden', 'false');
}
function closeSheet() {
  $('#sheetWrap').classList.remove('show');
  $('#sheetWrap').setAttribute('aria-hidden', 'true');
}
function wordSaved(w) { return (ST.words || []).some(x => x.w.toLowerCase() === String(w).toLowerCase()); }
function openWord(w) {
  if (!w) return;
  $('#sheetBody').innerHTML = wordHTML(w);
  $('#sheetWrap').classList.add('show');
  $('#sheetWrap').setAttribute('aria-hidden', 'false');
}
function wordHTML(w) {
  const saved = wordSaved(w);
  const q = encodeURIComponent(w);
  return '<h3 class="serif">' + esc(w) + '</h3>' +
    '<p class="sub">문장 속 단어예요. 발음을 듣고 뜻은 사전에서 확인해 보세요.</p>' +
    '<div class="sheet-row">' +
      '<button class="btn btn-primary" data-say="' + esc(w) + '">🔊 발음 듣기</button>' +
      '<a class="btn btn-line" href="https://en.dict.naver.com/#/search?query=' + q + '" target="_blank" rel="noopener">📖 네이버 사전</a>' +
    '</div>' +
    '<button class="btn btn-star' + (saved ? ' on' : '') + '" data-save="' + esc(w) + '" style="width:100%">' + (saved ? '★ 내 단어장에 저장됨' : '☆ 내 단어장에 저장') + '</button>' +
    '<p class="sheet-note">단어장은 서재 위 ⭐에서 모아 볼 수 있어요.</p>';
}
function settingsHTML() {
  const st = stats();
  return '<h3>설정</h3>' +
    '<p class="sub">기록은 이 기기 브라우저에만 저장돼요. 폰을 바꾸기 전에는 백업해 두세요.</p>' +
    '<div class="sheet-row"><button class="btn btn-line" data-act="autoNext">자동 넘김 · ' + (ST.settings.autoNext ? '켜짐' : '꺼짐') + '</button></div>' +
    '<div class="sheet-row"><button class="btn btn-line" data-act="export">⬇︎ 기록 백업 (JSON)</button><button class="btn btn-line" data-act="import">⬆︎ 백업 복원</button></div>' +
    '<div class="sheet-row"><button class="btn btn-line" data-act="reset" style="color:#a8453a">학습 기록 초기화</button></div>' +
    '<p class="sheet-note">완료한 문장 ' + st.done + ' / ' + st.total + ' · 저장한 단어 ' + st.words + '개<br />수록 작품: 이솝 우화 · 벨벳 토끼 · 이상한 나라의 앨리스 (퍼블릭 도메인)</p>' +
    '<p class="sheet-note">마이크가 안 되면 iPhone은 사파리에서 열어 주세요. 홈 화면에 추가하면 앱처럼 열려요.</p>';
}
function bookMenuHTML(b) {
  if (!b) return settingsHTML();
  const custom = !!b.custom;
  return '<h3>' + esc(b.title) + '</h3>' +
    '<p class="sub">' + esc(b.en || '') + '</p>' +
    (custom ? '<div class="sheet-row"><button class="btn btn-line" data-act="addChapter">＋ 이 책에 장 추가</button></div>' : '') +
    '<div class="sheet-row"><button class="btn btn-line" data-act="clearBook" style="color:#a8453a">이 책의 읽기 기록 지우기</button></div>' +
    (custom ? '<div class="sheet-row"><button class="btn btn-line" data-act="delBook" style="color:#a8453a">서재에서 이 책 삭제</button></div>' : '') +
    '<p class="sheet-note">' + (custom ? '내가 추가한 원서는 이 기기에만 저장돼요.' : '원문은 앱에 들어 있어요. 기록만 지우면 처음부터 다시 읽을 수 있어요.') + '</p>';
}
$('#sheetBody').addEventListener('click', e => {
  const say = e.target.closest('[data-say]');
  if (say) { sayWord(say.getAttribute('data-say')); return; }
  const sv = e.target.closest('[data-save]');
  if (sv) {
    const w = sv.getAttribute('data-save');
    if (wordSaved(w)) {
      ST.words = ST.words.filter(x => x.w.toLowerCase() !== w.toLowerCase());
      toast('단어장에서 뺐어요');
    } else {
      ST.words.unshift({ w: w, at: Date.now() });
      toast('단어장에 저장했어요 ★');
    }
    save();
    $('#sheetBody').innerHTML = wordHTML(w);
    return;
  }
  const act = e.target.closest('[data-act]');
  if (act) doSheetAct(act.getAttribute('data-act'));
});
$('#sheetWrap').addEventListener('click', e => { if (e.target.closest('[data-close-sheet]')) closeSheet(); });
$('#floatStop').addEventListener('click', e => { if (e.target.closest('[data-stop-all]')) stopAllPlay(); });

function doSheetAct(act) {
  if (act === 'autoNext') {
    ST.settings.autoNext = !ST.settings.autoNext; save();
    $('#sheetBody').innerHTML = settingsHTML();
    toast(ST.settings.autoNext ? '따라 읽기 성공하면 다음 문장으로 넘어가요' : '자동 넘김을 껐어요');
  } else if (act === 'export') {
    exportBackup(); closeSheet();
  } else if (act === 'import') {
    const f = $('#importFile'); if (f) f.click();
  } else if (act === 'reset') {
    if (!confirm('완료한 문장과 저장한 단어를 모두 지울까요? (내가 추가한 원서는 그대로 남아요)')) return;
    ST.prog = {}; ST.words = []; ST.settings.last = null; save();
    closeSheet(); renderAll(); toast('학습 기록을 초기화했어요');
  } else if (act === 'addChapter') {
    const b = SHEET_BOOK; closeSheet();
    if (b) go({ view: 'add', bid: b.id });
  } else if (act === 'clearBook') {
    const b = SHEET_BOOK; if (!b) return;
    if (!confirm('“' + b.title + '”의 읽기 기록을 지울까요?')) return;
    (b.chapters || []).forEach(c => { delete ST.prog[pkey(b, c)]; });
    save(); closeSheet(); renderAll(); toast('이 책의 읽기 기록을 지웠어요');
  } else if (act === 'delBook') {
    const b = SHEET_BOOK; if (!b || !b.custom) return;
    if (!confirm('“' + b.title + '”을(를) 서재에서 삭제할까요?')) return;
    (b.chapters || []).forEach(c => { delete ST.prog[pkey(b, c)]; });
    ST.books = ST.books.filter(x => x.id !== b.id);
    save(); closeSheet(); go({ view: 'lib' }); toast('서재에서 삭제했어요');
  }
}
function exportBackup() {
  try {
    const blob = new Blob([JSON.stringify(ST, null, 1)], { type: 'application/json' });
    const a = document.createElement('a');
    const d = new Date();
    const pad = n => (n < 10 ? '0' + n : '' + n);
    a.href = URL.createObjectURL(blob);
    a.download = '원서따라읽기-백업-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('백업 파일을 내려받았어요');
  } catch (e) { toast('백업 파일을 만들지 못했어요'); }
}
$('#importFile').addEventListener('change', ev => {
  const f = ev.target.files && ev.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(String(r.result || '{}'));
      if (!data || typeof data !== 'object') throw new Error('bad');
      if (!confirm('지금 기록을 백업 파일 내용으로 바꿀까요?')) return;
      ST = Object.assign(clone(DEF_ST), data);
      ST.settings = Object.assign(clone(DEF_ST.settings), data.settings || {});
      ST.prog = data.prog || {}; ST.books = data.books || []; ST.words = data.words || [];
      save(); closeSheet(); renderAll(); toast('백업을 불러왔어요');
    } catch (e) { toast('백업 파일을 읽지 못했어요'); }
  };
  r.readAsText(f);
  ev.target.value = '';
});

/* =========================================================
   words / add
   ========================================================= */
function viewWords() {
  const words = ST.words || [];
  const list = words.length
    ? words.map((x, i) => '<div class="wlist-item"><span class="w" data-word="' + esc(x.w) + '">' + esc(x.w) +
        '<small>' + (x.at ? new Date(x.at).toLocaleDateString('ko-KR') + ' 저장' : '') + '</small></span>' +
        '<button data-say2="' + esc(x.w) + '" aria-label="발음">🔊</button>' +
        '<button data-del-word="' + i + '" aria-label="삭제">✕</button></div>').join('')
    : '<div class="empty">아직 저장한 단어가 없어요.<br />문장 속 단어를 톡 누르면 여기에 모여요.</div>';
  return '<div class="topbar">' +
      '<button class="tb-nav" data-back aria-label="뒤로">‹</button>' +
      '<div class="tb-body"><span class="tb-title">⭐ 내 단어장</span><span class="tb-sub">' + words.length + '개 · 톡 눌러 발음과 사전</span></div>' +
    '</div>' +
    '<div class="shell screen">' + list +
      (words.length ? '<p class="foot">단어를 누르면 발음과 네이버 사전을 볼 수 있어요. ✕는 삭제예요.</p>' : '') +
    '</div>';
}
function bindWords() {
  $$('[data-back]').forEach(el => el.addEventListener('click', back));
  $$('[data-say2]').forEach(el => el.addEventListener('click', () => { sayWord(el.getAttribute('data-say2')); }));
  $$('[data-del-word]').forEach(el => el.addEventListener('click', () => {
    const i = +el.getAttribute('data-del-word');
    ST.words.splice(i, 1); save(); renderAll();
  }));
  $$('[data-word]').forEach(el => el.addEventListener('click', () => openWord(el.getAttribute('data-word'))));
}

function viewAdd(bid) {
  const b = bid ? getBook(bid) : null;
  const isChap = !!(b && b.custom);
  return '<div class="topbar">' +
      '<button class="tb-nav" data-back aria-label="뒤로">‹</button>' +
      '<div class="tb-body"><span class="tb-title">' + (isChap ? '장 추가' : '내 원서 추가') + '</span><span class="tb-sub">' + (isChap ? esc(b.title) : '붙여넣은 글도 똑같이 따라 읽어요') + '</span></div>' +
    '</div>' +
    '<div class="shell screen">' +
      '<p class="hint" style="margin-top:0">붙여넣은 글은 문장 단위로 자동으로 나뉘어요. 문단은 빈 줄로 구분하고, 줄바꿈은 문장 안에서 이어 붙여요.</p>' +
      (isChap ? '' : '<div class="field"><label>책 제목</label><input id="fTitle" type="text" placeholder="예: Diary of a Wimpy Kid" /></div>') +
      '<div class="field"><label>장 제목' + (isChap ? '' : ' (선택)') + '</label><input id="fChap" type="text" placeholder="예: Chapter 1 · September" /></div>' +
      '<div class="field"><label>영어 본문</label><textarea id="fText" placeholder="영어 지문을 붙여넣으세요. 아이폰 라이브 텍스트로 찍은 페이지도 좋아요."></textarea>' +
        '<div class="help">같은 화면에서 듣기 · 따라 읽기 · 단어 사전을 그대로 쓸 수 있어요.</div></div>' +
      '<button class="primary-wide" id="btnSaveBook">' + (isChap ? '이 책에 장 추가' : '서재에 추가') + '</button>' +
    '</div>';
}
function bindAdd(bid) {
  $$('[data-back]').forEach(el => el.addEventListener('click', back));
  on('#btnSaveBook', 'click', () => {
    const titleEl = $('#fTitle'), chapEl = $('#fChap'), textEl = $('#fText');
    const text = textEl ? textEl.value : '';
    const paras = text.split(/\n\s*\n/).map(p => p.replace(/-\s*\n\s*/g, '').replace(/\s*\n\s*/g, ' ').replace(/\s+/g, ' ').trim()).filter(Boolean);
    if (!paras.length) { toast('본문을 먼저 붙여넣어 주세요'); if (textEl) textEl.focus(); return; }
    const nSents = paras.reduce((n, p) => n + splitSentences(p).length, 0);
    if (nSents === 0) { toast('영어 문장을 찾지 못했어요'); return; }
    const chapTitle = (chapEl && chapEl.value.trim()) || 'Chapter 1';
    const b = bid ? getBook(bid) : null;
    if (b && b.custom) {
      b.chapters.push({ id: 'c' + Date.now(), title: chapTitle, ko: '', paras: paras });
      save();
      toast(nSents + '문장을 추가했어요');
      go({ view: 'book', bid: b.id }, true);
      return;
    }
    const title = (titleEl && titleEl.value.trim()) || '내 원서';
    const id = 'my' + Date.now();
    const nb = { id: id, custom: true, emoji: '📝', title: title, en: '', author: '내가 추가한 원서', level: '내 원서', blurb: '', chapters: [{ id: id + '-1', title: chapTitle, ko: '', paras: paras }] };
    ST.books.unshift(nb); save();
    toast(nSents + '문장을 서재에 담았어요');
    go({ view: 'book', bid: id }, true);
  });
}

/* =========================================================
   boot
   ========================================================= */
try { history.replaceState({ view: 'lib' }, '', location.href); } catch (e) {}
renderAll();

</script>
</body>
</html>
